name: AA canary

on:
  schedule:
    # Every four hours, offset from the top of the hour to avoid GitHub's
    # highest scheduled-workflow load.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: aa-canary
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - name: Gate canary on final AA qualification
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let active = false;
            let detail = 'qualification #80 is not complete';
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 80,
              });
              active = issue.state === 'closed' && issue.state_reason === 'completed';
              detail = active
                ? 'qualification #80 is complete'
                : `qualification #80 state=${issue.state}, reason=${issue.state_reason || 'none'}`;
            } catch (error) {
              core.warning(
                `Unable to verify final qualification #80; canary stays inactive: ${error.message}`
              );
              detail = 'qualification #80 could not be verified';
            }

            core.setOutput('active', active ? 'true' : 'false');
            core.notice(
              active
                ? 'AA canary activated by completed final qualification #80.'
                : `AA canary cleanly skipped: ${detail}.`
            );
            await core.summary
              .addHeading('AA canary activation')
              .addRaw(active ? 'ACTIVE' : 'NOT READY')
              .addEOL()
              .addRaw(detail)
              .write();

  canary:
    needs: activation
    if: needs.activation.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify complete repository contract
        shell: bash
        run: bash scripts/verify.sh

      - name: Smoke real local OpenCode server lifecycle
        shell: bash
        run: |
          set -euo pipefail
          command -v opencode >/dev/null
          python -m pytest -q \
            tests/test_opencode_integration.py::test_spawned_server_shuts_down_gracefully \
            tests/test_opencode_integration.py::test_attach_mode_never_kills_foreign_server

      - name: Gate C smoke - exact production conversation path
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
        run: |
          set -euo pipefail
          # Bounded current-main canary (every 4h): Gate C smoke through the
          # exact production Telegram adapter boundary with scenario families
          # and response-diversity assertion, privacy-safe per-stage
          # outcomes/latency only. Missing secrets fail closed (no mocked PASS).
          sha="$(git rev-parse HEAD)"
          # Repository-owned live evidence first (real local OpenCode process,
          # real provider/model policy, real RU corpus + production index,
          # synthetic Updates at the production adapter boundary), consumed
          # by the self-proving Gate C live mapping below. Missing
          # secrets/assets fail closed (no mocked PASS).
          python scripts/run_product_contract_live_qualification.py \
            --main-sha "$sha" --out-dir live-out \
            --run-id "${{ github.run_id }}-canary"
          python scripts/run_self_proving_qualification.py \
            --main-sha "$sha" --out-dir canary-self-proving-out \
            --run-id "${{ github.run_id }}-canary"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          summary = Path("canary-self-proving-out/self-proving-summary.json")
          if not summary.is_file():
              print("canary Gate C smoke BLOCKED: no summary", file=sys.stderr)
              sys.exit(2)
          payload = json.loads(summary.read_text(encoding="utf-8"))
          gates = {g["gate"]: g["status"] for g in payload.get("gates", [])}
          print(f"canary gates: {gates}")
          # Fail-closed Gate C smoke + diversity requirement: the canary
          # passes only when the live Gate C production path (scenario
          # families + diversity) holds PASS for current main. A live Gate
          # C BLOCKED/FAIL fails the canary even when deterministic Gates
          # A/B PASS. Missing secrets stay BLOCKED (no mocked PASS) so
          # automatic P0 repair marks current main UNQUALIFIED. The canary
          # never blocks owner /run; manual testing stays available labeled
          # UNQUALIFIED.
          if payload.get("status") != "PASS":
              print(
                  f"canary Gate C smoke FAILED: verdict={payload.get('status')} "
                  f"blocking={payload.get('blocking_gate')}",
                  file=sys.stderr,
              )
              sys.exit(1 if payload.get("status") == "FAIL" else 2)
          for required in ("A", "B", "C"):
              if gates.get(required) != "PASS":
                  print(f"canary Gate C smoke FAILED: Gate {required}={gates.get(required)}", file=sys.stderr)
                  sys.exit(1 if gates.get(required) == "FAIL" else 2)
          PY

      - name: Gate D readiness - Telegram getMe and runtime marker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Gate D readiness for the canary: real bot token, getMe with
          # bounded 403 retry (>= 5s base), and a durable STARTING -> READY
          # marker published for this canary run id/SHA.
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error::Canary Gate D BLOCKED: TELEGRAM_BOT_TOKEN is not configured."
            exit 2
          fi

          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsS --max-time 15 --retry 2 --retry-delay 2 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Telegram Bot API readiness probe failed."
              exit 1
            fi
            sleep $((attempt * 5))
          done

          TELEGRAM_PROBE="$response" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["TELEGRAM_PROBE"])
          if payload.get("ok") is not True:
              raise SystemExit("Telegram Bot API returned ok != true")
          result = payload.get("result") or {}
          if not result.get("id") or result.get("is_bot") is not True:
              raise SystemExit("Telegram Bot API identity payload is invalid")
          print("Telegram Bot API readiness: OK")
          PY
          # A bare getMe + write_marker without the live Application is
          # forbidden: READY is published only from the running app after
          # proving OpenCode health, transport.running with a live poll
          # task, and webhook/commands bootstrap, then stopped cleanly
          # with no leaked poll task.
          sha="$(git rev-parse HEAD)"
          CANARY_SHA="$sha" CANARY_RUN="${{ github.run_id }}-canary" python - <<'PY'
          import asyncio
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, "src")
          from aa.app import create_application
          from aa.config import Settings
          from aa.control.runtime_status import RuntimeMarker, write_marker
          from aa.telegram.transport import PollingTelegramTransport

          async def _active_telegram_poller_running(token: str) -> bool:
              """Return True when another Telegram poller holds getUpdates (409)."""
              import urllib.error
              import urllib.request

              token = (token or "").strip()
              if not token:
                  return False
              url = f"https://api.telegram.org/bot{token}/getUpdates?timeout=0&limit=1"

              def _check() -> bool:
                  req = urllib.request.Request(url, method="GET")
                  try:
                      with urllib.request.urlopen(req, timeout=10):
                          return False
                  except urllib.error.HTTPError as exc:
                      if exc.code == 409:
                          return True
                      return False
                  except Exception:
                      return False

              return await asyncio.to_thread(_check)

          async def _probe() -> None:
              sha = os.environ["CANARY_SHA"]
              run_id = os.environ["CANARY_RUN"]
              out = Path("canary-runtime-status.json")
              starting = RuntimeMarker(run_id=run_id, sha=sha, phase="STARTING", timestamp_s=time.time())
              write_marker(out, starting)
              print(f"canary runtime marker STARTING published run={run_id} sha={sha[:12]}")
              settings = Settings.from_env(None)
              assert settings.has_bot_token, "Canary Gate D BLOCKED: bot token missing for Application"
              app = create_application(settings)
              assert isinstance(app.transport, PollingTelegramTransport), (
                  "Canary Gate D BLOCKED: Application is not using real PollingTelegramTransport"
              )
              try:
                  active = await _active_telegram_poller_running(settings.telegram_bot_token)
                  assert not active, "Canary Gate D BLOCKED: owner runtime poller active; retry when idle to avoid getUpdates conflict"
                  await app.start()
              except Exception as exc:
                  failed = RuntimeMarker(run_id=run_id, sha=sha, phase="FAILED", timestamp_s=time.time())
                  write_marker(out, failed)
                  raise SystemExit(f"Canary Gate D BLOCKED: Application.start failed: {type(exc).__name__}")
              try:
                  assert app.running, "Application not running after start"
                  assert app.opencode_runtime.running, "OpenCode runtime not running"
                  assert app.opencode_runtime.ready, "OpenCode health not ready"
                  transport = app.transport
                  assert isinstance(transport, PollingTelegramTransport)
                  assert transport.running, "transport.running is not live"
                  poll_task = getattr(transport, "_poll_task", None)
                  assert poll_task is not None, "live poll task missing"
                  assert not poll_task.done(), "poll task already done; polling not live"
                  bot_info = transport.bot_info
                  assert isinstance(bot_info, dict) and bot_info.get("is_bot") is True, "getMe identity not live"
                  handlers = getattr(transport, "_command_handlers", {})
                  assert "start" in handlers and "new" in handlers, "webhook/commands bootstrap incomplete"
                  assert app.readiness_marker, "READY was not published from the running app"
                  assert "READY" in app.readiness_marker, "running app readiness is not READY"
                  ready = RuntimeMarker(run_id=run_id, sha=sha, phase="READY", timestamp_s=time.time())
                  write_marker(out, ready)
                  print(f"canary runtime marker READY published from live app run={run_id} sha={sha[:12]}")
                  print(f"polling live: transport.running={transport.running} poll_task_live={not poll_task.done()}")
              finally:
                  await app.stop()
                  leaked = [t for t in asyncio.all_tasks() if t.get_name() == "telegram-polling" and not t.done()]
                  assert not app.running, "Application leaked running state after stop"
                  assert not app.transport.running, "transport leaked running state after stop"
                  assert not leaked, f"poll task leaked: {len(leaked)} live telegram-polling tasks"
                  print("Application stopped cleanly with no leaked poll task")
              stopped = RuntimeMarker(run_id=run_id, sha=sha, phase="STOPPED", timestamp_s=time.time())
              write_marker(out, stopped)
              print(f"canary runtime marker STOPPED published run={run_id} sha={sha[:12]}")

          asyncio.run(_probe())
          PY

      - name: Gate E latency guard - p50/p95 and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          # Gate E for the canary: end-to-end and per-stage latency p50/p95
          # from Gate C smoke; hard guard fails on any ordinary turn >= 30s;
          # typing heartbeat continuity verified independently.
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("canary-self-proving-out/self-proving-summary.json")
          if not path.is_file():
              print("canary Gate E BLOCKED: no latency evidence", file=sys.stderr)
              sys.exit(2)
          summary = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({"blocking_gate": summary.get("blocking_gate"), "result": summary.get("status")}))
          gates = {g.get("gate"): g for g in summary.get("gates", [])}
          gate_e = gates.get("E")
          if gate_e is None:
              print("canary Gate E BLOCKED: missing Gate E evidence", file=sys.stderr)
              sys.exit(2)
          if gate_e.get("status") != "PASS":
              print(f"canary Gate E BLOCKED: status={gate_e.get('status')}", file=sys.stderr)
              sys.exit(2 if gate_e.get("status") in ("BLOCKED", "STALE") else 1)
          try:
              p50 = float(gate_e.get("latency_p50_ms", 0.0))
              p95 = float(gate_e.get("latency_p95_ms", 0.0))
              max_turn = float(gate_e.get("max_turn_ms", 0.0))
          except (TypeError, ValueError):
              print("canary Gate E BLOCKED: latency evidence is not numeric", file=sys.stderr)
              sys.exit(2)
          # Sample-count guard: zero/negative latencies mean no live samples.
          if p50 <= 0 or p95 <= 0 or max_turn <= 0:
              print(
                  f"canary Gate E BLOCKED: no live latency samples (p50={p50} p95={p95} max={max_turn})",
                  file=sys.stderr,
              )
              sys.exit(2)
          # Hard SLO guard (machine-enforced): p95 target 15s, ordinary-turn
          # budget 30s. Any ordinary turn >= 30s fails, as does p95 > 15s.
          if p95 > 15000:
              print(f"canary Gate E FAIL: p95 {p95:.0f}ms exceeds 15000ms target", file=sys.stderr)
              sys.exit(1)
          if max_turn >= 30000:
              print(f"canary Gate E FAIL: ordinary turn {max_turn:.0f}ms >= 30000ms budget", file=sys.stderr)
              sys.exit(1)
          # Typing heartbeat continuity is verified independently from the
          # live transport lane evidence: heartbeat must have fired during
          # the live production path, never a dead gap. Missing heartbeat
          # evidence blocks the canary.
          live_path = Path("live-out/product-contract-live-summary.json")
          if not live_path.is_file():
              print("canary Gate E BLOCKED: no live transport evidence for heartbeat", file=sys.stderr)
              sys.exit(2)
          live = json.loads(live_path.read_text(encoding="utf-8"))
          transport_lane = next(
              (lane for lane in live.get("lanes", []) if lane.get("lane") == "telegram-transport-25-32"),
              None,
          )
          if transport_lane is None:
              print("canary Gate E BLOCKED: missing live transport lane", file=sys.stderr)
              sys.exit(2)
          try:
              heartbeat_sends = int((transport_lane.get("metrics", {}) or {}).get("heartbeat_sends", 0))
          except (TypeError, ValueError):
              print("canary Gate E BLOCKED: heartbeat evidence is not numeric", file=sys.stderr)
              sys.exit(2)
          if heartbeat_sends < 1:
              print(
                  f"canary Gate E BLOCKED: heartbeat never fired (sends={heartbeat_sends})",
                  file=sys.stderr,
              )
              sys.exit(2)
          print(f"canary Gate E PASS: p50={p50:.0f}ms p95={p95:.0f}ms max={max_turn:.0f}ms heartbeat_sends={heartbeat_sends}")
          PY

      - name: Record canary summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AA canary"
            echo
            echo "- final activation gate: qualification #80 completed"
            echo "- repository verification: executed"
            echo "- real local OpenCode server lifecycle: executed"
            echo "- Gate C smoke (exact production path, scenario families, diversity): executed"
            echo "- Gate D readiness (Telegram Bot API getMe probe + STARTING -> READY marker): executed"
            echo "- Gate E latency guard (p50/p95, 30s budget, heartbeat continuity): executed"
            echo "- product release: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
