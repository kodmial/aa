name: AA production canary

# Authoritative 4-hour production canary for issue #82. Blocked by #6 until
# the exact-current-main #7 PASS exists: before activation every scheduled
# or manual run exits SKIPPED without starting OpenCode, Telegram polling,
# the model, repair work, or health marking. After activation the canary
# runs a compact regression through the real production boundary and only
# a stable-main product regression opens a P0 repair issue.
#
# Single repository-owned workflow: no second cron/controller watches this
# watcher. Same-repo status checks use GITHUB_TOKEN; no PAT fan-out, no
# aggressive polling, no runner restarts to evade provider limits.

on:
  schedule:
    # Every four hours, offset from the top of the hour to avoid GitHub's
    # highest scheduled-workflow load.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  # Only one AA production canary is active at a time; never queue a backlog.
  group: aa-production-canary
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      active: ${{ steps.gate.outputs.active }}
      sha: ${{ steps.sha.outputs.sha }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse manual dispatch from non-owners
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.actor }}" != "${{ github.repository_owner }}" ]]; then
            echo "::error::Manual canary dispatch is owner-only."
            exit 1
          fi

      - name: Record exact main SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          checked="$(git rev-parse HEAD)"
          current="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked" != "$current" ]]; then
            echo "::error::Refusing canary on a stale checkout: checked=$checked current=$current"
            exit 3
          fi
          echo "sha=$checked" >> "$GITHUB_OUTPUT"
          echo "exact current main: $checked" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Evaluate canary activation gate
        id: gate
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ steps.sha.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { execSync } = require('child_process');
            const sha = String(process.env.MAIN_SHA || '').toLowerCase();
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(`${label} failed on attempt ${attempt}: ${error.message}; retrying.`);
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue6 = await apiRetry('read issue 6', () =>
              github.rest.issues.get({ owner, repo, issue_number: 6 })
            );
            const issue6Closed = String(issue6.data.state || '').toLowerCase() === 'closed';
            const marker = `<!-- continuum-qualification-result issue=7 sha=${sha} result=pass -->`;
            let qualPass = false;
            for (let page = 1; page <= 5 && !qualPass; page++) {
              const comments = await apiRetry(`list issue 7 comments page ${page}`, () =>
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: 7, per_page: 100,
                })
              );
              qualPass = comments.some(c => String(c.body || '').includes(marker));
              if (comments.length < 100) break;
            }
            let contractStatus = 'unknown';
            try {
              const raw = execSync('python scripts/verify_product_contract_qualification.py', { encoding: 'utf-8' });
              contractStatus = String(JSON.parse(raw).status || 'unknown');
            } catch (error) {
              core.warning(`Production contract readiness check failed: ${error.message}`);
            }
            const active = issue6Closed && qualPass && contractStatus === 'ready';
            const reason = active
              ? 'active: #6 closed, #7 PASS for exact main, contract ready'
              : `not-activated: issue6Closed=${issue6Closed} qualPass=${qualPass} contract=${contractStatus}`;
            core.setOutput('active', active ? 'true' : 'false');
            core.setOutput('reason', reason);
            if (active) {
              core.notice(`Production canary ACTIVATED for exact main ${sha.slice(0, 12)}.`);
            } else {
              core.notice(`Production canary SKIPPED / not activated: ${reason}. No OpenCode, polling, model, or repair work starts.`);
            }
            await core.summary
              .addHeading('AA production canary activation')
              .addList([`- exact main: \`${sha}\``, `- active: \`${active}\``, `- reason: ${reason}`])
              .write();

  canary:
    needs: activation
    if: needs.activation.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      canary_result: ${{ steps.run.outputs.result }}
      failure_class: ${{ steps.run.outputs.failure_class }}
    steps:
      - name: Checkout exact activated main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.activation.outputs.sha }}
          fetch-depth: 0

      - name: Verify stable exact main identity
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          checked="$(git rev-parse HEAD)"
          if [[ "$checked" != "${{ needs.activation.outputs.sha }}" ]]; then
            echo "::error::Checked-out SHA is not the activated exact main."
            exit 3
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          current="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked" != "$current" ]]; then
            echo "canary STALE: main advanced during startup (checked=$checked current=$current)"
            exit 3
          fi
          echo "sha=$checked" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install system voice media dependency
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Run repository verification smoke
        shell: bash
        run: bash scripts/verify.sh

      - name: Restore qualified corpus and retrieval prerequisites
        shell: bash
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          python scripts/restore_canonical.py --no-network-fallback
          python scripts/restore_canonical.py --lang ru --no-network-fallback
          python scripts/build_corpus_structure.py
          python scripts/prefetch_public_assets.py
          python scripts/prefetch_voice_assets.py
          python scripts/build_retrieval_index.py --backend e5

      - name: Run compact production canary
        id: run
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
        run: |
          set -euo pipefail
          set +e
          python scripts/run_aa_production_canary.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir canary-out \
            --run-id "${{ github.run_id }}-canary"
          rc=$?
          set -e
          result="FAIL"
          failure_class="product-regression"
          if [[ -f canary-out/result.json ]]; then
            result="$(python -c 'import json; print(json.load(open("canary-out/result.json"))["result"])')"
            failure_class="$(python -c 'import json; print(json.load(open("canary-out/result.json")).get("failure_class", ""))')"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 75 || "$rc" -eq 4 ]]; then
            echo "::warning::Canary recorded a provider/infrastructure transient ($failure_class); no product repair issue is created."
            exit 0
          fi
          if [[ "$result" == "STALE" || "$rc" -eq 3 ]]; then
            echo "Canary STALE: main changed during the run; no repair issue is created."
            exit 0
          fi
          if [[ "$result" == "SKIPPED" || "$rc" -eq 2 ]]; then
            echo "Canary SKIPPED: requalification pending; no repair issue is created."
            exit 0
          fi
          exit "$rc"

      - name: Upload privacy-safe canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-production-canary-evidence
          path: canary-out/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Record canary summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AA production canary"
            echo
            echo "- exact main: \`${{ steps.sha.outputs.sha }}\`"
            echo "- activation: #6 closed plus exact-main #7 PASS plus production contract"
            echo "- compact text/runtime/voice smoke through the real production boundary"
            echo "- no full benchmark; no privacy-sensitive payload persisted"
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    needs: activation
    if: needs.activation.outputs.active != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record clean no-op
        shell: bash
        run: |
          {
            echo "## AA production canary"
            echo
            echo "- result: SKIPPED / not activated"
            echo "- reason: ${{ needs.activation.outputs.reason }}"
            echo "- OpenCode, Telegram polling, model, and repair work were not started"
          } >> "$GITHUB_STEP_SUMMARY"

  repair:
    needs: [activation, canary]
    if: failure() && needs.activation.outputs.active == 'true' && needs.canary.outputs.failure_class == 'product-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download privacy-safe canary evidence
        uses: actions/download-artifact@v4
        with:
          name: aa-production-canary-evidence
          path: canary-out/

      - name: Create or reuse exactly one P0 repair issue
        uses: actions/github-script@v7
        env:
          FAILED_SHA: ${{ needs.activation.outputs.sha }}
          RUN_ID: ${{ github.run_id }}-canary
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = String(process.env.FAILED_SHA || '');
            const runId = String(process.env.RUN_ID || String(context.runId));
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(`${label} failed on attempt ${attempt}: ${error.message}; retrying.`);
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            // Revalidate currency before publishing: only a stable exact
            // current-main failure is actionable.
            const { data: main } = await apiRetry('resolve current main', () =>
              github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            );
            const currentMain = String(main.commit.sha || '').toLowerCase();
            if (currentMain !== sha.toLowerCase()) {
              core.notice(`Canary result is STALE (tested=${sha.slice(0, 12)} current=${currentMain.slice(0, 12)}); no repair issue is created.`);
              return;
            }
            let failedChecks;
            let failureClass;
            try {
              const result = JSON.parse(fs.readFileSync('canary-out/result.json', 'utf8'));
              const failed = Array.isArray(result.failed_checks) ? result.failed_checks : [];
              if (!failed.length) {
                throw new Error('canary result has no failed_checks');
              }
              failedChecks = failed.join(',');
              failureClass = result.failure_class ? String(result.failure_class) : 'product-regression';
            } catch (error) {
              core.warning(`Missing exact canary evidence; no repair issue is created: ${error.message}`);
              return;
            }
            if (failureClass !== 'product-regression') {
              core.notice(`Canary failure class is ${failureClass}; no product repair issue is created.`);
              return;
            }
            const marker = '<!-- aa-production-canary-repair:v1 -->';
            const fingerprint = `canary|${sha}|${failedChecks}|${failureClass}`;
            const title = 'P0: Repair AA production canary regression';
            const issues = await apiRetry('list repository issues', () =>
              github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            );
            const existing = issues
              .filter(issue => !issue.pull_request && String(issue.body || '').includes(marker))
              .find(issue => String(issue.body || '').includes(`Canary fingerprint: \`${fingerprint}\``));
            const body = [
              marker,
              '',
              '## Automatic production canary repair',
              '',
              `Failure class: \`${failureClass}\``,
              `Exact main SHA: \`${sha}\``,
              `Canary run id: \`${runId}\``,
              `Failed checks: \`${failedChecks}\``,
              `Canary fingerprint: \`${fingerprint}\``,
              '',
              'Privacy-safe evidence only: exact SHA, workflow/run id, failed check names,',
              'and deterministic error categories from `aa-production-canary-evidence`.',
              'No user text, secrets, corpus text, audio, transcripts, or hidden reasoning.',
              '',
              'The normal Continuum issue scheduler owns repair from here.',
            ].join('\n');
            if (existing) {
              await apiRetry('refresh canary repair issue', () =>
                github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'open', title, body,
                  labels: ['priority:p0', 'automation:ready'],
                })
              );
              core.warning(`Reused canary repair issue #${existing.number} for ${fingerprint}.`);
            } else {
              const created = await apiRetry('create canary repair issue', () =>
                github.rest.issues.create({ owner, repo, title, body, labels: ['priority:p0', 'automation:ready'] })
              );
              core.info(`Created canary repair issue #${created.data.number} for ${fingerprint}.`);
            }
            await apiRetry('wake issue scheduler', () =>
              github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
              })
            );
            core.info('Dispatched continuum-issue-scheduler.yml once for the canary repair issue.');

  recover:
    needs: [activation, canary]
    if: success() && needs.activation.outputs.active == 'true' && needs.canary.outputs.canary_result == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close matching canary repair issues on recovery
        uses: actions/github-script@v7
        env:
          RECOVERED_SHA: ${{ needs.activation.outputs.sha }}
          RUN_ID: ${{ github.run_id }}-canary
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = String(process.env.RECOVERED_SHA || '');
            const runId = String(process.env.RUN_ID || String(context.runId));
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(`${label} failed on attempt ${attempt}: ${error.message}; retrying.`);
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            const marker = '<!-- aa-production-canary-repair:v1 -->';
            const issues = await apiRetry('list open issues', () =>
              github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            );
            const matching = issues.filter(
              issue => !issue.pull_request && String(issue.body || '').includes(marker)
            );
            for (const issue of matching) {
              await apiRetry(`close canary repair issue #${issue.number}`, () =>
                github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                })
              );
              await apiRetry(`record recovery on #${issue.number}`, () =>
                github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: [
                    `Production canary recovered on exact main \`${sha}\` (run \`${runId}\`).`,
                    'Closing the matching canary repair issue automatically with recovery evidence.',
                  ].join('\n'),
                })
              );
              core.notice(`Closed canary repair issue #${issue.number} after PASS on ${sha.slice(0, 12)}.`);
            }
            if (!matching.length) {
              core.info('Canary PASS with no open canary repair issues to close.');
            }
