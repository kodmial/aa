name: AA system canary

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aa-system-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aa-wheel
          mkdir -p /tmp/aa-wheel
          python -m pip wheel --no-deps . -w /tmp/aa-wheel
          test -n "$(find /tmp/aa-wheel -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after bounded retries."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Run canonical project verification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify.sh

      - name: Verify Telegram Bot API connectivity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getMe"
          last_error = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  if payload.get("ok") is True and payload.get("result", {}).get("id"):
                      print("Telegram Bot API connectivity: ok")
                      break
                  raise RuntimeError("Telegram getMe returned an invalid response")
              except Exception as exc:
                  last_error = exc
                  if attempt == 2:
                      raise
                  time.sleep(5 * (attempt + 1))
          else:
              raise RuntimeError(str(last_error))
          PY

      - name: Start local OpenCode server
        id: opencode
        shell: bash
        run: |
          set -euo pipefail
          opencode serve --port 4096 --hostname 127.0.0.1 >/tmp/aa-opencode-canary.log 2>&1 &
          pid=$!
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4096/global/health >/dev/null; then
              echo "OpenCode health endpoint: ok"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::OpenCode server exited before becoming ready."
              exit 1
            fi
            sleep 1
          done
          echo "::error::OpenCode server did not become ready."
          exit 1

      - name: Send one real OpenCode provider request
        env:
          OPENCODE_CANARY_MODEL: opencode/muse-spark-1.3-contributor-free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          from aa.opencode.client import HttpOpenCodeClient

          async def main() -> None:
              client = HttpOpenCodeClient("http://127.0.0.1:4096", request_timeout=120.0)
              health = await client.health()
              if not health.healthy:
                  raise RuntimeError("OpenCode health check failed before provider probe")
              session = await client.create_session("aa-system-canary")
              try:
                  reply = await client.send_message(
                      session.id,
                      "Return a brief health acknowledgement.",
                      model=os.environ["OPENCODE_CANARY_MODEL"],
                      timeout=120.0,
                  )
                  if not reply.strip():
                      raise RuntimeError("OpenCode provider returned an empty response")
                  print("OpenCode real provider request: ok")
              finally:
                  try:
                      await client.delete_session(session.id)
                  except Exception:
                      pass

          asyncio.run(main())
          PY

      - name: Stop local OpenCode server
        if: always() && steps.opencode.outputs.pid != ''
        env:
          OPENCODE_PID: ${{ steps.opencode.outputs.pid }}
        shell: bash
        run: |
          set +e
          kill "$OPENCODE_PID" 2>/dev/null || true
          wait "$OPENCODE_PID" 2>/dev/null || true
          exit 0

      - name: Record canary summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AA system canary"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Schedule: every 4 hours"
            echo "- Package build + project verification: executed"
            echo "- Telegram Bot API getMe: executed"
            echo "- Local OpenCode serve + real provider request: executed"
            echo "- No release or deployment is produced by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
