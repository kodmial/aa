name: Temporary enable PR-Agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zz-enable-pr-agent-temp.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Enable PR-Agent review provider
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          gh variable set CONTINUUM_REVIEW_PROVIDER --repo "$GITHUB_REPOSITORY" --body "pr-agent"
          value="$(gh variable get CONTINUUM_REVIEW_PROVIDER --repo "$GITHUB_REPOSITORY")"
          test "$value" = "pr-agent"
          echo "CONTINUUM_REVIEW_PROVIDER=$value"
