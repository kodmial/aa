name: AA OpenCode 429 runner recovery

on:
  workflow_run:
    workflows:
      - "AA real-book retrieval qualification"
      - "AA bot runtime"
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download qualification 429 marker
        if: ${{ github.event.workflow_run.name == 'AA real-book retrieval qualification' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-real-book-retrieval-summary
          path: recovery-input/qualification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download runtime 429 marker
        if: ${{ github.event.workflow_run.name == 'AA bot runtime' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-runtime-429-recovery
          path: recovery-input/runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Detect runner-restart signal
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          requested = False
          for path in (
              Path("recovery-input/qualification/result.json"),
              Path("recovery-input/runtime/result.json"),
          ):
              if not path.is_file():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if payload.get("reason_code") == "OPENCODE_429_RESTART_REQUIRED":
                  requested = True
                  break
          print(f"restart={'true' if requested else 'false'}")
          PY

      - name: Re-run workflow on a fresh runner
        if: ${{ steps.detect.outputs.restart == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = context.payload.workflow_run.id;
            const attempt = Number(context.payload.workflow_run.run_attempt || 1);
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            core.notice(`OpenCode 429 recovery: re-ran workflow attempt ${attempt + 1}/4 on fresh GitHub-hosted runners.`);
