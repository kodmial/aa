name: AA real-book 429 runner recovery

on:
  workflow_run:
    workflows:
      - "AA real-book retrieval qualification"
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download qualification result
        uses: actions/download-artifact@v4
        with:
          name: aa-real-book-retrieval-summary
          path: recovery-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Detect runner-restart signal
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("recovery-input/result.json")
          if not path.is_file():
              print("restart=false")
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding="utf-8"))
          requested = payload.get("reason_code") == "OPENCODE_429_RESTART_REQUIRED"
          print(f"restart={'true' if requested else 'false'}")
          PY

      - name: Re-run qualification on a fresh runner
        if: ${{ steps.detect.outputs.restart == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = context.payload.workflow_run.id;
            const attempt = Number(context.payload.workflow_run.run_attempt || 1);
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            core.notice(`OpenCode 429 recovery: re-ran workflow attempt ${attempt + 1}/4 on fresh GitHub-hosted runners.`);
