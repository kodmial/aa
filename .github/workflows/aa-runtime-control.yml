name: AA runtime control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "Control command, e.g. /bot status"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: aa-runtime-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.issue.number == 31 &&
        github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process runtime command
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CONTROL_ISSUE: "31"
          DISPATCH_COMMAND: ${{ inputs.command }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Issue #6 campaign control with issue #119 idempotent dispatch:
            // one owner `/run` on control issue #31 starts a bounded
            // manual-testing campaign (max 4 x 5h runtimes, 20h aggregate
            // requested, unconditional 24h wall-clock expiry, no renewal or
            // rollover). A repeated `/run` while a campaign is active is an
            // idempotent no-op; a completed/expired/stopped campaign restarts
            // only via a new owner `/run`. `/bot status` reports the
            // authoritative run; `/bot stop` cancels it early and terminates
            // the campaign. Comments carry ids/counters/durations only, never
            // message text, prompts, corpus dumps or credentials.
            //
            // Shared state-transition implementation (mirrors
            // src/aa/control/campaign.py for issue #119; the reconciler
            // workflow uses the same functions verbatim):
            // - the command is parsed from the immutable event payload;
            // - pre-existing campaign resolution excludes the current event
            //   comment id, so the initiating `/run` never self-matches as
            //   "already active" (the 0/4 self-match defect);
            // - re-delivery of the same event is idempotent via a durable
            //   dispatch marker keyed by source comment id;
            // - a marker is posted only after the dispatch API accepts the
            //   run (failure-before-commit consumes no start); once committed
            //   the start is consumed even if the runtime later fails;
            // - effective starts = max(committed runs, committed markers),
            //   so status while the initial dispatch is pending reports
            //   start 1/4 (pending), never 0/4 active from self-match;
            // - exactly one dispatch attempt per serialized execution; an
            //   uncertain dispatch is never repaired with a second poller:
            //   never queue a second poller and allow no overlapping pollers.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const controlIssue = Number(process.env.CONTROL_ISSUE);
            // Immutable event payload: the command text, comment id and
            // comment timestamp come from the delivery payload, never from a
            // re-read that could observe a later edit.
            const payloadComment = context.payload.comment || null;
            const currentCommentId = payloadComment && payloadComment.id
              ? Number(payloadComment.id)
              : null;
            const payloadCreatedAt = payloadComment && payloadComment.created_at
              ? Date.parse(payloadComment.created_at)
              : NaN;
            const rawCommand = (
              context.eventName === 'workflow_dispatch'
                ? process.env.DISPATCH_COMMAND
                : payloadComment?.body
            || '').trim();

            const isRun = rawCommand === '/run';
            const isStop = rawCommand === '/bot stop';
            const isStatus = rawCommand === '/bot status';
            const looksLikeCommand = rawCommand.startsWith('/run') || rawCommand.startsWith('/bot');

            // Defensive authentication: the job `if:` already requires the
            // owner and exact control issue, but fail closed here as well.
            if (context.eventName === 'issue_comment') {
              const actor = context.actor || '';
              const issueNumber = context.payload.issue?.number;
              if (actor !== owner || issueNumber !== controlIssue) {
                core.info('Not an authenticated owner command on the control issue; ignoring.');
                return;
              }
              const commentAuthor = payloadComment?.user?.login || '';
              if (commentAuthor && commentAuthor !== owner) {
                core.info('Ignoring non-owner comment.');
                return;
              }
            }

            const comment = async body => {
              if (context.eventName !== 'issue_comment') return;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: controlIssue,
                body,
              });
            };

            if (!isRun && !isStop && !isStatus) {
              if (looksLikeCommand && context.eventName === 'issue_comment') {
                await comment(
                  'Invalid command. Use `/run` to start one bounded 5h-campaign run ' +
                  '(max 4 starts / 20h requested / 24h wall clock), `/bot stop` to end ' +
                  'the active runtime early, or `/bot status` for the authoritative state.'
                );
              } else {
                core.info('Not a runtime control command; ignoring.');
                return;
              }
              if (looksLikeCommand) core.setFailed('Invalid AA runtime control command.');
              return;
            }

            const ACTIVE = ['queued', 'in_progress', 'waiting', 'requested', 'pending'];
            const DAY_MS = 24 * 3600 * 1000;
            const MAX_STARTS = 4;
            const MARKER_KIND = 'aa-campaign-dispatch';

            const listAllComments = async () => {
              const comments = [];
              let page = 1;
              for (;;) {
                const { data } = await github.rest.issues.listComments({
                  owner, repo, issue_number: controlIssue, per_page: 100, page,
                });
                comments.push(...data);
                if (data.length < 100) break;
                page += 1;
              }
              return comments;
            };

            const listRuntimeRuns = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'aa-runtime.yml', per_page: 100,
              });
              return data.workflow_runs;
            };

            const formatMarker = (generation, seq, sourceCommentId) =>
              `<!-- ${MARKER_KIND} generation=${generation} seq=${seq}` +
              (sourceCommentId ? ` source-comment=${sourceCommentId}` : '') + ' -->';
            const parseMarker = body => {
              const m = /<!--\s*aa-campaign-dispatch\s+generation=(\S+)\s+seq=(\d+)(?:\s+source-comment=(\S+))?\s*-->/.exec(body || '');
              if (!m) return null;
              return { generation: m[1], seq: Number(m[2]), sourceComment: m[3] || null };
            };
            const markersForGeneration = (comments, generation) => {
              // Deduplicated by seq: a retried marker post after an
              // ambiguous success may persist the same seq twice, and
              // counting both would wedge the reconciler in pending
              // (markers greater than runs forever).
              const seqs = new Set();
              for (const c of comments) {
                const parsed = parseMarker(c.body || '');
                if (parsed && parsed.generation === generation) seqs.add(parsed.seq);
              }
              return [...seqs].sort((a, b) => a - b);
            };
            const hasMarkerForSource = (comments, sourceId) => {
              if (sourceId === null || sourceId === undefined) return false;
              const wanted = String(sourceId);
              return comments.some(c => {
                const parsed = parseMarker(c.body || '');
                return parsed !== null && parsed.sourceComment === wanted;
              });
            };
            const generationForComment = commentId => `c${commentId}`;
            // Authoritative readiness (issue #144): a workflow that is merely
            // in_progress is never readiness. Only a trusted READY marker for
            // the exact active run counts as ready; STARTUP_FAILED marks a
            // failed bootstrap. Markers carry run id, SHA, timestamp and
            // ordinal only, never secrets or message text.
            const parseReady = body => {
              const m = /<!--\s*aa-runtime-ready\s+run=(\d+)\s+sha=([0-9a-f]{40})\s+ready_at=(\d+)\s+ordinal=(\d+)\s*-->/.exec(body || '');
              if (!m) return null;
              return { runId: Number(m[1]), sha: m[2], readyAt: Number(m[3]), ordinal: Number(m[4]) };
            };
            const parseStartupFailed = body => {
              const m = /<!--\s*aa-runtime-startup-failed\s+run=(\d+)\s+sha=([0-9a-f]{40})\s+failed_at=(\d+)\s+ordinal=(\d+)\s+category=([a-z0-9-]+)\s*-->/.exec(body || '');
              if (!m) return null;
              return { runId: Number(m[1]), sha: m[2], failedAt: Number(m[3]), ordinal: Number(m[4]), category: m[5] };
            };
            const hasReadyForRun = (comments, runId) =>
              comments.some(c => {
                const parsed = parseReady(c.body || '');
                return parsed !== null && parsed.runId === Number(runId);
              });
            const failureForRun = (comments, runId) => {
              for (const c of comments) {
                const parsed = parseStartupFailed(c.body || '');
                if (parsed !== null && parsed.runId === Number(runId)) return parsed;
              }
              return null;
            };
            const pollerStateForRun = (run, comments) => {
              const active = run && run.conclusion === null && ACTIVE.includes(run.status);
              const ready = run ? hasReadyForRun(comments, run.id) : false;
              const failed = run ? failureForRun(comments, run.id) !== null : false;
              if (failed) return 'failed';
              if (ready && active) return 'ready';
              if (active) return 'starting';
              if (!run) return 'idle';
              if (run.conclusion === 'cancelled') return 'stopped';
              if (run.conclusion === 'success') return 'completed';
              if (run.conclusion === 'failure' || run.conclusion === 'timed_out') return 'failed';
              return 'stopped';
            };

            // Shared resolver: re-read authoritative state immediately before
            // deciding. Owner `/run` epochs exclude the current event comment
            // id; owner `/bot stop` epochs, committed runs and committed
            // markers form the durable counter. A committed dispatch consumes
            // one start even when the run later fails or ends early.
            const resolveCampaign = (comments, runs, nowMs, excludeId) => {
              const runEntries = comments
                .filter(c => c.user && c.user.login === owner && (c.body || '').trim() === '/run')
                .filter(c => excludeId === null || excludeId === undefined || Number(c.id) !== Number(excludeId))
                .map(c => ({ t: Date.parse(c.created_at), id: Number(c.id) }))
                .filter(e => Number.isFinite(e.t))
                .sort((a, b) => a.t - b.t);
              const stopTimes = comments
                .filter(c => c.user && c.user.login === owner && (c.body || '').trim() === '/bot stop')
                .map(c => Date.parse(c.created_at))
                .filter(t => Number.isFinite(t));
              const createdTimes = runs
                .map(r => Date.parse(r.created_at))
                .filter(t => Number.isFinite(t));
              const sortedCreated = [...createdTimes].sort((a, b) => a - b);
              for (let i = 0; i < runEntries.length; i++) {
                const candidate = runEntries[i].t;
                if (stopTimes.some(s => s > candidate)) continue;
                if (nowMs - candidate >= DAY_MS) continue;
                if (sortedCreated.filter(t => t > candidate).length >= MAX_STARTS) continue;
                let exhaustedBefore = false;
                for (let j = 0; j < i; j++) {
                  const prev = runEntries[j].t;
                  const prevRuns = sortedCreated.filter(t => t > prev);
                  if (prevRuns.length >= MAX_STARTS && candidate <= prevRuns[MAX_STARTS - 1]) {
                    exhaustedBefore = true;
                    break;
                  }
                }
                if (exhaustedBefore) continue;
                return { accepted: candidate, sourceCommentId: runEntries[i].id };
              }
              return null;
            };

            const activeRunsOf = runs =>
              runs
                .filter(r => r.conclusion === null && ACTIVE.includes(r.status))
                .sort((a, b) => a.id - b.id);

            const effectiveStarts = (accepted, runs, comments, generation) => {
              const runsAfter = runs.filter(r => Date.parse(r.created_at) > accepted).length;
              const markers = generation ? markersForGeneration(comments, generation).length : 0;
              return Math.max(runsAfter, markers);
            };

            const describeCampaign = (accepted, generation, runs, active, comments, nowMs) => {
              const startsUsed = effectiveStarts(accepted, runs, comments, generation);
              const runsAfter = runs.filter(r => Date.parse(r.created_at) > accepted).length;
              const markers = generation ? markersForGeneration(comments, generation).length : 0;
              const pending = markers > runsAfter;
              const expiresInH = Math.max(0, (accepted + DAY_MS - nowMs) / 3600000).toFixed(1);
              // Only READY is an active usable poller; in_progress alone is
              // starting. Duplicate prevention is unchanged: starting still
              // suppresses any second dispatch.
              const runLines = active.length
                ? active.map(r => {
                    const state = pollerStateForRun(r, comments);
                    const detail = state === 'ready'
                      ? 'ready — poller is live, safe to test'
                      : state === 'starting'
                        ? 'starting — workflow active but READY marker absent, wait for READY'
                        : state;
                    return `- #${r.id}: **${r.status}** (${detail}) — ${r.html_url}`;
                  }).join('\n')
                : '- none';
              const pendingLine = pending
                ? `\nDispatch pending: start ${startsUsed}/${MAX_STARTS} committed, runtime appearing.`
                : '';
              const usable = active.some(r => pollerStateForRun(r, comments) === 'ready');
              const usabilityLine = active.length
                ? (usable
                    ? '\nUsable poller: ready (exact active run has a trusted READY marker).'
                    : '\nUsable poller: none yet (starting — no trusted READY marker for the active run).')
                : '';
              return [
                `Active campaign: started ${new Date(accepted).toISOString()}, expires in ~${expiresInH}h.`,
                `Starts used: ${startsUsed}/${MAX_STARTS} (fixed 5h each, 20h aggregate max).${pendingLine}${usabilityLine}`,
                `Active runtime:\n${runLines}`,
              ].join('\n');
            };

            if (isStatus) {
              const [comments, runs] = await Promise.all([listAllComments(), listRuntimeRuns()]);
              const active = activeRunsOf(runs);
              const resolved = resolveCampaign(comments, runs, Date.now(), null);
              // /bot status reports the durable aa-runtime-status marker
              // (STARTING -> READY -> STOPPED|FAILED with exact run id/SHA),
              // never a generic workflow in_progress string.
              const markerComment = [...comments].reverse().find(c =>
                String(c.body || '').includes('aa-runtime-status')
              );
              const markerLine = markerComment
                ? `Runtime marker: ${(markerComment.body || '').split('\n').find(l => l.includes('aa-runtime-status')) || 'present'}`
                : 'Runtime marker: none (no Telegram poller is READY).';
              if (resolved === null) {
                await comment(
                  'No active campaign. Post `/run` (owner only) to start one bounded 5h run ' +
                  '(max 4 starts / 20h requested / 24h wall clock).\n' + markerLine
                );
                return;
              }
              const generation = generationForComment(resolved.sourceCommentId);
              await comment(['AA campaign status (authoritative):', describeCampaign(resolved.accepted, generation, runs, active, comments, Date.now()), markerLine].join('\n'));
              return;
            }

            if (isStop) {
              const runs = await listRuntimeRuns();
              const active = activeRunsOf(runs);
              if (!active.length) {
                await comment('No active AA runtime. The campaign, if any, ends via expiry or a new `/run`.');
                return;
              }
              for (const run of active) {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              }
              // The owner /bot stop comment itself terminates the campaign so
              // later scheduled wake-ups stay no-ops until a new `/run`.
              await comment(
                `Stop requested for AA runtime run(s): ${active.map(run => '#' + run.id).join(', ')}. ` +
                'The campaign is terminated; post a new `/run` to start another one. ' +
                'Cancellation stops the Telegram poller and the supervised OpenCode process.'
              );
              return;
            }

            // isRun: start one bounded campaign run (idempotent no-op when active).
            // Re-read authoritative state immediately before deciding, exclude
            // the current event comment id, and honor the durable marker so a
            // re-delivered event never consumes another start.
            const [comments, runs] = await Promise.all([listAllComments(), listRuntimeRuns()]);
            const active = activeRunsOf(runs);
            const nowMs = Date.now();
            if (currentCommentId !== null && hasMarkerForSource(comments, currentCommentId)) {
              const resolved = resolveCampaign(comments, runs, nowMs, currentCommentId);
              const gen = resolved ? generationForComment(resolved.sourceCommentId) : null;
              const startsUsed = resolved ? effectiveStarts(resolved.accepted, runs, comments, gen) : 0;
              await comment(
                `No-op: duplicate delivery of \`/run\` comment #${currentCommentId} is idempotent` +
                (resolved ? ` (already active campaign, starts used ${startsUsed}/${MAX_STARTS}). ` : '. ') +
                'Re-delivery never consumes another start; use `/bot status` or `/bot stop`.'
              );
              return;
            }
            const accepted = resolveCampaign(comments, runs, nowMs, currentCommentId);
            if (accepted !== null) {
              const generation = generationForComment(accepted.sourceCommentId);
              const startsUsed = effectiveStarts(accepted.accepted, runs, comments, generation);
              await comment(
                `No-op: a campaign is already active (starts used ${startsUsed}/${MAX_STARTS}). ` +
                'Repeated `/run` never starts a second poller; use `/bot status` or `/bot stop`.'
              );
              return;
            }
            if (active.length) {
              const run = active[0];
              await comment(
                `Start rejected: AA runtime #${run.id} is already ${run.status}. ` +
                'Duplicate starts never replace the current runtime; use /bot status or /bot stop.'
              );
              return;
            }

            // Self-proving qualification label (issue #146, control issue
            // #31): owner /run for manual testing stays available regardless
            // of qualification state. Qualification controls only the
            // QUALIFIED/UNQUALIFIED label, never the launch. INCOMPLETE,
            // missing secret/model, stale SHA, mocked-only evidence, or
            // unknown state all mean FAIL/BLOCKED for qualification and an
            // UNQUALIFIED label here, never a refusal of /run.
            const guardQualification = async () => {
              let headSha = '';
              try {
                const { data: repo } = await github.rest.repos.get({ owner, repo });
                headSha = repo.default_branch || 'main';
              } catch (_) {
                headSha = '';
              }
              let mainSha = '';
              try {
                const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
                mainSha = (branch.commit && branch.commit.sha) || '';
              } catch (error) {
                core.warning('Self-proving guard: cannot read current main SHA: ' + (error && error.message ? error.message : error));
                return { allowed: false, blocking: 'unknown', reason: 'cannot read current main SHA' };
              }
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'aa-self-proving-qualification.yml',
                  branch: 'main', per_page: 20,
                });
                const fresh = (data.workflow_runs || []).find(
                  run => run.head_sha === mainSha && run.conclusion === 'success'
                );
                if (!fresh) {
                  return { allowed: false, blocking: 'F', reason: `no fresh trusted PASS for exact main ${String(mainSha).slice(0, 12)}`, sha: mainSha };
                }
                return { allowed: true, blocking: '', sha: mainSha };
              } catch (error) {
                core.warning('Self-proving guard: qualification lookup failed: ' + (error && error.message ? error.message : error));
                return { allowed: false, blocking: 'unknown', reason: 'qualification evidence unknown' };
              }
            };

            // Fresh campaign: the new generation is anchored at the immutable
            // event comment (id + payload timestamp), committed atomically
            // with the single dispatch below. First accepted dispatch is
            // start 1/4.
            const generation = currentCommentId !== null
              ? generationForComment(currentCommentId)
              : `manual-${nowMs}`;
            const duration = '5h';
            // Advisory label only: never refuse /run. Without fresh
            // exact-main PASS the runtime starts labeled UNQUALIFIED and the
            // runtime publishes READY (UNQUALIFIED) once the poller is live;
            // with PASS it is READY (QUALIFIED). Repair/requalification is
            // automatic and proceeds independently.
            const guard = await guardQualification();
            if (!guard.allowed) {
              await comment(
                `UNQUALIFIED: current main has no fresh trusted PASS (blocking gate ${guard.blocking || 'unknown'}; ` +
                `${guard.reason || 'no fresh trusted PASS evidence'}). ` +
                'Owner `/run` stays available and starts labeled UNQUALIFIED; the runtime will publish READY (UNQUALIFIED) once live. ' +
                'Repair/requalification is automatic. ' +
                'Use `/bot status` for the authoritative runtime marker (aa-runtime-status STARTING -> READY -> STOPPED|FAILED).'
              );
            }
            let dispatchAccepted = false;
            try {
              // Campaign ordinal 1/4 is plumbed to the runtime so its READY
              // marker carries the exact start ordinal (privacy-safe).
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'aa-runtime.yml', ref: 'main', inputs: { duration, seq: '1' },
              });
              dispatchAccepted = true;
            } catch (error) {
              // Failure-before-commit: no marker, no consumed start, no
              // second poller to "repair" it. The reconciler may retry on a
              // later tick after re-reading authoritative state.
              await comment(
                'Start failed: runtime dispatch was not accepted/committed, so no start was consumed ' +
                `(generation ${generation}). Error: ${(error && error.message) || error}. ` +
                'Post `/run` again or wait for the scheduled reconciler; duplicate dispatches are never queued.'
              );
              core.setFailed(`AA runtime dispatch not committed: ${(error && error.message) || error}`);
              return;
            }

            // Failure-after-commit path: the dispatch above was accepted, so
            // start 1/4 is consumed even if the runtime later fails. Commit
            // the durable marker immediately with retries before any
            // best-effort listing, so a lost marker with lagging run listing
            // can never read as 0 runs + 0 markers and dispatch a second
            // poller. Never dispatch a second runtime to repair an uncertain
            // listing below.
            let marker = formatMarker(generation, 1, currentCommentId);
            const qualificationLabel = guard.allowed ? 'QUALIFIED' : 'UNQUALIFIED';
            const markerBody = `Start 1/${MAX_STARTS} committed for generation ${generation} (${qualificationLabel}).\n` + marker;
            let markerCommitted = false;
            for (let attempt = 0; attempt < 3 && !markerCommitted; attempt++) {
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: controlIssue,
                  body: markerBody,
                });
                markerCommitted = true;
              } catch (error) {
                // A failed post may still have persisted server-side
                // (ambiguous success), so re-read before retrying: any
                // duplicate seq post is deduplicated by
                // markersForGeneration and never double counts a start.
                try {
                  const reread = await listAllComments();
                  if (markersForGeneration(reread, generation).includes(1)) {
                    markerCommitted = true;
                    break;
                  }
                } catch (_) {
                  // Re-read is best-effort; fall through to the retry below.
                }
                if (attempt < 2) {
                  await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
                }
              }
            }
            if (!markerCommitted) {
              // Failure-after-commit with no durable marker yet: the dispatch
              // above was accepted, so start 1/4 is consumed. Returning now
              // would leave 0 markers + 0 runs (not pending), letting a later
              // tick dispatch a second runtime for the same generation.
              // Poll briefly so a transient comment-API blip can still
              // converge on the durable marker before this execution
              // releases the aa-runtime-control lock.
              for (let wait = 0; wait < 4 && !markerCommitted; wait++) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: controlIssue,
                    body: markerBody,
                  });
                  markerCommitted = true;
                } catch (_) {
                  try {
                    const reread = await listAllComments();
                    if (markersForGeneration(reread, generation).includes(1)) {
                      markerCommitted = true;
                    }
                  } catch (_) {
                    // Best-effort; keep waiting for the API to recover.
                  }
                }
              }
            }
            if (!markerCommitted) {
              core.setFailed(
                'Dispatch committed but marker not persisted for generation ' + generation +
                ': start 1/' + MAX_STARTS + ' is consumed and a runtime may appear shortly. ' +
                'Verify runs before re-posting `/run`; never dispatch a second poller to repair this tick.'
              );
              return;
            }
            // Give GitHub a short moment to create the run so the operator
            // gets an authoritative run id in the control issue. Best-effort
            // only; the marker above is already the durable counter.
            await new Promise(resolve => setTimeout(resolve, 1500));
            let run = null;
            try {
              const latest = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'aa-runtime.yml', event: 'workflow_dispatch', per_page: 10,
              });
              run = latest.data.workflow_runs[0] || null;
            } catch (error) {
              core.warning('Dispatch committed; run listing best-effort: ' + (error && error.message ? error.message : error));
            }
            await comment(
              (run
                ? `AA campaign run requested (**${duration}**, fixed 5h window after readiness). Run #${run.id}: ${run.html_url}\n`
                : `AA campaign run requested (**${duration}**, fixed 5h window after readiness).\n`) +
              `Bounds: max 4 starts / 20h requested / 24h wall clock, no auto-renewal. Start 1/${MAX_STARTS} committed for generation ${generation}.`
            );
