name: AA self-proving 429 recovery

on:
  workflow_run:
    workflows:
      - AA self-proving qualification
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover provider 429 on a fresh VM
        uses: actions/github-script@v7
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = Number(process.env.FAILED_RUN_ID);
            const attempt = Number(process.env.FAILED_RUN_ATTEMPT || '1');
            const sha = String(process.env.FAILED_HEAD_SHA || '');
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('Invalid failed run id for 429 recovery.');
              return;
            }
            const markerName = `aa-self-proving-restart-${attempt}`;
            let markerFound = false;
            // Artifacts are normally visible when workflow_run fires, but
            // allow bounded eventual-consistency delay before deciding this
            // was an ordinary product/infrastructure failure.
            for (let check = 1; check <= 5; check++) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: runId, per_page: 100 }
              );
              markerFound = artifacts.some(a => a.name === markerName && !a.expired);
              if (markerFound) break;
              if (check < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!markerFound) {
              core.info(`No ${markerName}; leave non-429 failure to the product repair loop.`);
              return;
            }
            const currentMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const currentSha = String(currentMain.data.commit.sha || '');
            if (currentSha && sha && currentSha !== sha) {
              core.info(`Discarding stale 429 evidence for ${sha.slice(0, 12)}; current main is ${currentSha.slice(0, 12)}.`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'aa-self-proving-qualification.yml',
                ref: 'main',
                inputs: { required_sha: currentSha },
              });
              return;
            }
            if (attempt < 10) {
              core.info(`Provider 429: re-running failed jobs for run ${runId}, next attempt ${attempt + 1}.`);
              await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: runId });
              return;
            }
            // GitHub caps re-runs. Continue convergence ownerlessly by
            // dispatching a fresh exact-SHA qualification run instead of
            // entering a terminal paused/human-required state.
            core.info(`Provider 429 persisted through ${attempt} attempts; dispatching a fresh qualification run.`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'aa-self-proving-qualification.yml',
              ref: 'main',
              inputs: { required_sha: sha },
            });
