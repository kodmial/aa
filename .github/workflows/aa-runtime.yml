name: AA bot runtime
run-name: AA bot runtime 5h (campaign)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Bounded live runtime duration (fixed 5h campaign window)"
        required: true
        type: choice
        options:
          - 5h
      seq:
        description: "Campaign start ordinal 1..4 for the READY marker"
        required: false
        type: string
        default: "1"

permissions:
  # Cache save needs write; restore needs read. Runtime itself stays read-only
  # except for the privacy-safe completion report posted to control issue #31
  # (run id, duration, outcome and counters only; never message text,
  # prompts, corpus dumps or credentials).
  actions: write
  contents: read
  issues: write

# Issue #6 concurrency: there is never a second active poller for the same
# bot token. Overlapping dispatches serialize here (never replace the
# running job) and the first step rejects the duplicate explicitly, so a
# queued duplicate exits before OpenCode or Telegram ever start.
concurrency:
  group: aa-bot-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    # Campaign hard bounds: 5h application runtime per session, 4 starts max,
    # 20h aggregate requested runtime max, 24h wall-clock campaign max. The
    # 330-minute job timeout stays below the 6-hour hosted-runner ceiling so
    # Telegram/OpenCode cleanup always has headroom.
    timeout-minutes: 330
    steps:
      - name: Reject duplicate runtime
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = Number(process.env.CURRENT_RUN_ID);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'aa-runtime.yml',
              per_page: 100,
            });
            const active = data.workflow_runs.filter(
              run => run.conclusion === null &&
                ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)
            );
            const authoritative = active.sort((a, b) => a.id - b.id)[0];
            if (authoritative && authoritative.id !== current) {
              core.setFailed(
                `AA runtime #${authoritative.id} is already ${authoritative.status}; rejecting duplicate #${current}. Use /bot status or /bot stop on control issue #31.`
              );
            } else {
              core.info(`No competing AA runtime; #${current} is authoritative.`);
            }

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compute public cache keys
        id: public-cache-keys
        shell: bash
        run: |
          set -euo pipefail
          echo "pip-dir=$HOME/.cache/pip" >> "$GITHUB_OUTPUT"
          echo "hf-dir=$HOME/.cache/huggingface/hub" >> "$GITHUB_OUTPUT"
          echo "model-dir=$HOME/.cache/huggingface/hub/models--intfloat--multilingual-e5-base" >> "$GITHUB_OUTPUT"
          echo "pip-key=aa-public-pip-v1-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('pyproject.toml') }}" >> "$GITHUB_OUTPUT"
          echo "pip-restore=aa-public-pip-v1-${{ runner.os }}-${{ runner.arch }}-py3.12-" >> "$GITHUB_OUTPUT"
          echo "model-key=aa-public-model-v1-${{ runner.os }}-${{ runner.arch }}-intfloat-multilingual-e5-base-${{ hashFiles('corpus/embedding.lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Compute voice cache keys
        id: voice-cache-keys
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Issue #79: one exact content/compatibility key per voice model
          # family (runner OS/arch, Python 3.12, fixed model
          # identity/revision or checksum from corpus/voice.lock.json, and
          # the pyproject + voice-lock dependency hash). Keys are computed
          # by scripts/prefetch_voice_assets.py so the lock file stays the
          # single source of truth. Speech dependency wheels reuse the #59
          # public pip cache above (pyproject.toml pins sherpa-onnx, torch
          # and onnxruntime); no second dependency cache is introduced.
          # Key computation is non-fatal: any lock/key error behaves like
          # a total cache miss so runtime startup is never blocked.
          echo "gigaam-dir=models/gigaam" >> "$GITHUB_OUTPUT"
          echo "tts-dir=models/tts" >> "$GITHUB_OUTPUT"
          echo "presentation-dir=models/voice-presentation" >> "$GITHUB_OUTPUT"
          if payload=$(python scripts/prefetch_voice_assets.py --print-keys \
            --os "${{ runner.os }}" --arch "${{ runner.arch }}" \
            --deps-hash "${{ hashFiles('pyproject.toml', 'corpus/voice.lock.json') }}"); then
            echo "$payload"
            gigaam=$(python -c "import json,sys; print(json.loads(sys.argv[1])['keys']['gigaam'])" "$payload")
            silero=$(python -c "import json,sys; print(json.loads(sys.argv[1])['keys']['silero'])" "$payload")
            presentation=$(python -c "import json,sys; print(json.loads(sys.argv[1])['keys']['presentation'])" "$payload")
            echo "gigaam-key=$gigaam" >> "$GITHUB_OUTPUT"
            echo "silero-key=$silero" >> "$GITHUB_OUTPUT"
            echo "presentation-key=$presentation" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Voice cache key computation failed; continuing with a total miss."
          fi

      - name: Restore public pip cache
        id: restore-public-pip
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.public-cache-keys.outputs.pip-dir }}
          key: ${{ steps.public-cache-keys.outputs.pip-key }}
          restore-keys: ${{ steps.public-cache-keys.outputs.pip-restore }}
          fail-on-cache-miss: false

      - name: Restore public embedding model cache
        id: restore-public-model
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          # Exact key only: a wrong model revision must miss safely.
          # No restore-keys here; pip fallback above is revalidated before use.
          path: ${{ steps.public-cache-keys.outputs.model-dir }}
          key: ${{ steps.public-cache-keys.outputs.model-key }}
          fail-on-cache-miss: false

      - name: Restore GigaAM voice model cache
        id: restore-voice-gigaam
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          # Exact key only: a wrong GigaAM revision must miss safely.
          # No restore-keys here; the check-only step below prunes stale
          # content and the prefetch step re-downloads the fixed artifact.
          path: ${{ steps.voice-cache-keys.outputs.gigaam-dir }}
          key: ${{ steps.voice-cache-keys.outputs.gigaam-key }}
          fail-on-cache-miss: false

      - name: Restore Silero voice model cache
        id: restore-voice-silero
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          # Exact key only: a wrong Silero identity must miss safely.
          # No restore-keys here.
          path: ${{ steps.voice-cache-keys.outputs.tts-dir }}
          key: ${{ steps.voice-cache-keys.outputs.silero-key }}
          fail-on-cache-miss: false

      - name: Restore voice presentation model cache
        id: restore-voice-presentation
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          # Exact key only: a wrong classifier checksum must miss safely.
          # No restore-keys here.
          path: ${{ steps.voice-cache-keys.outputs.presentation-dir }}
          key: ${{ steps.voice-cache-keys.outputs.presentation-key }}
          fail-on-cache-miss: false

      - name: Verify pinned public assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prefetch_public_assets.py --check-only

      - name: Verify pinned voice assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Issue #79: restore -> verify identity/checksum -> use.
          # Missing/stale/corrupt entries are pruned here so the prefetch
          # step below re-downloads the fixed artifact and revalidates.
          python scripts/prefetch_voice_assets.py --check-only

      - name: Resolve bounded duration
        id: duration
        shell: bash
        run: |
          set -euo pipefail
          # Issue #6: the campaign runtime is fixed at exactly 5h (18000s).
          # No other duration is accepted for normal operation.
          case "${{ inputs.duration }}" in
            5h) seconds=18000 ;;
            *)
              echo "::error::Unsupported runtime duration (only 5h is allowed)."
              exit 1
              ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Validate required application secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

      - name: Install and smoke-test Telegram voice codec
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          # Exercise the actual OGG/Opus encoder and Telegram ASR PCM decoder.
          # This is a codec smoke test; it never uses or stores user audio.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=0.5' \
            -ac 1 -c:a libopus -b:a 32k "$tmpdir/test.ogg"
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i "$tmpdir/test.ogg" -ac 1 -ar 16000 -f f32le "$tmpdir/test.pcm"
          test -s "$tmpdir/test.ogg"
          test -s "$tmpdir/test.pcm"
          echo "AA voice codec smoke: OGG/Opus encode/decode PASS"

      - name: Install worker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prefetch pinned embedding model
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prefetch_public_assets.py

      - name: Prefetch pinned voice models
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Issue #79: caching is acceleration only. A total cache miss
          # behaves exactly like a first clean installation: this step
          # reuses a verified hit, otherwise downloads the fixed artifacts
          # normally and revalidates before use. Save failure is non-fatal.
          payload=$(python scripts/prefetch_voice_assets.py)
          echo "$payload"
          python -c "
          import json, sys
          payload = json.loads(sys.argv[1])
          lines = ['Voice model cache (issue #79): overall ' + str(payload.get('status')) + '.']
          for family, item in payload.get('families', {}).items():
              lines.append(
                  '- ' + str(family) + ': ' + str(item.get('status'))
                  + ' (category ' + str(item.get('category')) + ', '
                  + str(item.get('downloaded_bytes')) + ' bytes downloaded of '
                  + str(item.get('snapshot_bytes')) + ' snapshot bytes, '
                  + str(item.get('duration_ms')) + ' ms, peak RSS '
                  + str(item.get('peak_rss_mb')) + ' MiB).'
              )
          with open('voice_cache_summary.md', 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          " "$payload"
          cat voice_cache_summary.md >> "$GITHUB_STEP_SUMMARY"
          rm -f voice_cache_summary.md

      - name: Save public pip cache
        if: success() && steps.restore-public-pip.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.public-cache-keys.outputs.pip-dir }}
          key: ${{ steps.public-cache-keys.outputs.pip-key }}

      - name: Save public embedding model cache
        if: success() && steps.restore-public-model.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.public-cache-keys.outputs.model-dir }}
          key: ${{ steps.public-cache-keys.outputs.model-key }}

      - name: Save GigaAM voice model cache
        if: success() && steps.restore-voice-gigaam.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.voice-cache-keys.outputs.gigaam-dir }}
          key: ${{ steps.voice-cache-keys.outputs.gigaam-key }}

      - name: Save Silero voice model cache
        if: success() && steps.restore-voice-silero.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.voice-cache-keys.outputs.tts-dir }}
          key: ${{ steps.voice-cache-keys.outputs.silero-key }}

      - name: Save voice presentation model cache
        if: success() && steps.restore-voice-presentation.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.voice-cache-keys.outputs.presentation-dir }}
          key: ${{ steps.voice-cache-keys.outputs.presentation-key }}

      - name: Compute derived retrieval cache key
        id: derived-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # Issue #58: exact content-addressed key for the encrypted derived
          # retrieval bundle (schema + RU/EN canonical SHA + structure +
          # #47 retrieval config + embedding lock + ABI + OS/arch). No branch,
          # run id, timestamp, or hostname enters the key.
          derived_dir="${RUNNER_TEMP:-/tmp}/aa-derived-cache"
          echo "derived-dir=$derived_dir" >> "$GITHUB_OUTPUT"
          payload=$(python scripts/manage_derived_cache.py --mode print-key \
            --os "${{ runner.os }}" --arch "${{ runner.arch }}" \
            --cache-dir "$derived_dir")
          echo "$payload"
          key=$(python -c "import json,sys; print(json.loads(sys.argv[1])['cache_key'])" "$payload")
          fingerprint=$(python -c "import json,sys; print(json.loads(sys.argv[1])['cache_fingerprint'])" "$payload")
          echo "derived-key=$key" >> "$GITHUB_OUTPUT"
          echo "derived-fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore encrypted derived retrieval cache
        id: restore-derived
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          # Exact key only: a stale or foreign bundle must miss safely and
          # rebuild deterministically. No restore-keys fallback here.
          path: ${{ steps.derived-cache-key.outputs.derived-dir }}
          key: ${{ steps.derived-cache-key.outputs.derived-key }}
          fail-on-cache-miss: false

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Build and validate AA knowledge runtime
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          AA_ALLOW_NETWORK_FETCH: "0"
        shell: bash
        run: |
          set -euo pipefail
          # Production activation (#28): restore the verified EN + RU canonical
          # artifacts from the committed encrypted snapshots. RU fails closed
          # here when the qualified snapshot cannot be restored/validated;
          # never fall back to generated translation of EN.
          python scripts/restore_canonical.py --no-network-fallback
          python scripts/restore_canonical.py --lang ru --no-network-fallback

          [[ -f scripts/build_corpus_structure.py ]] || {
            echo "::error::AA hierarchy builder is missing; issue #8 is not ready."
            exit 1
          }
          python scripts/build_corpus_structure.py

          [[ -f scripts/build_retrieval_index.py ]] || {
            echo "::error::AA retrieval index builder is missing; issue #17 is not ready."
            exit 1
          }
          # Issue #58: encrypted disposable derived retrieval cache.
          # Exact lookup only; miss/stale/corrupt/unavailable transparently
          # rebuilds from the canonical corpus. Disabled cache boots cleanly.
          python scripts/manage_derived_cache.py --mode restore-or-rebuild \
            --cache-dir "${RUNNER_TEMP:-/tmp}/aa-derived-cache"

          for tool in book_search book_read book_expand book_section; do
            [[ -f ".opencode/tools/${tool}.ts" ]] || {
              echo "::error::Missing OpenCode AA tool: ${tool} (issue #18 is not ready)."
              exit 1
            }
          done

          [[ -f scripts/verify_runtime_qualification.py ]] || {
            echo "::error::AA runtime qualification gate is missing; issues #19/#9 are not ready."
            exit 1
          }
          # Runtime qualification gate (#9): runs after deterministic
          # artifact bootstrap/restore and index availability, but before
          # OpenCode/Telegram readiness is declared. Fails closed on any
          # stale/missing source, structure, index, tool, prompt/agent or
          # #19 qualification version, so polling never starts unqualified.
          python scripts/verify_runtime_qualification.py

      - name: Save encrypted derived retrieval cache
        # Trusted save only: this workflow is workflow_dispatch-only, so
        # low-trust pull-request workflows cannot poison the derived cache.
        # Only the encrypted package + non-secret metadata enters the cache;
        # plaintext corpus/index, secrets, and session state never do.
        # Save failure is non-fatal; the runtime already started.
        if: success() && steps.restore-derived.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manage_derived_cache.py --mode save \
            --cache-dir "${RUNNER_TEMP:-/tmp}/aa-derived-cache" || true

      - name: Upload encrypted derived retrieval cache
        if: success() && steps.restore-derived.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          # Exact content-addressed key only; no restore-keys fallback.
          path: ${{ steps.derived-cache-key.outputs.derived-dir }}
          key: ${{ steps.derived-cache-key.outputs.derived-key }}

      - name: Publish runtime STARTING marker
        shell: bash
        run: |
          set -euo pipefail
          # Gate D durable lifecycle: STARTING is published before OpenCode /
          # Telegram bootstrap with the exact run id/SHA.
          sha="$(git rev-parse HEAD)"
          RUN_PHASE="STARTING" RUN_SHA="$sha" python - <<'PY'
          import time
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from aa.control.runtime_status import RuntimeMarker, write_marker
          import os
          marker = RuntimeMarker(run_id=os.environ["RUN_ID"], sha=os.environ["RUN_SHA"], phase=os.environ["RUN_PHASE"], timestamp_s=time.time())
          write_marker(Path("runtime-status.json"), marker)
          print(f"STARTING marker published run={marker.run_id} sha={marker.sha[:12]}")
          PY
        env:
          RUN_ID: ${{ github.run_id }}

      - name: Run bounded Telegram poller and OpenCode
        # Authoritative readiness (issue #144): Application.start() publishes
        # a privacy-safe READY marker (run id, exact main SHA, timestamp,
        # campaign ordinal) to control issue #31 only after OpenCode health,
        # Telegram getMe, webhook/commands bootstrap, long polling live and
        # the bounded controller start. Startup failures before READY publish
        # STARTUP_FAILED with a bounded category; a GitHub step that is
        # merely in_progress is never readiness.
        id: runtime
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_SESSION_DURATION_SECONDS: ${{ steps.duration.outputs.seconds }}
          OPENCODE_BASE_URL: http://127.0.0.1:4096
          OPENCODE_COMMAND: opencode
          OPENCODE_WORKDIR: .
          OPENCODE_AGENT: aa
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
          OPENCODE_CONTEXT_LIMIT_TOKENS: "200000"
          GITHUB_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          AA_CAMPAIGN_SEQ: ${{ inputs.seq }}
          AA_ENABLE_READY_PUBLISH: "1"
          # Quality-first runtime now shares bounded 60s/120s Gate E contract.
          # Diagnostic no-limit bypass is disabled to keep runtime and Gate C comparable.
          LOG_LEVEL: INFO
        shell: bash
        run: |
          set +e
          python -m aa
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            mkdir -p runtime-recovery
            printf '%s\n' '{"reason_code":"OPENCODE_429_RESTART_REQUIRED"}' > runtime-recovery/result.json
            echo "restart_required=true" >> "$GITHUB_OUTPUT"
            echo "::error::OpenCode 429: retire this runner and start a fresh runtime VM."
            exit 75
          fi
          echo "restart_required=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload 429 runner-restart marker
        if: always() && steps.runtime.outputs.restart_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aa-runtime-429-recovery
          path: runtime-recovery/result.json
          retention-days: 1
          if-no-files-found: error

      - name: Publish runtime READY/STOPPED marker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Gate D: publish READY automatically once OpenCode health +
          # Telegram bootstrap + long polling are live; STOPPED|FAILED after.
          # /bot status reports this aa-runtime-status marker, never generic
          # workflow in_progress.
          sha="$(git rev-parse HEAD)"
          # The bounded runtime step has already ended here. Application.start()
          # publishes READY while the poller is actually live; completion can
          # only publish STOPPED (or FAILED below), never READY.
          phase="STOPPED"
          if [[ "${{ steps.runtime.outputs.restart_required }}" == "true" ]]; then
            phase="FAILED"
          fi
          if [[ "${{ job.status }}" != "success" ]]; then
            phase="FAILED"
          fi
          RUN_PHASE="$phase" RUN_SHA="$sha" python - <<'PY'
          import os, time
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from aa.control.runtime_status import RuntimeMarker, format_marker, write_marker
          marker = RuntimeMarker(run_id=os.environ["RUN_ID"], sha=os.environ["RUN_SHA"], phase=os.environ["RUN_PHASE"], timestamp_s=time.time())
          write_marker(Path("runtime-status.json"), marker)
          print(format_marker(marker))
          PY
        env:
          RUN_ID: ${{ github.run_id }}

      - name: Record bounded completion
        if: success()
        run: |
          echo "AA runtime completed its requested 5h live window." >> "$GITHUB_STEP_SUMMARY"

      - name: Report privacy-safe completion to control issue
        # Best effort: infrastructure failure must terminate cleanly without
        # resetting campaign counters, and status must never expose message
        # text, prompts, corpus dumps or credentials (ids/counters only).
        if: always()
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CONTROL_ISSUE: "31"
          RUN_CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ github.token }}
          script: |
            const controlIssue = Number(process.env.CONTROL_ISSUE);
            const conclusion = process.env.RUN_CONCLUSION || 'unknown';
            const runId = context.runId;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: controlIssue,
                body: [
                  'AA runtime run #' + runId + ' finished (' + conclusion + ').',
                  'Requested window: 5h. Campaign bounds: 4 starts / 20h requested / 24h wall clock.',
                  'Use `/bot status` for the authoritative campaign state.',
                ].join('\n'),
              });
            } catch (error) {
              core.warning('Completion report no-op: ' + error.message);
            }
