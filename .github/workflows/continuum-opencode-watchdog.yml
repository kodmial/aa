name: OpenCode watchdog

on:
  # GitHub matches this filter on the watched workflow's `name:` VALUE, never
  # on its file name. `OpenCode agent` is the `name:` of the OpenCode caller
  # (continuum-opencode.yml). Renaming that `name:` silently disables this
  # watchdog: no recovery runs will be delivered any more.
  workflow_run:
    workflows: ["OpenCode agent"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-opencode-watchdog.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      watched_workflow: "OpenCode agent"
      # Pin both retry budgets instead of inheriting a mutable repository
      # variable. The 429 value is the reviewed upstream default (3); keeping
      # it explicit means a variable edit cannot silently disable genuine
      # fresh-VM 429 recovery or turn the bounded retries into a loop.
      max_recovery_retries: "3"
      max_429_runner_restarts: "3"
      pause_on_failure: "false"
