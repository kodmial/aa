name: AA system canary monitor

on:
  workflow_run:
    workflows:
      - AA system canary
    types:
      - completed
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: aa-system-canary-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile canary health incident
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- aa-system-canary-incident:v1 -->';
            const workflowFile = 'aa-system-canary.yml';
            const staleMs = 5 * 60 * 60 * 1000;

            let run = null;
            if (context.eventName === 'workflow_run') {
              run = context.payload.workflow_run;
              if (run && run.head_branch !== 'main') {
                core.info(`Ignoring canary run #${run.id} on branch ${run.head_branch}; only main counts.`);
                return;
              }
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                branch: 'main',
                per_page: 20,
              });
              run = response.data.workflow_runs[0] || null;
            }

            let unhealthy = false;
            let reason = '';
            if (!run) {
              unhealthy = true;
              reason = 'No AA system canary run exists on main.';
            } else {
              const createdAt = Date.parse(run.created_at);
              const ageMs = Number.isFinite(createdAt) ? Date.now() - createdAt : Number.POSITIVE_INFINITY;
              const active = ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status);

              if (active && ageMs <= staleMs) {
                core.info(`Canary run #${run.id} is still active; no incident change.`);
                return;
              }
              if (ageMs > staleMs) {
                unhealthy = true;
                reason = `Latest canary run #${run.id} is stale (${Math.round(ageMs / 60000)} minutes old).`;
              } else if (run.conclusion !== 'success') {
                unhealthy = true;
                reason = `Canary run #${run.id} concluded ${run.conclusion || run.status}.`;
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            let incident = openIssues.find(
              issue => !issue.pull_request && String(issue.body || '').includes(marker)
            );

            const runUrl = run?.html_url || `${context.serverUrl}/${owner}/${repo}/actions/workflows/${workflowFile}`;
            const runId = run?.id || 'none';
            const runSha = run?.head_sha || 'unknown';

            if (unhealthy) {
              const body = [
                marker,
                '',
                '## Goal',
                '',
                'Restore the scheduled AA system canary without weakening or skipping its health checks.',
                '',
                '## Latest failure',
                '',
                `- Reason: ${reason}`,
                `- Run: ${runUrl}`,
                `- Run ID: ${runId}`,
                `- Main SHA: \`${runSha}\``,
                '',
                '## Repair rules',
                '',
                '- Diagnose the failed stage from the workflow run before changing code.',
                '- Keep package build, full project verification, Telegram Bot API connectivity, and the real OpenCode provider probe intact.',
                '- If the failure is external/transient, do not make speculative product changes; preserve bounded retry/backoff and prove recovery with a successful canary run.',
                '- Do not add release/deployment behavior to the canary.',
                '- Do not expose bot tokens, prompts, provider responses, or user data in comments/logs.',
                '',
                '## Definition of Done',
                '',
                '- [ ] Root cause is identified.',
                '- [ ] The current-main canary completes successfully.',
                '- [ ] The monitor observes that healthy run.',
                '- [ ] No canary coverage was weakened to obtain green.',
              ].join('\n');

              if (!incident) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'P0: Repair AA scheduled system canary failure',
                  body,
                  labels: ['priority:p0'],
                });
                incident = created.data;
                core.info(`Created canary incident #${incident.number}.`);
              } else {
                const existingBody = String(incident.body || '');
                if (existingBody.includes(`- Run ID: ${runId}`)) {
                  core.info(`Canary incident #${incident.number} already reports run ${runId}; skipping duplicate update.`);
                  return;
                }
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body,
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body: `Canary is still unhealthy. Latest evidence: ${runUrl}\n\n${reason}`,
                });
              }

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'continuum-issue-scheduler.yml',
                  ref: 'main',
                  inputs: {},
                });
              } catch (error) {
                core.warning(`Could not immediately wake the issue scheduler: ${error.message}`);
              }
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `AA system canary recovered on current main. Healthy run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed recovered canary incident #${incident.number}.`);
            } else {
              core.info(`AA system canary healthy: ${runUrl}`);
            }
