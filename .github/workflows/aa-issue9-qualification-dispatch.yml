name: AA issue-9 qualification dispatch

# After the #9 grounded conversational runtime merges to main, automatically
# dispatch the exact-main #40 qualification (continuum-opencode
# qualification mode: capability #9, qualification #40) at the merged SHA.
# Validation only; product code is never repaired here. The path filter is
# the deterministic product-qualification input set: runtime code, prompt,
# retrieval/grounding, corpus/index bindings, Telegram production adapter
# and relevant config. Unrelated scheduler/docs-only commits never dispatch
# here and never stale product qualification.

on:
  push:
    branches:
      - main
    paths:
      - "src/aa/conversation/**"
      - "src/aa/retrieval/**"
      - "src/aa/grounding/**"
      - "src/aa/corpus/**"
      - "src/aa/safety/**"
      - "src/aa/sessions/**"
      - "src/aa/telegram/**"
      - "src/aa/qualification/**"
      - "src/aa/app.py"
      - "src/aa/config.py"
      - "scripts/verify_runtime_qualification.py"
      - "prompts/aa-agent-system.md"
      - "opencode.json"
      - "qualification/production_boundary.v1.json"
      - ".opencode/tools/book_*.ts"
  workflow_dispatch:
    inputs:
      required_sha:
        description: "Exact main SHA to qualify (defaults to current main)"
        required: false
        type: string

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-issue-40:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.required_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact SHA under test
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "exact-main under test: $sha"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run runtime qualification gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_runtime_qualification.py

      - name: Dispatch exact-main #40 qualification
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_SHA: ${{ steps.sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run continuum-opencode.yml \
            --ref main \
            -f mode=qualification \
            -f capability_number=9 \
            -f qualification_number=40 \
            -f required_sha="$REQUIRED_SHA"
          echo "dispatched #40 qualification at $REQUIRED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Note dispatch on #40
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_SHA: ${{ steps.sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 40 --body "Issue #9 runtime merged at \`$REQUIRED_SHA\`. Runtime qualification gate passed; exact-main #40 qualification dispatched automatically (continuum-opencode qualification mode: capability 9, qualification 40, required_sha $REQUIRED_SHA)."
