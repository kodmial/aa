name: AA Gate C scenario2 diagnostic

# kodmial/aa#418 + kodmial/aa#424 (P0 diagnostic, progress/liveness-driven):
# run ONLY Gate C scenario #2 (substantive-drinking) through the real
# production path on an Actions runner to reproduce the answer flow
# truthfully, with NO per-answer wall-clock cutoff anywhere (the old
# 45s/75s/130s answer windows are removed; a real model call continuing
# past 45/75/130/300/900 s is observed, not killed).
#
# Strictly diagnostic: NOT qualification evidence, no product-path edits,
# no full 18-case Gate C rerun. Two probes under one shared campaign
# allowance):
#   A) direct OpenCode model call with connect/write/read phase timing
#      (no total response deadline; the TCP connect phase and per-socket
#      inactivity are bounded, mirroring production HttpOpenCodeClient)
#   B) the exact production Application turn for scenario #2 via the
#      qualification lane's in-process Telegram seam
# One idempotent progress comment on issue #418; verdicts are truthful:
# delivered / provider-error-proven / server-error-proven / harness-error /
# unresolved-at-campaign-end / boundary-localized-root-unknown /
# stage-unobserved. INCONCLUSIVE is never reported as a success: the
# diagnostic step exits nonzero so the run is visibly inconclusive.
# Diagnostic-only artifacts carry an explicit "diagnostic" framing and are
# never product qualification evidence.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aa-gate-c-scenario2-diagnostic.yml"
      - "scripts/diagnose_gate_c_scenario2.py"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact SHA to diagnose (defaults to current main)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aa-gate-c-scenario2-diagnostic-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # One finite physical job ceiling (kodmial/aa#424): measured setup
    # (~20m incl. corpus restore/index) + 1800s campaign allowance + 600s
    # publication/upload reserve. The script additionally reconciles its
    # campaign allowance with the remaining job budget via the job-start
    # epoch, so artifacts always upload before this cap.
    timeout-minutes: 60
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "run-id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "main-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "job-start-epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_RUN_ID $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # kodmial/aa#483 — durable declared run identity. A workflow_dispatch
      # Actions record can only name the dispatch-ref head, never the
      # requested target_sha, so the run publishes the exact SHA it checked
      # out to the AA-owned operations tracker as a durable marker. The
      # post-run reconciler binds artifact evidence to that declared SHA.
      - name: Publish declared exact-SHA run identity
        if: steps.sha.conclusion == 'success'
        uses: actions/github-script@v7
        script: |
          const runId = "${{ github.run_id }}";
          const sha = "${{ steps.sha.outputs.main-sha }}";
          const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/" + runId;
          const marker = "<!-- aa-scenario2-diagnostic-declared run=" + runId + " sha=" + sha + " -->";
          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 419,
              per_page: 100
            });
            if (comments.some((c) => c.body && c.body.includes(marker))) {
              core.info("Declared identity marker for run " + runId + " already exists; not duplicating.");
              return;
            }
            // Sanitized notice only (identifiers only, never telemetry).
            const body = marker +
              "\n**Diagnostic run identity declared (kodmial/aa#483)**" +
              "\n- Run: [" + runId + "](" + runUrl + ")" +
              "\n- Declared exact SHA: `" + sha + "`" +
              "\n- This run checked out, verified and diagnosed exactly the declared SHA; " +
              "its artifact evidence is bound to that SHA (aa-gate-c-scenario2-diagnostic)." +
              "\n_Sanitized AA-owned diagnostic identity record; not qualification evidence._";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 419,
              body
            });
          } catch (error) {
            core.warning("Declared-identity publishing failed (non-fatal): " + error);
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install AA pinned OpenCode via verified Continuum toolchain
        uses: ./.github/actions/aa-opencode-toolchain
        with:
          opencode-version: ${{ vars.CONTINUUM_OPENCODE_VERSION }}

      - name: Resolve AA-owned conversation models
        id: bot_model
        env:
          AA_BOT_PRIMARY_MODEL: ${{ vars.AA_BOT_PRIMARY_MODEL }}
          AA_BOT_FALLBACK_MODEL: ${{ vars.AA_BOT_FALLBACK_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          python -m aa.bot_models --github-output "$GITHUB_OUTPUT"

      - name: Restore offline canonical corpus and build retrieval index
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_canonical.py --no-network-fallback
          python scripts/restore_canonical.py --lang ru --no-network-fallback
          python scripts/build_corpus_structure.py
          python scripts/prefetch_public_assets.py
          # Text scenario only: NO voice prefetch for this diagnostic run.
          python scripts/build_retrieval_index.py --backend e5

      - name: Run scenario2 diagnostic (no per-answer cutoff; campaign allowance)
        id: diag
        env:
          OPENCODE_MODEL: ${{ steps.bot_model.outputs.primary }}
          OPENCODE_FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python scripts/diagnose_gate_c_scenario2.py \
            --main-sha "${{ steps.sha.outputs.main-sha }}" \
            --run-id "${{ github.run_id }}" \
            --issue 418 \
            --owner kodmial \
            --repo aa \
            --campaign-allowance-s 1800 \
            --finalisation-reserve-s 600 \
            --job-timeout-minutes 60 \
            --job-started-epoch "${{ steps.sha.outputs.job-start-epoch }}" \
            --out-dir diagnostic-scenario2-out || status=$?
          if [ -f diagnostic-scenario2-out/result.json ]; then
            echo "result-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "result-published=false" >> "$GITHUB_OUTPUT"
          fi
          # Truthful, non-deceptive conclusion (kodmial/aa#424): exit 0 is
          # only the DELIVERED outcome. Exit 3 = INCONCLUSIVE
          # (unresolved-at-campaign-end / boundary-localized): the run is
          # NOT reported as success and the step summary names it.
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 3 ]; then
            echo "outcome: INCONCLUSIVE (unresolved-at-campaign-end or boundary-localized) — NOT a success."
            echo "::warning::scenario2 diagnostic ended INCONCLUSIVE; artifact holds the evidence"
            exit 3
          fi
          echo "::error::scenario2 diagnostic failed with exit code $status"
          exit "$status"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-gate-c-scenario2-diagnostic-${{ github.run_id }}-scenario2
          path: diagnostic-scenario2-out/
          if-no-files-found: warn
          retention-days: 7

      - name: Notify on unpublished diagnostic lifecycle
        # Fallback only: the script itself owns the idempotent #418 comment.
        # Fires ONLY when the script could not even publish result.json --
        # an INCONCLUSIVE-but-published run must not trigger a degraded
        # notice (the script already posted its final report).
        if: always() && steps.diag.outcome == 'failure' && steps.diag.outputs.result-published != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = "${{ github.run_id }}";
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/" + runId;
            const sha = "${{ steps.sha.outputs.main-sha }}";
            const marker = "<!-- aa-scenario2-diagnostic run=" + runId + " -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 418,
              per_page: 100
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              core.info("Comment for run " + runId + " already exists; not duplicating.");
              return;
            }
            // Sanitized notice only (never log bot tokens or payloads).
            const body = [
              "<!-- aa-scenario2-diagnostic run=" + runId + " -->",
              "**AA Gate C scenario #2 diagnostic (P0, kodmial/aa#418)**",
              "",
              "Status: `workflow-degraded-before-or-around-diagnostic` (sanitized notice).",
              "- Run URL: " + runUrl,
              "- Exact SHA: `" + sha + "`",
              "- Failed step: `" + "${{ steps.diag.outcome }}" + "`",
              "",
              "The diagnostic script failed to publish its own final report. Check the",
              "run log and the uploaded artifacts for sanitized evidence.",
              "_Diagnostic-only: not qualification evidence._"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 418,
              body
            });
