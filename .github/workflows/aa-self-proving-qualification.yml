name: AA self-proving qualification

# Authoritative layered qualification DAG for issue #146 (Gates A-F).
# Repository-owned workflow with required repository secrets/assets (never a
# generic coding-agent runner that lacks them). Owner /run for manual testing
# stays available regardless of qualification state; qualification controls
# only the QUALIFIED/UNQUALIFIED label. INCOMPLETE, missing secret/model,
# stale SHA, mocked-only evidence, or unknown state all mean FAIL/BLOCKED
# for qualification, never a restriction on owner-initiated manual testing.
#
# Gate order with checkpoint resume:
#   A static/build -> B deterministic integration -> C live production path
#   -> D Telegram readiness -> E performance/SLO -> F exact-main verdict.
# On failure the failed gate reruns first, then downstream gates, then the
# final exact-main gate, bounded by MAX_REPAIR_CYCLES. Provider 429
# (OPENCODE_429_RESTART_REQUIRED) retires
# the runner and resumes from the last completed gate checkpoint. HTTP 403
# uses bounded exponential retry (>= 5s base). Infrastructure failure is
# never misreported as product PASS.

on:
  push:
    branches:
      - main
    paths:
      - "src/aa/**"
      - "prompts/**"
      - "opencode.json"
      - "corpus/**"
      - "qualification/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/aa-*.yml"
      - ".github/workflows/continuum-*.yml"
  workflow_dispatch:
    inputs:
      required_sha:
        description: "Exact current main SHA to qualify (defaults to current main)"
        required: false
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: aa-self-proving-qualification
  # Exact-main evidence becomes invalid as soon as main advances. Cancel stale
  # qualification immediately so the newest main SHA owns the single slot.
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.required_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact current main identity and clean tree
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Refusing qualification on a dirty tree."
            exit 2
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked_sha" != "$current_main" ]]; then
            echo "::error::Refusing stale qualification: checked=$checked_sha current-main=$current_main"
            mkdir -p self-proving-out
            printf '{"reason_code":"STALE_MAIN","checked_sha":"%s","current_main":"%s"}\n' \
              "$checked_sha" "$current_main" > self-proving-out/stale-main.json
            exit 3
          fi
          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"
          echo "exact current main: $checked_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install system voice media dependency
        shell: bash
        run: |
          set -euo pipefail
          # Gate C live voice end-to-end (GigaAM ASR decode + Silero TTS
          # OGG/Opus encode) shells out to system ffmpeg. Ubuntu runners do
          # not preinstall it, so every Gate C run failed
          # live-voice-fixture-synthesis-encode-failed with no voice
          # end-to-end evidence. Install once so all gates share it.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Restore gate checkpoints from previous attempt
        # RUNNER_TEMP is ephemeral per runner, so a 429 runner retire would
        # otherwise lose completed-gate checkpoints. Persist them as a
        # run-scoped artifact and restore them here so the next runner
        # resumes from the last completed gate instead of rerunning Gate A.
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-self-proving-checkpoints
          path: /tmp/aa-self-proving-checkpoints-restore
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage restored gate checkpoints
        if: ${{ github.run_attempt > 1 }}
        shell: bash
        run: |
          set -euo pipefail
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          RESTORE_DIR="/tmp/aa-self-proving-checkpoints-restore"
          mkdir -p "$CKPT_DIR"
          if compgen -G "$RESTORE_DIR/gate-*.done" > /dev/null; then
            cp "$RESTORE_DIR"/gate-*.done "$CKPT_DIR"/
            echo "restored gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          elif compgen -G "$RESTORE_DIR/**/gate-*.done" > /dev/null; then
            find "$RESTORE_DIR" -name 'gate-*.done' -exec cp {} "$CKPT_DIR"/ \;
            echo "restored nested gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          else
            echo "no previous gate checkpoints found"
          fi
          if [[ -d "$RESTORE_DIR/live-out" ]]; then
            rm -rf live-out
            cp -R "$RESTORE_DIR/live-out" live-out
            echo "restored Gate C privacy-safe live evidence"
          fi
          if [[ -f "$RESTORE_DIR/runtime-status.json" ]]; then
            mkdir -p self-proving-out
            cp "$RESTORE_DIR/runtime-status.json" self-proving-out/runtime-status.json
            echo "restored Gate D runtime evidence"
          fi

      - name: Gate A - static/build
        id: gate-a
        shell: bash
        run: |
          set -euo pipefail
          # Checkpoint resume: skip this gate when its checkpoint already
          # exists (provider 429 runner retire resumes from the last
          # completed gate instead of re-running from the start).
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if [[ -f "$CKPT_DIR/gate-A.done" ]]; then
            echo "Gate A checkpoint present; skipping (resume)."
            exit 0
          fi
          # Exact SHA + clean tree verified above; canonical restore
          # metadata/fingerprints, unit/type/lint, and prompt/config/model/
          # retrieval fingerprint consistency run here fail-closed.
          bash scripts/verify.sh
          python scripts/verify_product_contract_qualification.py --require-active
          python scripts/verify_runtime_qualification.py
          mkdir -p "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          echo "A" > "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints/gate-A.done"

      - name: Gate B - deterministic component integration
        id: gate-b
        shell: bash
        env:
          AA_ALLOW_NETWORK_FETCH: "0"
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          # Checkpoint resume: skip when Gate B already completed.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if [[ -f "$CKPT_DIR/gate-B.done" ]]; then
            echo "Gate B checkpoint present; skipping (resume)."
            exit 0
          fi
          # Real RU corpus restore + real BM25/E5/FAISS index bootstrap, then
          # planner cardinality/shape, retrieval/RRF/dedup/diversity/
          # small-to-big, grounding/verifier and output envelope, memory/FIFO/
          # concurrency/safety, voice fixtures/cache/resource checks. Failures
          # attribute to a concrete component, never a generic PASS.
          python scripts/restore_canonical.py --no-network-fallback
          python scripts/restore_canonical.py --lang ru --no-network-fallback
          python scripts/build_corpus_structure.py
          # Gate B must exercise the production dense substrate, never the
          # hermetic hashing fallback. Public model prefetch is allowed here;
          # a missing/unloadable pinned model is a qualification failure.
          python scripts/prefetch_public_assets.py
          # Voice is part of the Product Contract too. Qualification must
          # provision and verify the pinned GigaAM/Silero/presentation assets
          # rather than leaving the voice lane permanently INCOMPLETE.
          python scripts/prefetch_voice_assets.py
          python scripts/build_retrieval_index.py --backend e5
          python -m pytest -q tests/test_p0_3_v2_retrieval.py tests/test_hybrid_retrieval.py \
            tests/test_aa_retrieval_qualification.py tests/test_conversation_runtime.py \
            tests/test_output_envelope.py tests/test_sessions_safety_control.py \
            tests/test_telegram_concurrency.py tests/test_idempotent_dispatch.py
          mkdir -p "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          echo "B" > "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints/gate-B.done"

      - name: Gate C - LIVE exact production conversation path
        id: gate-c
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
        run: |
          set -euo pipefail
          # Checkpoint resume: skip when Gate C already completed.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if [[ -f "$CKPT_DIR/gate-C.done" ]]; then
            echo "Gate C checkpoint present; skipping (resume)."
            exit 0
          fi
          # Repository-owned live gate: real local OpenCode process and real
          # configured runtime provider/model policy, real decrypted RU corpus
          # + real production index, synthetic Telegram Updates injected only
          # at the production Telegram adapter boundary through the exact
          # Application -> dispatcher -> LangGraph -> planner -> retrieval ->
          # answer -> verifier -> delivery serialization path. Planner/answer/
          # verifier/provider/retrieval are never stubbed here. Scenario
          # families (meta/capability, substantive drinking,
          # family/relationship, follow-ups/ellipsis, topic shift,
          # unsupported/out-of-book, emergency, long conversation) with a
          # response-diversity assertion and privacy-safe per-stage
          # outcomes/latency only. Missing secret/model yields BLOCKED, never
          # mocked PASS.
          # The live runner may legitimately return INCOMPLETE for evidence
          # explicitly owned by downstream Gate D. Always let the self-proving
          # mapper classify PASS/FAIL/BLOCKED from the produced evidence.
          # Provider 429 is different: retire this VM immediately and persist
          # the restart marker for the workflow_run recovery controller.
          set +e
          python scripts/run_product_contract_live_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir live-out --run-id "${{ github.run_id }}"
          product_rc=$?
          set -e
          if [[ "$product_rc" -eq 75 ]]; then
            mkdir -p self-proving-out
            cp live-out/restart-required.json self-proving-out/restart-required.json
            echo "::error::Gate C provider 429: retire runner and resume on a fresh VM."
            exit 75
          fi
          QUAL_SHA="${{ steps.sha.outputs.sha }}" QUAL_RUN="${{ github.run_id }}" python - <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "src")
          import scripts.run_self_proving_qualification as runner

          sha = os.environ["QUAL_SHA"]
          run_id = os.environ["QUAL_RUN"]
          product = runner._product_fingerprint()
          runtime = runner._runtime_fingerprint()
          evidence, _, _ = runner._gate_c(sha, run_id, product, runtime)
          print(f"Gate C {evidence.status}: {evidence.failure_category or evidence.component}")
          if evidence.status != "PASS" or not evidence.live_trusted or evidence.mocked_only:
              raise SystemExit(1 if evidence.status == "FAIL" else 2)
          PY
          mkdir -p "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          echo "C" > "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints/gate-C.done"

      - name: Gate D - real Telegram network/runtime readiness
        id: gate-d
        # Gate D is independent of Gate C functional correctness. Run it after
        # any completed Gate C attempt so one functional failure cannot hide a
        # second runtime-readiness defect. A provider-429 restart marker still
        # retires this VM immediately.
        if: ${{ always() && (steps.gate-c.outcome == 'success' || steps.gate-c.outcome == 'failure') && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          QUAL_SHA: ${{ steps.sha.outputs.sha }}
          QUAL_RUN: ${{ github.run_id }}
          OPENCODE_BASE_URL: http://127.0.0.1:4096
          OPENCODE_COMMAND: opencode
          OPENCODE_WORKDIR: .
          OPENCODE_AGENT: aa
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
        run: |
          set -euo pipefail
          # Checkpoint resume: skip when Gate D already completed.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if [[ -f "$CKPT_DIR/gate-D.done" ]]; then
            echo "Gate D checkpoint present; skipping (resume)."
            exit 0
          fi
          # Real bot token, OpenCode health, Telegram getMe, webhook cleanup/
          # config, commands setup, long polling actually started. Publishes
          # the durable STARTING -> READY -> STOPPED|FAILED marker with the
          # exact run id/SHA; /bot status reports that marker.
          # Single-poller lock: this step runs under the workflow concurrency
          # group aa-self-proving-qualification (cancel-in-progress: false),
          # so only one qualification poller ever starts. The bounded probe
          # below starts the actual Application with the real
          # PollingTelegramTransport, proves OpenCode health + getMe +
          # deleteWebhook/setMyCommands + transport.running with a live poll
          # task, publishes READY only from the running app, then stops
          # cleanly with no leaked poll task. A bare getMe + write_marker
          # without the live Application is forbidden and fails this gate.
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "::error::Gate D BLOCKED: TELEGRAM_BOT_TOKEN is not configured."
            mkdir -p self-proving-out
            printf '{"reason_code":"EXTERNAL_TELEGRAM_TOKEN_UNAVAILABLE","gate":"D"}\n' > self-proving-out/transient-blocked.json
            exit 78
          fi
          # HTTP 403 uses bounded exponential retry with >= 5s base.
          delay=5
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /tmp/getme.json -w '%{http_code}' --max-time 15 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" || true)"
            if [[ "$code" == "200" ]]; then
              break
            fi
            if [[ "$code" == "403" && "$attempt" -lt 5 ]]; then
              echo "Telegram getMe 403; retry $attempt in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
              continue
            fi
            echo "::error::Gate D BLOCKED: Telegram getMe failed (http=$code)."
            mkdir -p self-proving-out
            printf '{"reason_code":"EXTERNAL_TELEGRAM_GETME","gate":"D","http":"%s"}\n' "$code" > self-proving-out/transient-blocked.json
            exit 78
          done
          python - <<'PY'
          import json
          payload = json.loads(open("/tmp/getme.json", encoding="utf-8").read())
          assert payload.get("ok") is True, "Telegram getMe ok != true"
          assert (payload.get("result") or {}).get("is_bot") is True, "not a bot identity"
          print("Telegram getMe readiness: OK")
          PY
          python - <<'PY'
          import asyncio
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, "src")
          from aa.app import create_application
          from aa.config import Settings
          from aa.control.runtime_status import RuntimeMarker, write_marker
          from aa.opencode.errors import OpenCodeRateLimitError
          from aa.telegram.transport import PollingTelegramTransport, TelegramApiError

          async def _active_telegram_poller_running() -> bool:
              """Return True when another Telegram poller holds getUpdates (409)."""
              import urllib.error
              import urllib.request

              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              if not token:
                  return False
              url = f"https://api.telegram.org/bot{token}/getUpdates?timeout=0&limit=1"

              def _check() -> bool:
                  req = urllib.request.Request(url, method="GET")
                  try:
                      with urllib.request.urlopen(req, timeout=10):
                          return False
                  except urllib.error.HTTPError as exc:
                      if exc.code == 409:
                          return True
                      return False
                  except Exception:
                      return False

              return await asyncio.to_thread(_check)

          async def _probe() -> None:
              sha = os.environ.get("QUAL_SHA", "")
              run_id = os.environ.get("QUAL_RUN", "")
              out = Path("self-proving-out/runtime-status.json")
              starting = RuntimeMarker(run_id=run_id, sha=sha, phase="STARTING", timestamp_s=time.time())
              write_marker(out, starting)
              print(f"runtime marker STARTING published run={run_id} sha={sha[:12]}")
              settings = Settings.from_env(None)
              assert settings.has_bot_token, "Gate D BLOCKED: bot token missing for Application"
              app = create_application(settings)
              assert isinstance(app.transport, PollingTelegramTransport), (
                  "Gate D BLOCKED: Application is not using real PollingTelegramTransport"
              )
              try:
                  active = await _active_telegram_poller_running()
                  if active:
                      transient = Path("self-proving-out/transient-blocked.json")
                      transient.parent.mkdir(parents=True, exist_ok=True)
                      transient.write_text(
                          json.dumps(
                              {"reason_code": "EXTERNAL_TELEGRAM_POLLER_CONFLICT", "gate": "D"},
                              sort_keys=True,
                          ) + "\n",
                          encoding="utf-8",
                      )
                      raise SystemExit(78)
                  await app.start()
              except OpenCodeRateLimitError:
                  failed = RuntimeMarker(
                      run_id=run_id,
                      sha=sha,
                      phase="FAILED",
                      timestamp_s=time.time(),
                  )
                  write_marker(out, failed)
                  restart = Path("self-proving-out/restart-required.json")
                  restart.parent.mkdir(parents=True, exist_ok=True)
                  restart.write_text(
                      json.dumps(
                          {
                              "reason_code": "OPENCODE_429_RESTART_REQUIRED",
                              "sha": sha,
                              "run_id": run_id,
                              "gate": "D",
                          },
                          sort_keys=True,
                          indent=2,
                      )
                      + "\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(75)
              except TelegramApiError:
                  transient = Path("self-proving-out/transient-blocked.json")
                  transient.parent.mkdir(parents=True, exist_ok=True)
                  transient.write_text(
                      json.dumps(
                          {"reason_code": "EXTERNAL_TELEGRAM_API", "gate": "D"},
                          sort_keys=True,
                      ) + "\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(78)
              except Exception as exc:
                  failed = RuntimeMarker(run_id=run_id, sha=sha, phase="FAILED", timestamp_s=time.time())
                  write_marker(out, failed)
                  raise SystemExit(f"Gate D BLOCKED: Application.start failed: {type(exc).__name__}")
              try:
                  try:
                      # OpenCode health proved by start (ensure_ready passed).
                      assert app.running, "Application not running after start"
                      assert app.opencode_runtime.running, "OpenCode runtime not running"
                      assert app.opencode_runtime.ready, "OpenCode health not ready"
                      # Real Telegram bootstrap proved by live transport.
                      transport = app.transport
                      assert isinstance(transport, PollingTelegramTransport)
                      assert transport.running, "transport.running is not live"
                      poll_task = getattr(transport, "_poll_task", None)
                      assert poll_task is not None, "live poll task missing"
                      assert not poll_task.done(), "poll task already done; polling not live"
                      bot_info = transport.bot_info
                      assert isinstance(bot_info, dict) and bot_info.get("is_bot") is True, "getMe identity not live"
                      handlers = getattr(transport, "_command_handlers", {})
                      assert "start" in handlers and "new" in handlers, "webhook/commands bootstrap incomplete"
                      # READY is published only from the running app.
                      assert app.readiness_marker, "READY was not published from the running app"
                      assert "READY" in app.readiness_marker, "running app readiness is not READY"
                      ready = RuntimeMarker(run_id=run_id, sha=sha, phase="READY", timestamp_s=time.time())
                      write_marker(out, ready)
                      print(f"runtime marker READY published from live app run={run_id} sha={sha[:12]}")
                      print(f"polling live: transport.running={transport.running} poll_task_live={not poll_task.done()}")
                  finally:
                    await app.stop()
                    leaked = [t for t in asyncio.all_tasks() if t.get_name() == "telegram-polling" and not t.done()]
                    assert not app.running, "Application leaked running state after stop"
                    assert not app.transport.running, "transport leaked running state after stop"
                    assert not leaked, f"poll task leaked: {len(leaked)} live telegram-polling tasks"
                    print("Application stopped cleanly with no leaked poll task")
                  stopped = RuntimeMarker(run_id=run_id, sha=sha, phase="STOPPED", timestamp_s=time.time())
                  write_marker(out, stopped)
                  print(f"runtime marker STOPPED published run={run_id} sha={sha[:12]}")
              except Exception:
                  failed = RuntimeMarker(run_id=run_id, sha=sha, phase="FAILED", timestamp_s=time.time())
                  write_marker(out, failed)
                  raise

          asyncio.run(_probe())
          PY
          mkdir -p "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          echo "D" > "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints/gate-D.done"

      - name: Gate E - live performance/SLO
        # Gate E owns latency independently of Gate C functional correctness.
        # Evaluate the trusted Gate C measurements even when C itself fails so
        # the repair loop can attack C and E in the same cycle.
        if: ${{ always() && (steps.gate-c.outcome == 'success' || steps.gate-c.outcome == 'failure') && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
        run: |
          set -euo pipefail
          # Checkpoint resume: skip when Gate E already completed.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if [[ -f "$CKPT_DIR/gate-E.done" ]]; then
            echo "Gate E checkpoint present; skipping (resume)."
            exit 0
          fi
          # End-to-end and per-stage latency p50/p95 from Gate C evidence.
          # Gate E consumes the trusted live measurements independently of
          # Gate C's functional verdict and Gate D's network-readiness result.
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}"
          # Hard guard: no ordinary qualification turn may take >= 30s; p95
          # target materially below that. Typing heartbeat continuity is
          # verified independently. Pathological latency fails the gate.
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("self-proving-out/self-proving-summary.json")
          if not path.is_file():
              print("Gate E BLOCKED: no Gate C latency evidence", file=sys.stderr)
              sys.exit(2)
          summary = json.loads(path.read_text(encoding="utf-8"))
          gates = {g.get("gate"): g for g in summary.get("gates", [])}
          print(json.dumps({"gates": [(k, v.get("status")) for k, v in gates.items()]}))
          gate_e = gates.get("E")
          if gate_e is None:
              print("Gate E BLOCKED: missing Gate E evidence", file=sys.stderr)
              sys.exit(2)
          if gate_e.get("status") != "PASS":
              print(f"Gate E BLOCKED: status={gate_e.get('status')}", file=sys.stderr)
              sys.exit(2 if gate_e.get("status") in ("BLOCKED", "STALE") else 1)
          try:
              p50 = float(gate_e.get("latency_p50_ms", 0.0))
              p95 = float(gate_e.get("latency_p95_ms", 0.0))
              max_turn = float(gate_e.get("max_turn_ms", 0.0))
          except (TypeError, ValueError):
              print("Gate E BLOCKED: latency evidence is not numeric", file=sys.stderr)
              sys.exit(2)
          # Sample-count guard: zero/negative latencies mean no live samples.
          if p50 <= 0 or p95 <= 0 or max_turn <= 0:
              print(
                  f"Gate E BLOCKED: no live latency samples (p50={p50} p95={p95} max={max_turn})",
                  file=sys.stderr,
              )
              sys.exit(2)
          # Hard SLO guard (machine-enforced): p95 target 15s, ordinary-turn
          # budget 30s. Any ordinary turn >= 30s fails, as does p95 > 15s.
          if p95 > 15000:
              print(f"Gate E FAIL: p95 {p95:.0f}ms exceeds 15000ms target", file=sys.stderr)
              sys.exit(1)
          if max_turn >= 30000:
              print(f"Gate E FAIL: ordinary turn {max_turn:.0f}ms >= 30000ms budget", file=sys.stderr)
              sys.exit(1)
          print(f"Gate E PASS: p50={p50:.0f}ms p95={p95:.0f}ms max={max_turn:.0f}ms")
          PY
          mkdir -p "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          echo "E" > "${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints/gate-E.done"

      - name: Gate F - exact-main final verdict
        id: gate-f
        # Always emit the machine-readable final verdict so a failed Gate C/D/E
        # never degrades to unknown-gate-failure: the repair publisher maps the
        # concrete blocking gate/component from self-proving-summary.json.
        # Live env is preserved here (issue #153) so Gate F re-evaluation
        # cannot replace a real Gate C live-path-failed with
        # live-execution-not-enabled; the runner additionally prefers the
        # persisted live-out artifact regardless of env.
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_FALLBACK_MODEL: opencode/space-bunny-free
        run: |
          set -euo pipefail
          # Checkpoint resume: Gate F is terminal; re-verify unconditionally
          # so a stale final verdict can never be reused after resume.
          # PASS only if A-E PASS for the exact same current main SHA with
          # matching product/runtime fingerprints. No stale reuse, no manual
          # override. INCOMPLETE/missing/stale/mocked-only = FAIL/BLOCKED.
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}"

      - name: Stage gate checkpoints for resume
        # Mirror ephemeral RUNNER_TEMP checkpoints into the workspace so the
        # artifact upload below captures completed gates even when this run
        # fails (including provider 429 runner retire).
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          STAGE_DIR="aa-self-proving-checkpoints"
          mkdir -p "$STAGE_DIR"
          if compgen -G "$CKPT_DIR/gate-*.done" > /dev/null; then
            cp "$CKPT_DIR"/gate-*.done "$STAGE_DIR"/
          fi
          if [[ -f live-out/product-contract-live-summary.json ]]; then
            mkdir -p "$STAGE_DIR/live-out"
            cp live-out/product-contract-live-summary.json "$STAGE_DIR/live-out/"
            [[ ! -f live-out/result.json ]] || cp live-out/result.json "$STAGE_DIR/live-out/"
          fi
          if [[ -f self-proving-out/runtime-status.json ]]; then
            cp self-proving-out/runtime-status.json "$STAGE_DIR/runtime-status.json"
          fi
          echo "staged privacy-safe gate checkpoints/evidence for resume:"
          find "$STAGE_DIR" -maxdepth 2 -type f -print || true

      - name: Upload gate checkpoints (429 resume)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-checkpoints
          path: aa-self-proving-checkpoints/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - name: Upload provider 429 restart marker
        if: ${{ failure() && hashFiles('self-proving-out/restart-required.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-restart-${{ github.run_attempt }}
          path: self-proving-out/restart-required.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload stale-main recovery marker
        if: ${{ failure() && hashFiles('self-proving-out/stale-main.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-stale-${{ github.run_attempt }}
          path: self-proving-out/stale-main.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Upload external/transient blocker marker
        if: ${{ failure() && hashFiles('self-proving-out/transient-blocked.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-transient-${{ github.run_attempt }}
          path: self-proving-out/transient-blocked.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Publish machine-readable failure and repair marker
        # Provider 429 and external/transient blockers are recovery states,
        # not product-code repair issues.
        # A workflow_run recovery controller reruns failed jobs on a fresh VM
        # from the persisted gate checkpoints.
        if: ${{ failure() && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        uses: actions/github-script@v7
        env:
          FAILED_SHA: ${{ steps.sha.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Automatic repair loop (issue #146): post the machine-readable
            // failure category + run/SHA + privacy-safe timings, then create
            // or reuse exactly one P0 repair issue scoped to the failing
            // component(s). The Continuum scheduler takes it automatically;
            // PR -> review/repair -> merge reruns the failed gate first, then
            // downstream gates, then the final exact-main gate, boundedly
            // until PASS. Provider 429 retires/restarts the runner and resumes
            // from the last completed qualification gate checkpoint. HTTP 403
            // uses bounded exponential retry >= 5s. Infrastructure failure is
            // never misreported as product PASS.
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.FAILED_SHA || context.sha;
            const runId = String(context.runId);
            const transientBlocked = fs.existsSync('self-proving-out/transient-blocked.json');
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(
                    `${label} failed on attempt ${attempt}: ${error.message}; retrying in ${delayMs}ms.`
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            let category = 'unknown-gate-failure';
            let blocking = 'unknown';
            let component = 'unknown';
            let productFailures = [];
            let timingLine = 'Timings: unavailable in self-proving summary.';
            let stageTimingLine = 'Stage timings: unavailable.';
            let verifierLine = 'Verifier availability: unavailable.';
            let transportTimingLine = 'OpenCode request timings: unavailable.';
            let tokenUsageLine = 'Model token usage: unavailable.';
            let modelPathLine = 'Served models: unavailable.';
            let repairFocus = '- Diagnose the concrete failing component for the blocking gate; never flatten to generic PASS.';
            try {
              const summary = JSON.parse(fs.readFileSync('self-proving-out/self-proving-summary.json', 'utf8'));
              const gates = summary.gates || [];
              productFailures = gates.filter(g => g && g.status === 'FAIL');
              const failed = productFailures[0] || (
                transientBlocked ? null : gates.find(g => g.status !== 'PASS')
              );
              blocking = (failed && failed.gate) || summary.blocking_gate || blocking;
              if (failed) {
                category = `${failed.gate}:${failed.failure_category || failed.status}`;
                component = String(failed.component || 'unknown');
              }
              const latencyFailure = productFailures.find(g => g.gate === 'E') || failed;
              if (latencyFailure) {
                const p50 = Number(latencyFailure.latency_p50_ms || 0);
                const p95 = Number(latencyFailure.latency_p95_ms || 0);
                const max = Number(latencyFailure.max_turn_ms || 0);
                if (p50 > 0 || p95 > 0 || max > 0) {
                  timingLine = `Timings: p50=${Math.round(p50)}ms, p95=${Math.round(p95)}ms, max=${Math.round(max)}ms.`;
                }
              }
              const failGates = new Set(productFailures.map(g => String(g.gate || '')));
              if (failGates.has('C') && failGates.has('E')) {
                repairFocus = '- Repair both proven defects in this same cycle: Gate C functional live-path failure and Gate E SLO failure. Use the concrete C category plus per-stage latency/model evidence; do not defer E until a later qualification run.';
              } else if (blocking === 'E') {
                repairFocus = '- Gate E is the sole live-text SLO owner: fix product latency to p95 <= 15000ms and max < 30000ms. Do not weaken thresholds, tests, qualification semantics, or reclassify the failure into Gate C. Use per-stage telemetry to identify and remove the dominant latency source.';
              } else if (blocking === 'C') {
                repairFocus = '- Gate C owns functional production-path correctness only. Diagnose the concrete broken stage/fallback/diversity/grounding component; latency-only defects belong to Gate E.';
              }
            } catch (error) {
              core.warning('No self-proving summary; using generic failure category: ' + error.message);
            }
            try {
              const live = JSON.parse(fs.readFileSync('live-out/product-contract-live-summary.json', 'utf8'));
              const lane = (live.lanes || []).find(item => item && item.lane === 'live-telegram-evidence');
              const metrics = (lane && lane.metrics) || {};
              const stages = metrics.stage_latency_ms || {};
              const names = ['planner', 'retrieval', 'answer', 'verifier', 'total'];
              const rendered = names
                .filter(name => stages[name])
                .map(name => {
                  const item = stages[name] || {};
                  return `${name}=p50:${Math.round(Number(item.p50 || 0))}/p95:${Math.round(Number(item.p95 || 0))}/max:${Math.round(Number(item.max || 0))}ms`;
                });
              const repair = metrics.repair_metrics || {};
              if (rendered.length) {
                stageTimingLine = 'Stage timings: ' + rendered.join('; ') +
                  `; repair_turns=${Number(repair.turns_with_repair || 0)}, repair_rounds=${Number(repair.repair_rounds_total || 0)}, answer_rounds=${Number(repair.answer_rounds_total || 0)}, budget_exceeded=${Number(repair.repair_budget_exceeded_turns || 0)}.`;
              }
              const verifier = metrics.verifier_metrics || {};
              verifierLine =
                'Verifier availability: ' +
                `turns_with_unavailable_units=${Number(verifier.turns_with_unavailable_units || 0)}, ` +
                `unavailable_units_total=${Number(verifier.unavailable_units_total || 0)}, ` +
                `response_units_total=${Number(verifier.response_units_total || 0)}, ` +
                `response_units_max=${Number(verifier.response_units_max || 0)}.`;
              const requestTimings = metrics.opencode_request_latency_ms || {};
              const requestRendered = Object.keys(requestTimings)
                .sort()
                .map(name => {
                  const item = requestTimings[name] || {};
                  return `${name}=n:${Number(item.count || 0)}/p50:${Math.round(Number(item.p50 || 0))}/p95:${Math.round(Number(item.p95 || 0))}/max:${Math.round(Number(item.max || 0))}ms`;
                });
              if (requestRendered.length) {
                transportTimingLine = 'OpenCode request timings: ' + requestRendered.join('; ') + '.';
              }
              const tokenUsage = metrics.opencode_token_usage_by_agent || {};
              const tokenRendered = Object.keys(tokenUsage)
                .sort()
                .map(name => {
                  const item = tokenUsage[name] || {};
                  return `${name}=requests:${Number(item.requests || 0)}/in:${Number(item.input_total || 0)}/out:${Number(item.output_total || 0)}/reasoning:${Number(item.reasoning_total || 0)}`;
                });
              if (tokenRendered.length) {
                tokenUsageLine = 'Model token usage: ' + tokenRendered.join('; ') + '.';
              }
              const served = metrics.served_models_by_agent || {};
              const servedEntries = Object.keys(served)
                .sort()
                .map(name => `${name}=${(served[name] || []).join(',')}`);
              if (servedEntries.length) {
                modelPathLine = 'Served models: ' + servedEntries.join('; ') +
                  `; clarifications=${Number(metrics.clarification_count || 0)}.`;
              }
            } catch (error) {
              core.info('No per-stage live timing evidence yet: ' + error.message);
            }
            if (transientBlocked && category === 'unknown-gate-failure') {
              core.notice('External/transient block has no independent product FAIL; recovery will retry qualification.');
              return;
            }
            const marker = '<!-- aa-self-proving-repair:v1 -->';
            // Stable defect identity deliberately excludes main SHA. When
            // several product gates fail in one trusted run, keep one combined
            // repair series so C/E can converge in the same implementation
            // cycle rather than serializing known defects across runs.
            const stableFailures = productFailures.length
              ? productFailures
                  .map(g => `${g.gate}:${g.failure_category || g.status}:${g.component || 'unknown'}`)
                  .sort()
              : [`${blocking}:${category}:${component}`];
            const fingerprint = stableFailures.join('|');
            const gateLabel = productFailures.length > 1
              ? productFailures.map(g => g.gate).join('+')
              : blocking;
            const title = `P0: Repair self-proving qualification failure (Gate ${gateLabel})`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const existing = issues
              .filter(issue => !issue.pull_request && String(issue.body || '').includes(marker))
              .find(issue =>
                String(issue.body || '').includes(`Repair fingerprint: \`${fingerprint}\``)
              );
            let recurrence = 1;
            if (existing) {
              const match = String(existing.body || '').match(/Repair recurrence: \`(\d+)\`/);
              recurrence = match ? Number(match[1]) + 1 : 2;
            }
            const recurrenceFocus = recurrence > 1
              ? '- RECURRENCE: the previous repair for this same stable failure set did not converge. Do not repeat the same local symptom patch. Compare the new per-stage evidence with the prior failure, identify the dominant persistent cause, and change strategy at the responsible boundary.'
              : '- First occurrence for this stable product-failure fingerprint.';
            const body = [
              marker,
              '',
              '## Automatic self-proving repair',
              '',
              `Failure category: \`${category}\``,
              `Blocking gate: \`${blocking}\``,
              `Component: \`${component}\``,
              `All proven product failures: \`${stableFailures.join(', ')}\``,
              `Main SHA: \`${sha}\``,
              `Run id: \`${runId}\``,
              `Repair fingerprint: \`${fingerprint}\``,
              `Repair recurrence: \`${recurrence}\``,
              timingLine,
              stageTimingLine,
              verifierLine,
              transportTimingLine,
              tokenUsageLine,
              modelPathLine,
              '',
              '### Required repair behavior',
              '',
              repairFocus,
              recurrenceFocus,
              '- Fix without exact-question special cases; Product Contract #110 stays immutable.',
              '- Rerun the failed gate first, then downstream gates, then the exact-main final gate.',
              '- Repeat boundedly until PASS; no owner comments, manual labels, or manual merge required.',
              '- Provider 429: retire/restart the runner and resume from the last completed gate checkpoint.',
              '',
              'This issue is generated and refreshed automatically; the same stable failure series reopens this issue instead of creating another one.',
            ].join('\n');
            if (existing) {
              await apiRetry('refresh self-proving repair issue', () =>
                github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                  title,
                  body,
                  labels: ['priority:p0', 'automation:ready'],
                })
              );
              core.warning(
                `Reopened self-proving repair issue #${existing.number}; recurrence=${recurrence} fingerprint=${fingerprint}.`
              );
            } else {
              const created = await apiRetry('create self-proving repair issue', () =>
                github.rest.issues.create({
                  owner, repo, title, body, labels: ['priority:p0', 'automation:ready'],
                })
              );
              core.info(
                `Created self-proving repair issue #${created.data.number}; fingerprint=${fingerprint}.`
              );
            }
            // Convergence repair (kodmial/aa#192): explicitly wake the issue
            // scheduler once via workflow_dispatch. Events emitted by
            // GITHUB_TOKEN (issue create/update above) do not reliably trigger
            // downstream workflows, and scheduled cron alone left a P0 repair
            // issue undispatched for roughly an hour. This is the supported
            // recursion-safe wake-up; never use a PAT merely to manufacture
            // event fan-out.
            await apiRetry('wake issue scheduler', () =>
              github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
              })
            );
            core.info('Dispatched continuum-issue-scheduler.yml once for the P0 repair issue.');

      - name: Publish authoritative Product Contract result
        if: ${{ always() && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        uses: actions/github-script@v7
        env:
          QUAL_SHA: ${{ steps.sha.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            // AA owns qualification in this repository because only this
            // workflow has the real Telegram/book/model assets required by
            // Product Contract #110. Generic OpenCode qualification must not
            // manufacture failures from a no-secret/minimal runner.
            const fs = require('fs');
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(
                    `${label} failed on attempt ${attempt}: ${error.message}; retrying in ${delayMs}ms.`
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            const path = 'self-proving-out/self-proving-summary.json';
            if (!fs.existsSync(path)) {
              core.warning('No self-proving summary; no authoritative #7 result is published.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const sha = String(summary.sha || process.env.QUAL_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Authoritative qualification summary has no valid exact SHA.');
              return;
            }

            const { data: main } = await apiRetry('resolve current main', () =>
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              })
            );
            const currentMain = String(main.commit.sha || '').toLowerCase();
            if (sha !== currentMain) {
              core.notice(
                `Qualification result is stale at publish time (tested=${sha}, current=${currentMain}); lifecycle unchanged.`
              );
              return;
            }

            const status = String(summary.status || '').toUpperCase();
            const result = status === 'PASS' ? 'pass' : 'fail';
            const marker =
              `<!-- continuum-qualification-result issue=7 sha=${sha} result=${result} -->`;
            const gates = Array.isArray(summary.gates)
              ? summary.gates.map(g => `${g.gate}:${g.status}`).join(' ')
              : '';
            const blocking = String(summary.blocking_gate || 'none');
            const body = [
              marker,
              '',
              '## AA self-proving Product Contract qualification',
              '',
              `Exact current main: \`${sha}\``,
              `Workflow run: \`${context.runId}\``,
              `Verdict: **${result.toUpperCase()}**`,
              `Gates: ${gates || 'unavailable'}`,
              `Blocking gate: ${blocking}`,
              '',
              'Evidence was produced by the repository-owned qualification workflow with the configured Telegram token, encrypted canonical book identity, real OpenCode/provider path, production retrieval index and voice assets. Generic no-secret qualification workers are not authoritative for AA.',
            ].join('\n');

            const comments = await apiRetry('list qualification comments', () =>
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 7,
                per_page: 100,
              })
            );
            if (!comments.some(c => String(c.body || '').includes(marker))) {
              await apiRetry('publish qualification result comment', () =>
                github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  body,
                })
              );
            }

            if (result === 'pass') {
              await apiRetry('close qualification tracker', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  state: 'closed',
                  state_reason: 'completed',
                  labels: [],
                })
              );
              await apiRetry('publish capability completion comment', () =>
                github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  body: [
                    '⚡ **AA self-proving qualification**',
                    '<!-- continuum-origin role=project component=aa-self-proving-qualification -->',
                    `Product Contract qualified on exact current main \`${sha}\`; capability #6 is complete.`,
                  ].join('\n'),
                })
              );
              await apiRetry('close capability issue', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  state: 'closed',
                  state_reason: 'completed',
                  labels: ['priority:p1'],
                })
              );

              const openIssues = await apiRetry('list open repair issues', () =>
                github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                })
              );
              for (const issue of openIssues) {
                if (
                  !issue.pull_request &&
                  String(issue.body || '').includes('<!-- aa-self-proving-repair:v1 -->')
                ) {
                  await apiRetry('close completed repair issue', () =>
                    github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      state: 'closed',
                      state_reason: 'completed',
                    })
                  );
                }
              }
              core.notice(`Product Contract PASS accepted for exact main ${sha}; #7 and #6 completed.`);
            } else {
              await apiRetry('mark qualification tracker unqualified', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  state: 'open',
                  labels: ['automation:in-progress'],
                })
              );
              await apiRetry('mark capability blocked', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  state: 'open',
                  labels: ['priority:p1', 'automation:qualifying', 'automation:blocked'],
                })
              );
              core.warning(
                `Product Contract remains unqualified at exact main ${sha}; self-proving repair loop continues from Gate ${blocking}.`
              );
            }

      - name: Handle provider 429 runner retire
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f self-proving-out/restart-required.json ]]; then
            echo "::error::OpenCode 429: retire this runner and resume from the last completed gate checkpoint."
            exit 75
          fi
