name: AA self-proving qualification

# Authoritative layered qualification DAG for issue #146 (Gates A-F).
# Repository-owned workflow with required repository secrets/assets (never a
# generic coding-agent runner that lacks them). Owner /run for manual testing
# stays available regardless of qualification state; qualification controls
# only the QUALIFIED/UNQUALIFIED label. INCOMPLETE, missing secret/model,
# stale SHA, mocked-only evidence, or unknown state all mean FAIL/BLOCKED
# for qualification, never a restriction on owner-initiated manual testing.
#
# Gate order with checkpoint resume:
#   A static/build -> B deterministic integration -> C live production path
#   -> E performance/SLO -> F exact-main verdict. External Telegram excluded.
# On failure the failed gate reruns first, then downstream gates, then the
# final exact-main gate, bounded by MAX_REPAIR_CYCLES. Provider 429
# (OPENCODE_429_RESTART_REQUIRED) retires
# the runner and resumes from the last completed gate checkpoint. HTTP 403
# uses bounded exponential retry (>= 5s base). Infrastructure failure is
# never misreported as product PASS.

on:
  push:
    branches:
      - main
    paths:
      - "src/aa/**"
      - "prompts/**"
      - "opencode.json"
      - "corpus/**"
      - "qualification/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/aa-*.yml"
  workflow_dispatch:
    inputs:
      required_sha:
        description: "Exact current main SHA to qualify (defaults to current main)"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  # The push runner and the mandatory lifecycle dispatcher can both target
  # the SAME main SHA. Never preempt a healthy run while installing assets:
  # cancellation produced a forged 'missing A evidence' verdict. Serialize
  # by exact SHA, and let the explicit main-identity check reject stale runs.
  group: aa-self-proving-qualification-${{ inputs.required_sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    # AA qualification only (kodmial/aa#412): the effective Actions cap is at
    # least the owner-required 135 minutes. A repository variable may raise it
    # for exceptional runs but can never lower it below the campaign allowance.
    timeout-minutes: ${{ fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') > 135 && fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') || 135 }}
    env:
      AA_QUALIFICATION_JOB_TIMEOUT_MINUTES: "${{ fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') > 135 && fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') || 135 }}"
      AA_QUALIFICATION_CAMPAIGN_S: "8100"
      AA_QUALIFICATION_FINALISATION_RESERVE_S: "900"
    outputs:
      gate_a_outcome: ${{ steps.gate-a.outcome }}
      gate_b_outcome: ${{ steps.gate-b.outcome }}
      verified_model: ${{ steps.bot_model.outputs.primary }}
      verified_fallback: ${{ steps.bot_model.outputs.fallback }}
    steps:
      - name: Record qualification job start
        # The outer live watchdog uses these paired wall-clock and monotonic
        # markers to reserve time for Gate E/F, artifact upload and repair
        # publication before the configured job timeout (kodmial/aa#411). The
        # monotonic value is host-wide, so a later step can compare against it
        # without being affected by a system clock jump.
        shell: bash
        run: |
          echo "AA_QUALIFICATION_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "AA_QUALIFICATION_JOB_STARTED_MONOTONIC=$(python3 -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"

      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.required_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact current main identity and clean tree
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Refusing qualification on a dirty tree."
            exit 2
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked_sha" != "$current_main" ]]; then
            echo "::error::Refusing stale qualification: checked=$checked_sha current-main=$current_main"
            mkdir -p self-proving-out
            printf '{"reason_code":"STALE_MAIN","checked_sha":"%s","current_main":"%s"}\n' \
              "$checked_sha" "$current_main" > self-proving-out/stale-main.json
            exit 3
          fi
          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"
          echo "exact current main: $checked_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install AA pinned OpenCode via verified Continuum toolchain
        uses: ./.github/actions/aa-opencode-toolchain
        with:
          opencode-version: ${{ vars.CONTINUUM_OPENCODE_VERSION }}

      - name: Resolve AA-owned conversation models
        id: bot_model
        env:
          AA_BOT_PRIMARY_MODEL: ${{ vars.AA_BOT_PRIMARY_MODEL }}
          AA_BOT_FALLBACK_MODEL: ${{ vars.AA_BOT_FALLBACK_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          python -m aa.bot_models --github-output "$GITHUB_OUTPUT"

      - name: Export AA conversation model policy
        env:
          PRIMARY_MODEL: ${{ steps.bot_model.outputs.primary }}
          FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIMARY_MODEL" && test -n "$FALLBACK_MODEL"
          {
            printf 'AA_BOT_PRIMARY_MODEL=%s\nAA_BOT_FALLBACK_MODEL=%s\n' "$PRIMARY_MODEL" "$FALLBACK_MODEL"
            printf 'OPENCODE_MODEL=%s\nOPENCODE_FALLBACK_MODEL=%s\n' "$PRIMARY_MODEL" "$FALLBACK_MODEL"
          } >> "$GITHUB_ENV"

      - name: Install system voice media dependency
        shell: bash
        run: |
          set -euo pipefail
          # Gate C live voice end-to-end (GigaAM ASR decode + Silero TTS
          # OGG/Opus encode) shells out to system ffmpeg. Ubuntu runners do
          # not preinstall it, so every Gate C run failed
          # live-voice-fixture-synthesis-encode-failed with no voice
          # end-to-end evidence. Install once so all gates share it.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Restore gate checkpoints from previous attempt
        # RUNNER_TEMP is ephemeral per runner, so a 429 runner retire would
        # otherwise lose completed-gate checkpoints. Persist them as a
        # run-scoped artifact and restore them here so the next runner
        # resumes from the last completed gate instead of rerunning Gate A.
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-self-proving-checkpoints
          path: /tmp/aa-self-proving-checkpoints-restore
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage restored gate checkpoints
        if: ${{ github.run_attempt > 1 }}
        shell: bash
        run: |
          set -euo pipefail
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          RESTORE_DIR="/tmp/aa-self-proving-checkpoints-restore"
          mkdir -p "$CKPT_DIR"
          # Typed checkpoints only (kodmial/aa#342): a bare gate-X.done file
          # carries no SHA/run/fingerprint binding and never authorizes a
          # skip. Only schema-validated checkpoint JSONs are staged; the
          # per-gate --check-skip validation below enforces the binding.
          if compgen -G "$RESTORE_DIR/gate-*.checkpoint.json" > /dev/null; then
            cp "$RESTORE_DIR"/gate-*.checkpoint.json "$CKPT_DIR"/
            echo "restored typed gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          elif compgen -G "$RESTORE_DIR/**/gate-*.checkpoint.json" > /dev/null; then
            find "$RESTORE_DIR" -name 'gate-*.checkpoint.json' -exec cp {} "$CKPT_DIR"/ \;
            echo "restored nested typed gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          else
            echo "no previous typed gate checkpoints found"
          fi
          if [[ -d "$RESTORE_DIR/live-out" ]]; then
            rm -rf live-out
            cp -R "$RESTORE_DIR/live-out" live-out
            echo "restored Gate C privacy-safe live evidence"
          fi
          # Unified Gate A/B evidence (issue #339): restore already-published
          # validated artifacts so a resumed runner reuses the single
          # authoritative verdict instead of re-executing the gate.
          if compgen -G "$RESTORE_DIR/gate-[A-E]-evidence.json" > /dev/null; then
            mkdir -p self-proving-out
            cp "$RESTORE_DIR"/gate-[A-E]-evidence.json self-proving-out/
            echo "restored validated Gate evidence artifacts"
          fi

      - name: Gate A - static/build
        id: gate-a
        shell: bash
        env:
          OPENCODE_MODEL: ${{ steps.bot_model.outputs.primary }}
          OPENCODE_FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
        run: |
          set -euo pipefail
          # Checkpoint resume (kodmial/aa#342): skip only when a validated
          # typed checkpoint plus its matching evidence artifact bind this
          # exact SHA/run. A bare gate-X.done file never authorizes a skip.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --check-skip A; then
            echo "Gate A validated checkpoint present; skipping (resume)."
            exit 0
          fi
          # Exact SHA + clean tree verified above; canonical restore
          # metadata/fingerprints, unit/type/lint, and prompt/config/model/
          # retrieval fingerprint consistency run here fail-closed.
          # Unified Gate A evidence (issue #339): the shell checks below run
          # exactly once; their outcome plus the python trust-boundary checks
          # publish ONE authoritative gate-A-evidence.json artifact plus its
          # typed checkpoint. Gate F consumes that artifact read-only and
          # never re-executes Gate A.
          # Per-check attribution (issue #360): preserve independent
          # shell check verdicts, their exact SHA/run identity and components.
          gate_a_shell=pass
          python scripts/run_gate_a_shell.py \
            --profile gate-a \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --run-id "${{ github.run_id }}" \
            --out self-proving-out/gate-a-shell-results.json || gate_a_shell=fail
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" \
            --emit-gate A --shell-a-status "$gate_a_shell" \
            --shell-a-detail "workflow-gate-a-shell-$gate_a_shell" \
            --shell-a-results self-proving-out/gate-a-shell-results.json

      - name: Gate B - deterministic component integration
        id: gate-b
        shell: bash
        env:
          AA_ALLOW_NETWORK_FETCH: "0"
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          # Checkpoint resume (kodmial/aa#342): validated typed checkpoint
          # only; a bare gate-X.done file never authorizes a skip.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --check-skip B; then
            echo "Gate B validated checkpoint present; skipping (resume)."
            exit 0
          fi
          # Real RU corpus restore + real BM25/E5/FAISS index bootstrap, then
          # planner cardinality/shape, retrieval/RRF/dedup/diversity/
          # small-to-big, grounding/verifier and output envelope, memory/FIFO/
          # concurrency/safety, voice fixtures/cache/resource checks. Failures
          # attribute to a concrete component, never a generic PASS.
          # Unified Gate B evidence (issue #339): the shell bootstrap/tests
          # below run exactly once; their outcome plus the python component
          # checks publish ONE authoritative gate-B-evidence.json artifact
          # (B FAIL on shell failure, BLOCKED on missing assets). Gate F
          # consumes that artifact read-only and never re-executes Gate B.
          gate_b_shell=pass
          python scripts/restore_canonical.py --no-network-fallback || gate_b_shell=fail
          python scripts/restore_canonical.py --lang ru --no-network-fallback || gate_b_shell=fail
          python scripts/build_corpus_structure.py || gate_b_shell=fail
          # Gate B must exercise the production dense substrate, never the
          # hermetic hashing fallback. Public model prefetch is allowed here;
          # a missing/unloadable pinned model is a qualification failure.
          python scripts/prefetch_public_assets.py || gate_b_shell=fail
          # Voice is part of the Product Contract too. Qualification must
          # provision and verify the pinned GigaAM/Silero/presentation assets
          # rather than leaving the voice lane permanently INCOMPLETE.
          python scripts/prefetch_voice_assets.py || gate_b_shell=fail
          python scripts/build_retrieval_index.py --backend e5 || gate_b_shell=fail
          python -m pytest -q tests/test_p0_3_v2_retrieval.py tests/test_hybrid_retrieval.py \
            tests/test_aa_retrieval_qualification.py tests/test_conversation_runtime.py \
            tests/test_output_envelope.py tests/test_sessions_safety_control.py \
            tests/test_telegram_concurrency.py tests/test_idempotent_dispatch.py || gate_b_shell=fail
          # B owns deterministic Product Contract 1-41 plus voice 1-16.
          python scripts/run_product_contract_live_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir deterministic-out --run-id "${{ github.run_id }}" \
            --deterministic-only || gate_b_shell=fail
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" \
            --emit-gate B --shell-b-status "$gate_b_shell" \
            --shell-b-detail "workflow-gate-b-shell-$gate_b_shell"


      - name: Save exact-SHA A/B evidence for live qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-preflight-evidence
          path: |
            self-proving-out/gate-A-evidence.json
            self-proving-out/gate-B-evidence.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Upload deterministic Product Contract scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-preflight-deterministic
          path: |
            deterministic-out/result.json
            deterministic-out/product-contract-live-summary.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

  qualify-live:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    # The complete live Gate C -> E -> F qualification may legitimately run
    # for at least 135 minutes. A 45/60/120-minute Actions hard cancel used to
    # destroy the terminal verdict (kodmial/aa#411/#412). The parent watchdog
    # leaves a real finalisation reserve for Gate E/F, artifacts and #7
    # publication. The repository variable may raise, never lower, the cap.
    timeout-minutes: ${{ fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') > 135 && fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') || 135 }}
    env:
      AA_QUALIFICATION_JOB_TIMEOUT_MINUTES: "${{ fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') > 135 && fromJSON(vars.AA_QUALIFICATION_JOB_TIMEOUT_MINUTES || '135') || 135 }}"
      AA_QUALIFICATION_CAMPAIGN_S: "8100"
      # Keep enough time after the outer live watchdog fires to run Gate E/F,
      # upload artifacts and publish an exact-SHA negative verdict.
      AA_QUALIFICATION_FINALISATION_RESERVE_S: "900"
    steps:
      - name: Record qualification job start
        # Write both clocks so the outer watchdog never depends on a stable
        # wall clock between job start and supervisor startup.
        shell: bash
        run: |
          echo "AA_QUALIFICATION_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "AA_QUALIFICATION_JOB_STARTED_MONOTONIC=$(python3 -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"

      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.required_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact current main identity and clean tree
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Refusing qualification on a dirty tree."
            exit 2
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked_sha" != "$current_main" ]]; then
            echo "::error::Refusing stale qualification: checked=$checked_sha current-main=$current_main"
            mkdir -p self-proving-out
            printf '{"reason_code":"STALE_MAIN","checked_sha":"%s","current_main":"%s"}\n' \
              "$checked_sha" "$current_main" > self-proving-out/stale-main.json
            exit 3
          fi
          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"
          echo "exact current main: $checked_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install AA pinned OpenCode via verified Continuum toolchain
        if: ${{ needs.qualify.result == 'success' }}
        uses: ./.github/actions/aa-opencode-toolchain
        with:
          opencode-version: ${{ vars.CONTINUUM_OPENCODE_VERSION }}

      - name: Restore exact AA conversation models from preflight
        id: bot_model
        if: ${{ needs.qualify.result == 'success' }}
        env:
          AA_BOT_PRIMARY_MODEL: ${{ needs.qualify.outputs.verified_model }}
          AA_BOT_FALLBACK_MODEL: ${{ needs.qualify.outputs.verified_fallback }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AA_BOT_PRIMARY_MODEL" && test -n "$AA_BOT_FALLBACK_MODEL"
          python -m aa.bot_models --github-output "$GITHUB_OUTPUT"

      - name: Export AA conversation model policy
        if: ${{ needs.qualify.result == 'success' }}
        env:
          PRIMARY_MODEL: ${{ steps.bot_model.outputs.primary }}
          FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIMARY_MODEL" && test -n "$FALLBACK_MODEL"
          {
            printf 'AA_BOT_PRIMARY_MODEL=%s\nAA_BOT_FALLBACK_MODEL=%s\n' "$PRIMARY_MODEL" "$FALLBACK_MODEL"
            printf 'OPENCODE_MODEL=%s\nOPENCODE_FALLBACK_MODEL=%s\n' "$PRIMARY_MODEL" "$FALLBACK_MODEL"
          } >> "$GITHUB_ENV"

      - name: Install system voice media dependency
        if: ${{ needs.qualify.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Gate C live voice end-to-end (GigaAM ASR decode + Silero TTS
          # OGG/Opus encode) shells out to system ffmpeg. Ubuntu runners do
          # not preinstall it, so every Gate C run failed
          # live-voice-fixture-synthesis-encode-failed with no voice
          # end-to-end evidence. Install once so all gates share it.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Restore gate checkpoints from previous attempt
        # RUNNER_TEMP is ephemeral per runner, so a 429 runner retire would
        # otherwise lose completed-gate checkpoints. Persist them as a
        # run-scoped artifact and restore them here so the next runner
        # resumes from the last completed gate instead of rerunning Gate A.
        if: ${{ needs.qualify.result == 'success' && github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-self-proving-checkpoints
          path: /tmp/aa-self-proving-checkpoints-restore
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage restored gate checkpoints
        if: ${{ needs.qualify.result == 'success' && github.run_attempt > 1 }}
        shell: bash
        run: |
          set -euo pipefail
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          RESTORE_DIR="/tmp/aa-self-proving-checkpoints-restore"
          mkdir -p "$CKPT_DIR"
          # Typed checkpoints only (kodmial/aa#342): a bare gate-X.done file
          # carries no SHA/run/fingerprint binding and never authorizes a
          # skip. Only schema-validated checkpoint JSONs are staged; the
          # per-gate --check-skip validation below enforces the binding.
          if compgen -G "$RESTORE_DIR/gate-*.checkpoint.json" > /dev/null; then
            cp "$RESTORE_DIR"/gate-*.checkpoint.json "$CKPT_DIR"/
            echo "restored typed gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          elif compgen -G "$RESTORE_DIR/**/gate-*.checkpoint.json" > /dev/null; then
            find "$RESTORE_DIR" -name 'gate-*.checkpoint.json' -exec cp {} "$CKPT_DIR"/ \;
            echo "restored nested typed gate checkpoints from previous attempt:"
            ls -la "$CKPT_DIR"
          else
            echo "no previous typed gate checkpoints found"
          fi
          if [[ -d "$RESTORE_DIR/live-out" ]]; then
            rm -rf live-out
            cp -R "$RESTORE_DIR/live-out" live-out
            echo "restored Gate C privacy-safe live evidence"
          fi
          # Unified Gate A/B evidence (issue #339): restore already-published
          # validated artifacts so a resumed runner reuses the single
          # authoritative verdict instead of re-executing the gate.
          if compgen -G "$RESTORE_DIR/gate-[A-E]-evidence.json" > /dev/null; then
            mkdir -p self-proving-out
            cp "$RESTORE_DIR"/gate-[A-E]-evidence.json self-proving-out/
            echo "restored validated Gate evidence artifacts"
          fi


      - name: Restore trusted exact-run A/B evidence (never recompute on live runner)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aa-preflight-evidence
          path: self-proving-out
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Bootstrap exact production book/index for Gate C only
        if: ${{ needs.qualify.result == 'success' }}
        shell: bash
        env:
          AA_ALLOW_NETWORK_FETCH: "0"
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          python scripts/restore_canonical.py --no-network-fallback
          python scripts/restore_canonical.py --lang ru --no-network-fallback
          python scripts/build_corpus_structure.py
          python scripts/prefetch_public_assets.py
          python scripts/prefetch_voice_assets.py
          python scripts/build_retrieval_index.py --backend e5
      - name: Gate C - LIVE exact production conversation path
        id: gate-c
        if: ${{ needs.qualify.result == 'success' }}
        shell: bash
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: ${{ steps.bot_model.outputs.primary }}
          OPENCODE_FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
          # Independent outer watchdog (kodmial/aa#411): progress markers are
          # persisted here so a preemptive timeout keeps completed scenario
          # diagnostics and Gate E latency samples.
          AA_QUALIFICATION_LIVE_PROGRESS_PATH: live-out/live-watchdog-progress.json
        run: |
          set -euo pipefail
          # Checkpoint resume (kodmial/aa#342): validated typed checkpoint
          # only; a bare gate-X.done file never authorizes a skip.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --check-skip C; then
            echo "Gate C validated checkpoint present; skipping (resume)."
            exit 0
          fi
          # Repository-owned live gate: real local OpenCode process and real
          # configured runtime provider/model policy, real decrypted RU corpus
          # + real production index, synthetic Telegram Updates injected only
          # at the production Telegram adapter boundary through the exact
          # Application -> dispatcher -> LangGraph -> planner -> retrieval ->
          # answer -> verifier -> delivery serialization path. Planner/answer/
          # verifier/provider/retrieval are never stubbed here. Scenario
          # families (meta/capability, substantive drinking,
          # family/relationship, follow-ups/ellipsis, topic shift,
          # unsupported/out-of-book, emergency, long conversation) with a
          # response-diversity assertion and privacy-safe per-stage
          # outcomes/latency only. Missing secret/model yields BLOCKED, never
          # mocked PASS.
          # The live runner may legitimately return INCOMPLETE for evidence
          # from live model/corpus execution. Always let the self-proving
          # mapper classify PASS/FAIL/BLOCKED from the produced evidence.
          # Provider 429 is different: retire this VM immediately and persist
          # the restart marker for the workflow_run recovery controller.
          set +e
          python scripts/run_product_contract_live_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir live-out --run-id "${{ github.run_id }}" --gate-c-only
          product_rc=$?
          set -e
          if [[ "$product_rc" -eq 75 ]]; then
            mkdir -p self-proving-out
            cp live-out/restart-required.json self-proving-out/restart-required.json
            echo "::error::Gate C provider 429: retire runner and resume on a fresh VM."
            exit 75
          fi
          # Gate C single owner (kodmial/aa#342): the live runner above
          # executes the real provider/model path exactly once; the emit
          # below only reduces its already-produced live-out artifact into
          # the ONE authoritative gate-C-evidence.json plus typed
          # checkpoint. No second provider run, no index rebuild here.
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --emit-gate C

      - name: Gate E - live performance/SLO
        # Gate E owns latency independently of Gate C functional correctness.
        # Evaluate the trusted Gate C measurements even when C itself fails so
        # the repair loop can attack C and E in the same cycle.
        # Single owner (kodmial/aa#342): consumes the validated Gate C
        # evidence plus the live-out C-series exactly once. No Gate C rerun,
        # no A/B bootstrap, no provider calls, no D network operations here
        # (no secrets are even configured on this step by construction).
        if: ${{ always() && (steps.gate-c.outcome == 'success' || steps.gate-c.outcome == 'failure') && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Checkpoint resume (kodmial/aa#342): validated typed checkpoint
          # only; a bare gate-X.done file never authorizes a skip.
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          if python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --check-skip E; then
            echo "Gate E validated checkpoint present; skipping (resume)."
            exit 0
          fi
          if [[ -f self-proving-out/restart-required.json ]]; then
            echo "::error::Gate E interrupted by provider 429; runner restart required."
            exit 75
          fi
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --checkpoint-dir "$CKPT_DIR" --emit-gate E
          # Mode-aware SLO guard (machine-enforced through the shared time
          # policy): enforce mode applies the configured p95/max thresholds;
          # observe mode publishes timing without evaluating them. Gate C
          # grounding/safety remains mandatory. Failed/timeout ordinary turns
          # are counted as observed censored evidence by the single-owner
          # emit above and can never be dropped here. Evidence/reliability
          # failures stay closed in both modes.
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "src")
          from pathlib import Path
          from aa.qualification.gate_evidence import load_and_validate_evidence
          from aa.qualification.self_proving import SelfProvingError
          from aa.time_policy import (
              current_time_policy,
              evaluate_latency_thresholds,
          )
          import os
          sha = "${{ steps.sha.outputs.sha }}"
          run_id = "${{ github.run_id }}"
          path = Path("self-proving-out/gate-E-evidence.json")
          if not path.is_file():
              print("Gate E BLOCKED: no Gate E evidence artifact", file=sys.stderr)
              sys.exit(2)
          try:
              evidence = load_and_validate_evidence(
                  path, expected_gate="E", expected_sha=sha, expected_run_id=run_id
              )
          except SelfProvingError as exc:
              print(f"Gate E BLOCKED: evidence invalid: {exc}", file=sys.stderr)
              sys.exit(2)
          status = str(evidence.get("status", "")).upper()
          # Explicit sample/provenance line from the live-out C-series plus
          # the validated evidence checksum (privacy-safe aggregates only).
          live_path = Path("live-out/product-contract-live-summary.json")
          samples = []
          provider_id = ""
          boundary = "production-update-intake-to-simulated-handoff"
          proof_kind = "c-series-simulated-handoff"
          if live_path.is_file():
              try:
                  live = json.loads(live_path.read_text(encoding="utf-8"))
                  for lane in live.get("lanes", []):
                      if isinstance(lane, dict) and lane.get("lane") == "live-telegram-evidence":
                          metrics = lane.get("metrics", {}) or {}
                          raw = metrics.get("turn_latency_samples", []) or []
                          samples = raw if isinstance(raw, list) else []
                          provider_id = str(metrics.get("latency_provider_id", "") or "")
                          boundary = str(metrics.get("latency_boundary", "") or boundary)
                          proof_kind = str(metrics.get("latency_source_proof_kind", "") or proof_kind)
              except Exception:
                  samples = []
          try:
              p50 = float(evidence.get("latency_p50_ms", 0.0))
              p95 = float(evidence.get("latency_p95_ms", 0.0))
              max_turn = float(evidence.get("max_turn_ms", 0.0))
          except (TypeError, ValueError):
              print("Gate E BLOCKED: latency evidence is not numeric", file=sys.stderr)
              sys.exit(2)
          print(
              "Gate E evidence: "
              f"status={status} samples={len(samples)} "
              f"p50={p50:.0f}ms p95={p95:.0f}ms max={max_turn:.0f}ms "
              f"units=ms boundary={boundary} provider={provider_id[:32]} "
              f"proof={proof_kind} sha={sha[:12]} run={run_id} "
              f"checksum={evidence.get('evidence_checksum', '')[:16]}"
          )
          if status == "BLOCKED" or status == "STALE":
              print(f"Gate E BLOCKED: status={status}", file=sys.stderr)
              sys.exit(2)
          if status != "PASS":
              print(f"Gate E FAIL: status={status}", file=sys.stderr)
              sys.exit(1)
          # Sample-count guard: zero/negative latencies mean no live samples.
          if p50 <= 0 or p95 <= 0 or max_turn <= 0:
              print(
                  f"Gate E BLOCKED: no live latency samples (p50={p50} p95={p95} max={max_turn})",
                  file=sys.stderr,
              )
              sys.exit(2)
          # Mode-aware Gate E timing (single shared policy/helper):
          # observe publishes timing without a p95/max failure; enforce
          # applies the configured thresholds. Reliability/evidence
          # integrity failures above still fail closed in both modes.
          policy = current_time_policy()
          ok, timing_detail = evaluate_latency_thresholds(p95, max_turn, policy=policy)
          if not ok:
              print(f"Gate E FAIL: {timing_detail}", file=sys.stderr)
              sys.exit(1)
          print(
              f"Gate E PASS ({policy.latency_gate_mode}): "
              f"p50={p50:.0f}ms p95={p95:.0f}ms max={max_turn:.0f}ms; {timing_detail}"
          )
          PY

      - name: Gate F - exact-main final verdict
        id: gate-f
        # Always emit the machine-readable final verdict so a failed Gate C/E
        # never degrades to unknown-gate-failure: the repair publisher maps the
        # concrete blocking gate/component from self-proving-summary.json.
        # Live env is preserved here (issue #153) so Gate F re-evaluation
        # cannot replace a real Gate C live-path-failed with
        # live-execution-not-enabled; the runner additionally prefers the
        # persisted live-out artifact regardless of env.
        # An interrupted/failed dependency-install step is infrastructure
        # failure, not a product Gate A/B failure. Do not synthesize gate
        # evidence before Gate A had a chance to run.
        if: ${{ always() && (needs.qualify.outputs.gate_a_outcome == 'success' || needs.qualify.outputs.gate_a_outcome == 'failure') }}
        shell: bash
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          SELF_PROVING_LIVE: "1"
          OPENCODE_MODEL: ${{ steps.bot_model.outputs.primary }}
          OPENCODE_FALLBACK_MODEL: ${{ steps.bot_model.outputs.fallback }}
        run: |
          set -euo pipefail
          # Checkpoint resume: Gate F is terminal; re-verify unconditionally
          # so a stale final verdict can never be reused after resume.
          # Gate F is a pure deterministic reducer (issue #339): it consumes
          # only the already-produced, validated gate evidence artifacts
          # (Gate A/B published exactly once by their shell steps; C/E
          # published by the runner) with matching SHA/run/digests. It
          # performs no corpus restore, provider calls, index builds, or
          # component re-evaluation. No stale reuse, no manual
          # override. INCOMPLETE/missing/stale/mocked-only = FAIL/BLOCKED.
          python scripts/run_self_proving_qualification.py \
            --main-sha "${{ steps.sha.outputs.sha }}" \
            --out-dir self-proving-out --run-id "${{ github.run_id }}" \
            --final-only

      - name: Upload per-gate evidence and failure matrix
        # Privacy-safe full per-gate evidence (issue #339): atomic validated
        # A/B/C/E artifacts plus the typed failure matrix for the final verdict.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-evidence-${{ github.run_attempt }}
          path: |
            self-proving-out/gate-A-evidence.json
            self-proving-out/gate-B-evidence.json
            self-proving-out/gate-C-evidence.json
                        self-proving-out/gate-E-evidence.json
                        self-proving-out/failure-matrix.json
            self-proving-out/self-proving-summary.json
            self-proving-out/result.json
            live-out/live-watchdog-progress.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Stage gate checkpoints for resume
        # Mirror ephemeral RUNNER_TEMP checkpoints into the workspace so the
        # artifact upload below captures completed gates even when this run
        # fails (including provider 429 runner retire).
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CKPT_DIR="${RUNNER_TEMP:-/tmp}/aa-self-proving-checkpoints"
          STAGE_DIR="aa-self-proving-checkpoints"
          mkdir -p "$STAGE_DIR"
          # Typed checkpoints only (kodmial/aa#342): bare gate-X.done files
          # are never staged or trusted for resume.
          if compgen -G "$CKPT_DIR/gate-*.checkpoint.json" > /dev/null; then
            cp "$CKPT_DIR"/gate-*.checkpoint.json "$STAGE_DIR"/
          fi
          if [[ -f live-out/product-contract-live-summary.json ]]; then
            mkdir -p "$STAGE_DIR/live-out"
            cp live-out/product-contract-live-summary.json "$STAGE_DIR/live-out/"
            [[ ! -f live-out/result.json ]] || cp live-out/result.json "$STAGE_DIR/live-out/"
          fi
          # Unified Gate evidence (issue #339): persist validated A-E
          # artifacts across 429 runner retire so resume reuses them.
          if compgen -G "self-proving-out/gate-[A-E]-evidence.json" > /dev/null; then
            cp self-proving-out/gate-[A-E]-evidence.json "$STAGE_DIR"/
          fi
          echo "staged privacy-safe gate checkpoints/evidence for resume:"
          find "$STAGE_DIR" -maxdepth 2 -type f -print || true

      - name: Upload gate checkpoints (429 resume)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-checkpoints
          path: aa-self-proving-checkpoints/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - name: Upload provider 429 restart marker
        if: ${{ failure() && hashFiles('self-proving-out/restart-required.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-restart-${{ github.run_attempt }}
          path: self-proving-out/restart-required.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload stale-main recovery marker
        if: ${{ failure() && hashFiles('self-proving-out/stale-main.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-stale-${{ github.run_attempt }}
          path: self-proving-out/stale-main.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Upload external/transient blocker marker
        if: ${{ failure() && hashFiles('self-proving-out/transient-blocked.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aa-self-proving-transient-${{ github.run_attempt }}
          path: self-proving-out/transient-blocked.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Publish machine-readable failure and repair marker
        # Provider 429 and external/transient blockers are recovery states,
        # not product-code repair issues.
        # A workflow_run recovery controller reruns failed jobs on a fresh VM
        # from the persisted gate checkpoints.
        # Missing setup/checkout proof is an infrastructure failure, not an
        # implementation defect. Never open code-repair tasks for it.
        if: ${{ failure() && (needs.qualify.outputs.gate_a_outcome == 'success' || needs.qualify.outputs.gate_a_outcome == 'failure') && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        uses: actions/github-script@v7
        env:
          FAILED_SHA: ${{ steps.sha.outputs.sha }}
          GATE_A_OUTCOME: ${{ needs.qualify.outputs.gate_a_outcome }}
          GATE_B_OUTCOME: ${{ needs.qualify.outputs.gate_b_outcome }}
          GATE_C_OUTCOME: ${{ steps.gate-c.outcome }}
          GATE_E_OUTCOME: ${{ steps.gate-e.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Automatic repair loop (issue #146): post the machine-readable
            // failure category + run/SHA + privacy-safe timings, then create
            // or reuse exactly one P0 repair issue scoped to the failing
            // component(s). The Continuum scheduler takes it automatically;
            // PR -> review/repair -> merge reruns the failed gate first, then
            // downstream gates, then the final exact-main gate, boundedly
            // until PASS. Provider 429 retires/restarts the runner and resumes
            // from the last completed qualification gate checkpoint. HTTP 403
            // uses bounded exponential retry >= 5s. Infrastructure failure is
            // never misreported as product PASS.
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.FAILED_SHA || context.sha;
            const runId = String(context.runId);
            const transientBlocked = fs.existsSync('self-proving-out/transient-blocked.json');
            // A historical runner can finish after main advances. Its proof
            // is STALE, not authority to mutate current production code.
            // Skip old-SHA repair creation even if all original gates failed.
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.warning('Missing exact checked SHA: refuse any repair mutation.');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (String(branch.commit.sha || '').toLowerCase() !== sha.toLowerCase()) {
              core.notice(`Qualification run ${runId} is stale (${sha.slice(0, 12)}); no repair issue is created.`);
              return;
            }

            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(
                    `${label} failed on attempt ${attempt}: ${error.message}; retrying in ${delayMs}ms.`
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            // Continuum snapshots the title/body for an OpenCode generation.
            // Qualification observations must not rewrite that pinned spec.
            async function issueHistory(issueNumber) {
              return apiRetry('read repair issue history', () =>
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: issueNumber, per_page: 100,
                })
              );
            }
            function trustObservationComment(comment) {
              return comment.user?.login === 'github-actions[bot]';
            }
            function issueLabelNames(issue) {
              return (issue.labels || [])
                .map(label => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
            }
            async function redispatchExistingIssue(issue, kind) {
              const labels = issueLabelNames(issue);
              const inProgress = issue.state === 'open' && labels.includes('automation:in-progress');
              if (inProgress) {
                core.notice('Existing ' + kind + ' generation is still in progress; observation recorded only.');
                return;
              }
              const nextLabels = labels.filter(name =>
                name !== 'automation:blocked' &&
                name !== 'automation:qualifying' &&
                name !== 'automation:in-progress'
              );
              if (!nextLabels.includes('automation:ready')) nextLabels.push('automation:ready');
              await apiRetry('reopen and relabel existing ' + kind + ' issue', () =>
                github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'open',
                  labels: nextLabels,
                })
              );
              await apiRetry('wake issue scheduler for existing ' + kind + ' issue', () =>
                github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
                })
              );
              core.warning('Recorded ' + kind + ' recurrence on #' + issue.number +
                '; reopened with automation:ready without rewriting the pinned specification.');
            }
            function observationMarker(kind) {
              return '<!-- aa-self-proving-' + kind +
                '-observation:v1 run=' + runId + ' sha=' + sha + ' -->';
            }
            // A run's marker can live in the issue body (recorded when the
            // issue is first created) or in a trusted observation comment
            // (recorded on recurrence). Either form means this exact
            // runId/SHA has already been processed, so a workflow re-run of
            // the creating run is never misclassified as a new recurrence.
            function bodyRecordsRun(issue, kind) {
              return String((issue && issue.body) || '').includes(observationMarker(kind));
            }
            async function commentsRecordRun(issue, kind) {
              const comments = await issueHistory(issue.number);
              return comments.some(comment =>
                trustObservationComment(comment) &&
                String(comment.body || '').includes(observationMarker(kind))
              );
            }
            async function runAlreadyRecorded(issue, kind) {
              return bodyRecordsRun(issue, kind) || await commentsRecordRun(issue, kind);
            }
            async function nextObservationRecurrence(issue, kind, legacy) {
              if (!issue) return 1;
              const comments = await issueHistory(issue.number);
              const prefix = '<!-- aa-self-proving-' + kind + '-observation:v1 run=';
              const values = comments
                .filter(trustObservationComment)
                .map(comment => String(comment.body || ''))
                .filter(body => body.includes(prefix))
                .map(body => Number(body.match(/(?:Repair|Systemic|Diagnostic) recurrence: \`(\d+)\`/)?.[1] || 0));
              const recordedForCurrentRun = bodyRecordsRun(issue, kind) ||
                comments
                  .filter(trustObservationComment)
                  .some(comment => String(comment.body || '').includes(observationMarker(kind)));
              return recordedForCurrentRun
                ? Math.max(legacy, ...values)
                : Math.max(legacy, ...values) + 1;
            }
            async function postObservation(issue, kind, lines) {
              if (await runAlreadyRecorded(issue, kind)) {
                core.notice('Already recorded ' + kind + ' observation for run ' + runId);
                return false;
              }
              await apiRetry('append immutable repair observation', () =>
                github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: [observationMarker(kind), ...lines].join('\n'),
                })
              );
              return true;
            }
            // kodmial/aa#417 P0 diagnostic infrastructure issues: a typed
            // stalled-turn timeout is never a product-semantic verdict, so
            // it must not spawn code-mutation searches. Exactly ONE
            // idempotent diagnostic issue exists per diagnostic class
            // (fingerprint excludes the main SHA); it starts
            // automation:blocked and only auto-escalates to
            // automation:ready after the same class is observed on a
            // distinct main SHA. Bodies carry fixed-vocabulary evidence
            // only: never prompts, message bodies, user text, or secrets.
            async function ensureDiagnosticIssues(admission) {
              const entries = Array.isArray(admission && admission.diagnostics)
                ? admission.diagnostics
                : [];
              const classes = [];
              for (const entry of entries) {
                const diagnosticClass = String((entry && entry.diagnostic_class) || '').trim();
                if (diagnosticClass && !classes.includes(diagnosticClass)) {
                  classes.push(diagnosticClass);
                }
              }
              if (!classes.length) return;
              for (const diagnosticClass of classes) {
                const marker = '<!-- aa-self-proving-diagnostic-infrastructure:v1 -->';
                const fingerprint = diagnosticClass;
                const failure = productFailures[
                  Number(entries.find(item =>
                    item && item.diagnostic_class === diagnosticClass
                  )?.index ?? -1)
                ] || null;
                const gate = failure ? String(failure.gate || '') : '';
                const failureCategory = failure
                  ? String(failure.failure_category || '')
                  : diagnosticClass;
                const component = failure ? String(failure.component || '') : '';
                // Newest typed stall evidence from the live lane (counts and
                // closed vocabulary only).
                let stall = null;
                try {
                  const live = JSON.parse(
                    fs.readFileSync('live-out/product-contract-live-summary.json', 'utf8')
                  );
                  const lane = (live.lanes || []).find(
                    item => item && item.lane === 'live-telegram-evidence'
                  );
                  const laneDiagnostics = (((lane || {}).metrics) || {}).scenario_diagnostics;
                  const stallLike = (Array.isArray(laneDiagnostics) ? laneDiagnostics : [])
                    .filter(item =>
                      item &&
                      (item.delivery_timeout === true ||
                        String(item.timeout_reason || '').length > 0)
                    )
                    .filter(item =>
                      diagnosticClass === 'infrastructure-timeout'
                        ? item.timeout_category !== undefined
                        : true
                    );
                  if (stallLike.length) stall = stallLike[stallLike.length - 1];
                } catch (error) {
                  core.info('No live stall evidence for diagnostic issue: ' + error.message);
                }
                let existing = issues
                  .filter(issue => !issue.pull_request && String(issue.body || '').includes(marker))
                  .find(issue =>
                    String(issue.body || '').includes(`Diagnostic fingerprint: \`${fingerprint}\``)
                  );
                if (!existing) {
                  // First observation: create the SINGLE bounded diagnostic
                  // task, blocked so nothing dispatches code mutation.
                  const body = [
                    marker,
                    '## P0 diagnostic infrastructure (non-mutating)',
                    '',
                    `Diagnostic class: \`${diagnosticClass}\``,
                    `Diagnostic fingerprint: \`${fingerprint}\``,
                    gate ? `Gate: \`${gate}\`` : 'Gate: `unknown`',
                    `Latest failure category: \`${failureCategory}\``,
                    component ? `Component: \`${component}\`` : null,
                    `Main SHA: \`${sha}\``,
                    `Qualification run: \`${runId}\``,
                    'Diagnostic recurrence: `1`',
                    '',
                    '### Typed stall evidence',
                    '',
                    stall
                      ? [
                          `Last active stage: \`${String((stall.last_active_stage || 'unknown')).slice(0, 64)}\``,
                          `Timeout category: \`${String((stall.timeout_category || 'unknown')).slice(0, 32)}\``,
                          `Timeout reason: \`${String((stall.timeout_reason || 'unknown')).slice(0, 32)}\``,
                          `Request state: \`${String((stall.request_state || 'unconfirmed-in-flight')).slice(0, 48)}\``,
                          `Request progress: \`${String((stall.request_progress_observable || 'progress-unobservable')).slice(0, 48)}\``,
                          stallMeasurementLine('Stage elapsed ms', stall.stage_elapsed_ms),
                          stallMeasurementLine('Delivery latency ms', stall.delivery_latency_ms),
                          cleanupLine(stall),
                        ].filter(Boolean).join('\n')
                      : '- Typed stall evidence unavailable in the live lane summary.',
                    '',
                    '### Required diagnostic behavior',
                    '',
                    '- This is an infrastructure/harness diagnosis task: do NOT mutate product code to chase this failure.',
                    '- A stalled turn with `progress-unobservable` may reflect server-side streaming behavior that the pinned local request audit cannot observe; attribute honestly instead of inventing a cause.',
                    '- Repair must preserve the no-fixed-wall-clock bounds and the bounded recovery lifecycle introduced for this failure class.',
                    '- Include a generic regression test (real timing behavior), not a literal qualification prompt.',
                    '',
                    'This issue is generated and refreshed automatically; the same diagnostic class reopens this issue instead of creating another one.',
                  ].filter(Boolean).join('\n');
                  const created = await apiRetry('create P0 diagnostic infrastructure issue', () =>
                    github.rest.issues.create({
                      owner,
                      repo,
                      title: `P0 DIAGNOSTIC: ${diagnosticClass} (Gate ${gate || 'unknown'})`,
                      body,
                      labels: ['priority:p0', 'automation:blocked'],
                    })
                  );
                  core.warning(
                    `Created one P0 diagnostic infrastructure issue #${created.data.number}` +
                    ` for class ${diagnosticClass}; currently blocked, auto-escapes on recurrence.`
                  );
                } else {
                  const recorded = await runAlreadyRecorded(existing, 'diagnostic');
                  if (recorded) {
                    core.notice('Diagnostic observation already recorded for run ' + runId);
                    continue;
                  }
                  const legacyRecurrence = Number(
                    String(existing.body || '').match(/Diagnostic recurrence: \`(\d+)\`/)?.[1] || 1
                  );
                  const recurrence = await nextObservationRecurrence(existing, 'diagnostic', legacyRecurrence);
                  // Distinct-SHA escalation: same diagnostic class seen again
                  // on a different resolved main SHA means the infrastructure
                  // repair need is real, not a one-off.
                  const comments = await issueHistory(existing.number);
                  const recordedShas = new Set(
                    [String(existing.body || '')]
                      .concat(comments.filter(trustObservationComment).map(c => String(c.body || '')))
                      .map(body => body.match(/Main SHA: \`([0-9a-f]{40})\`/)?.[1])
                      .filter(Boolean)
                  );
                  recordedShas.add(sha);
                  const recurringDifferentSha = recordedShas.size >= 2;
                  const labels = (issueLabelNames(existing) || [])
                    .filter(name => name !== 'automation:ready')
                    .filter(name => !recurringDifferentSha || name !== 'automation:blocked');
                  if (recurringDifferentSha && !labels.includes('automation:ready')) {
                    labels.push('automation:ready');
                  }
                  if (recurringDifferentSha) {
                    core.warning(
                      'Diagnostic class ' + diagnosticClass +
                      ' recurred on a distinct main SHA; auto-eligible automation:ready.'
                    );
                  }
                  await apiRetry('refresh P0 diagnostic issue labels', () =>
                    github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: existing.number,
                      state: 'open',
                      labels,
                    })
                  );
                  await postObservation(existing, 'diagnostic', [
                    'Diagnostic recurrence: `' + recurrence + '`',
                    gate ? 'Gate: `' + gate + '`' : 'Gate: `unknown`',
                    'Latest failure category: `' + failureCategory + '`',
                    component ? 'Component: `' + component + '`' : null,
                    'Main SHA: `' + sha + '`',
                    'Qualification run: `' + runId + '`',
                    stall
                      ? [
                          'Last active stage: `' +
                            String((stall.last_active_stage || 'unknown')).slice(0, 64) + '`',
                          'Timeout category: `' +
                            String((stall.timeout_category || 'unknown')).slice(0, 32) + '`',
                          'Request state: `' +
                            String((stall.request_state || 'unconfirmed-in-flight')).slice(0, 48) + '`',
                          'Request progress: `' +
                            String((stall.request_progress_observable || 'progress-unobservable'))
                              .slice(0, 48) + '`',
                          cleanupLine(stall),
                        ].filter(Boolean).join('\n')
                      : '- Typed stall evidence unavailable in the live lane summary.',
                  ]);
                  if (recurringDifferentSha) {
                    await apiRetry('wake issue scheduler for P0 diagnostic', () =>
                      github.rest.actions.createWorkflowDispatch({
                        owner,
                        repo,
                        workflow_id: 'continuum-issue-scheduler.yml',
                        ref: 'main',
                      })
                    );
                  }
                }
              }
              return;
              function stallMeasurementLine(label, raw) {
                // Absent measurements are rendered as unavailable, never as a
                // fabricated 0 ms (kodmial/aa#427): a preemption before the
                // child published timing evidence must read as missing data,
                // not as a measured zero-delay stall.
                const value = raw === undefined || raw === null || raw === '' ? Number.NaN : Number(raw);
                if (!Number.isFinite(value)) {
                  return label + ': `unavailable`';
                }
                return label + ': `' + Math.round(value) + '`';
              }
              function cleanupLine(entry) {
                const cleanup = entry && entry.cleanup;
                if (!cleanup || typeof cleanup !== 'object') {
                  return '- Stall cleanup evidence: `unavailable`.';
                }
                const summary = [
                  'chat_cancelled=' + (cleanup.chat_cancelled ? 'true' : 'false'),
                  'non_cooperative=' + (cleanup.non_cooperative ? 'true' : 'false'),
                  'runtime_restarted=' + (cleanup.runtime_restarted ? 'true' : 'false'),
                  'quarantined_deliveries=' + Number(cleanup.quarantined_delivery_count || 0),
                  'stopped_within_grace=' + (cleanup.stopped_within_grace ? 'true' : 'false'),
                  'reason=' + String(cleanup.reason || 'unknown').slice(0, 32),
                ].join(', ');
                return '- Stall cleanup: `' + summary + '`.';
              }
            }
            let category = 'unknown-gate-failure';
            let blocking = 'unknown';
            let component = 'unknown';
            let productFailures = [];
            // Gate F details must survive beyond the summary-parser try block:
            // the repair issue is constructed later in this same function.
            let typedFailedGates = [];
            let typedRoots = [];
            // Used both inside the evidence parser and in recurrence routing.
            // A block-scoped const inside try caused ReferenceError before the
            // automatic P0 repair task could be published (run 38107901985).
            let failGates = new Set();
            let timingLine = 'Timings: unavailable in self-proving summary.';
            let stageTimingLine = 'Stage timings: unavailable.';
            let verifierLine = 'Verifier availability: unavailable.';
            let transportTimingLine = 'OpenCode request timings: unavailable.';
            let tokenUsageLine = 'Model token usage: unavailable.';
            let modelPathLine = 'Served models: unavailable.';
            let latencyMode = 'observe';
            let qualificationScope = 'quality-first; latency SLO not evaluated';
            let repairFocus = '- Diagnose the concrete failing component for the blocking gate; never flatten to generic PASS.';
            try {
              const summary = JSON.parse(fs.readFileSync('self-proving-out/self-proving-summary.json', 'utf8'));
              latencyMode = String(summary.latency_gate_mode || 'observe');
              qualificationScope = String(
                summary.qualification_scope || 'quality-first; latency SLO not evaluated'
              );
              const gates = summary.gates || [];
              const workflowOutcomes = {
                A: String(process.env.GATE_A_OUTCOME || ''),
                B: String(process.env.GATE_B_OUTCOME || ''),
                C: String(process.env.GATE_C_OUTCOME || ''),
                E: String(process.env.GATE_E_OUTCOME || ''),
              };
              const failedWorkflowGates = ['A', 'B', 'C', 'E']
                .filter(gate => workflowOutcomes[gate] === 'failure');
              const normalizedFailureCategory = (gate, value) => {
                let text = String(value || 'workflow-step-failed').trim();
                const prefix = gate + ':';
                if (text.startsWith(prefix)) text = text.slice(prefix.length);
                return text || 'workflow-step-failed';
              };

              // Workflow step outcomes are authoritative for gate ownership.
              // A downstream skipped gate must never be reconstructed by Gate F
              // as the blocker when an earlier workflow gate actually failed.
              if (failedWorkflowGates.length) {
                productFailures = failedWorkflowGates.map(gate => {
                  const fromSummary = gates.find(
                    item => item && String(item.gate || '') === gate && item.status === 'FAIL'
                  );
                  return {
                    gate,
                    status: 'FAIL',
                    failure_category: normalizedFailureCategory(
                      gate,
                      fromSummary && fromSummary.failure_category
                    ),
                    component: String(
                      (fromSummary && fromSummary.component) ||
                      (gate === 'B' ? 'deterministic-integration' : 'workflow-step')
                    ),
                    latency_p50_ms: Number((fromSummary && fromSummary.latency_p50_ms) || 0),
                    latency_p95_ms: Number((fromSummary && fromSummary.latency_p95_ms) || 0),
                    max_turn_ms: Number((fromSummary && fromSummary.max_turn_ms) || 0),
                  };
                });
              } else {
                productFailures = gates
                  .filter(g => g && g.status === 'FAIL')
                  .map(g => ({
                    ...g,
                    failure_category: normalizedFailureCategory(
                      String(g.gate || ''),
                      g.failure_category
                    ),
                  }));
              }

              const failed = productFailures[0] || (
                transientBlocked ? null : gates.find(g => g.status !== 'PASS')
              );
              // Typed authoritative failure list (issue #339): the read-only
              // Gate F reducer publishes ALL independently failed gates plus
              // typed root components. Automated repair consumes this list,
              // never the alphabetical-first blocking gate alone.
              typedFailedGates = Array.isArray(summary.failed_gates)
                ? summary.failed_gates.map(gate => String(gate || '')).filter(Boolean)
                : [];
              typedRoots = Array.isArray(summary.root_components)
                ? summary.root_components.map(root => String(root || '')).filter(Boolean)
                : [];
              blocking = (failed && failed.gate) || summary.blocking_gate || blocking;
              if (failed) {
                const normalized = normalizedFailureCategory(
                  String(failed.gate || ''),
                  failed.failure_category || failed.status
                );
                category = `${failed.gate}:${normalized}`;
                component = String(failed.component || 'unknown');
              }
              const latencyFailure = productFailures.find(g => g.gate === 'E') || failed;
              if (latencyFailure) {
                const p50 = Number(latencyFailure.latency_p50_ms || 0);
                const p95 = Number(latencyFailure.latency_p95_ms || 0);
                const max = Number(latencyFailure.max_turn_ms || 0);
                if (p50 > 0 || p95 > 0 || max > 0) {
                  timingLine = `Timings: p50=${Math.round(p50)}ms, p95=${Math.round(p95)}ms, max=${Math.round(max)}ms.`;
                }
              }
              failGates = new Set(productFailures.map(g => String(g.gate || '')));
              const gateEFailure = productFailures.find(g => String(g.gate || '') === 'E')
                || (String(blocking) === 'E' ? failed : null);
              const gateECategory = gateEFailure
                ? normalizedFailureCategory(
                    'E',
                    gateEFailure.failure_category || gateEFailure.status
                  )
                : '';
              // Only a real p95/max threshold category is a timing failure.
              // Missing/invalid/mocked/stale timing evidence and censored
              // timeouts are reliability failures and stay actionable in
              // both modes; in observe mode a threshold category can only
              // indicate a mode-propagation/evaluation defect.
              const gateETimingFailure = gateECategory === 'latency-budget-exceeded';
              if (failGates.has('C') && failGates.has('E')) {
                if (latencyMode === 'enforce') {
                  repairFocus = gateETimingFailure
                    ? '- Repair both proven defects in this same cycle: Gate C functional live-path failure and Gate E SLO failure. Use the concrete C category plus per-stage latency/model evidence; do not defer E until a later qualification run.'
                    : '- Repair both proven defects in this same cycle: Gate C functional live-path failure and Gate E evidence/reliability failure (not a p95/max threshold defect). Repair the missing/invalid/censored timing evidence or timed-out turn; do not add latency tuning or weaken qualification semantics.';
                } else {
                  repairFocus =
                    '- Repair both proven defects in this same cycle: Gate C functional live-path failure and Gate E evidence/reliability failure (observe mode does not evaluate p95/max thresholds). Keep Gate C strict; do not add latency tuning or weaken qualification semantics.' +
                    (gateETimingFailure
                      ? ' Gate E also reported a timing threshold failure while observe mode is active: repair the mode propagation so observe publishes timing without evaluating p95/max; do not weaken reliability/evidence integrity.'
                      : '');
                }
              } else if (blocking === 'E') {
                if (latencyMode === 'enforce') {
                  repairFocus = gateETimingFailure
                    ? '- Gate E is the sole live-text SLO owner: meet the configured p95/max thresholds. Keep Gate C strict; do not weaken thresholds, tests, qualification semantics, or reclassify the failure into Gate C. Use per-stage telemetry to identify and remove the dominant latency source.'
                    : '- Gate E failed evidence/reliability integrity, not time thresholds (enforce mode only evaluates p95/max on valid timing evidence). Repair the missing/invalid/censored timing evidence or timed-out turn; do not weaken Gate C or relabel an unfinished run as successful.';
                } else if (gateETimingFailure) {
                  repairFocus = '- Gate E reported a p95/max threshold failure while latency_gate_mode=observe. Treat this as a mode-propagation/evaluation defect: observe must publish timing without failing slow-but-valid turns on thresholds. Do not weaken evidence/reliability integrity, Gate C, or relabel an unfinished/censored run as successful.';
                } else {
                  repairFocus = '- Gate E failed evidence/reliability integrity, not time thresholds (observe mode). Repair the missing/invalid/censored timing evidence or timed-out turn; do not add latency tuning or weaken Gate C.';
                }
              } else if (blocking === 'C') {
                repairFocus = '- Gate C owns functional production-path correctness only. Diagnose the concrete broken stage/fallback/diversity/grounding component; latency-only defects belong to Gate E.';
              }
            } catch (error) {
              core.warning('No self-proving summary; using generic failure category: ' + error.message);
            }
            try {
              const live = JSON.parse(fs.readFileSync('live-out/product-contract-live-summary.json', 'utf8'));
              const lane = (live.lanes || []).find(item => item && item.lane === 'live-telegram-evidence');
              const metrics = (lane && lane.metrics) || {};
              const stages = metrics.stage_latency_ms || {};
              const names = ['planner', 'retrieval', 'answer', 'verifier', 'total'];
              const rendered = names
                .filter(name => stages[name])
                .map(name => {
                  const item = stages[name] || {};
                  return `${name}=p50:${Math.round(Number(item.p50 || 0))}/p95:${Math.round(Number(item.p95 || 0))}/max:${Math.round(Number(item.max || 0))}ms`;
                });
              const repair = metrics.repair_metrics || {};
              if (rendered.length) {
                stageTimingLine = 'Stage timings: ' + rendered.join('; ') +
                  `; repair_turns=${Number(repair.turns_with_repair || 0)}, repair_rounds=${Number(repair.repair_rounds_total || 0)}, answer_rounds=${Number(repair.answer_rounds_total || 0)}, budget_exceeded=${Number(repair.repair_budget_exceeded_turns || 0)}.`;
              }
              const verifier = metrics.verifier_metrics || {};
              verifierLine =
                'Verifier availability: ' +
                `turns_with_unavailable_units=${Number(verifier.turns_with_unavailable_units || 0)}, ` +
                `unavailable_units_total=${Number(verifier.unavailable_units_total || 0)}, ` +
                `response_units_total=${Number(verifier.response_units_total || 0)}, ` +
                `response_units_max=${Number(verifier.response_units_max || 0)}.`;
              const requestTimings = metrics.opencode_request_latency_ms || {};
              const requestRendered = Object.keys(requestTimings)
                .sort()
                .map(name => {
                  const item = requestTimings[name] || {};
                  return `${name}=n:${Number(item.count || 0)}/p50:${Math.round(Number(item.p50 || 0))}/p95:${Math.round(Number(item.p95 || 0))}/max:${Math.round(Number(item.max || 0))}ms`;
                });
              if (requestRendered.length) {
                transportTimingLine = 'OpenCode request timings: ' + requestRendered.join('; ') + '.';
              }
              const tokenUsage = metrics.opencode_token_usage_by_agent || {};
              const tokenRendered = Object.keys(tokenUsage)
                .sort()
                .map(name => {
                  const item = tokenUsage[name] || {};
                  return `${name}=requests:${Number(item.requests || 0)}/in:${Number(item.input_total || 0)}/out:${Number(item.output_total || 0)}/reasoning:${Number(item.reasoning_total || 0)}`;
                });
              if (tokenRendered.length) {
                tokenUsageLine = 'Model token usage: ' + tokenRendered.join('; ') + '.';
              }
              const served = metrics.served_models_by_agent || {};
              const servedEntries = Object.keys(served)
                .sort()
                .map(name => `${name}=${(served[name] || []).join(',')}`);
              if (servedEntries.length) {
                modelPathLine = 'Served models: ' + servedEntries.join('; ') +
                  `; clarifications=${Number(metrics.clarification_count || 0)}.`;
              }
            } catch (error) {
              core.info('No per-stage live timing evidence yet: ' + error.message);
            }
            if (transientBlocked && category === 'unknown-gate-failure') {
              core.notice('External/transient block has no independent product FAIL; recovery will retry qualification.');
              return;
            }
            // Code mutation is NOT the same as a negative qualification verdict.
            // Admission is one testable, repository-owned pure policy. Record
            // every FAIL in #7 as before; use only proven product failures
            // for automatic Git/PR side effects.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const activeRepair = issues.some(issue =>
              !issue.pull_request && issue.state === 'open' &&
              (String(issue.body || '').includes('<!-- aa-self-proving-repair:v1 -->') ||
               String(issue.body || '').includes('<!-- aa-self-proving-systemic-escalation:v1 -->') ||
               String(issue.body || '').includes('<!-- aa-self-proving-convergence-breaker:v1 -->')) &&
              (issue.labels || []).some(label =>
                label.name === 'automation:ready' || label.name === 'automation:in-progress'
              )
            );
            const gateCBreaker = issues.some(issue =>
              !issue.pull_request && issue.state === 'open' &&
              String(issue.body || '').includes('<!-- aa-self-proving-convergence-breaker:v1 -->') &&
              String(issue.body || '').includes('Convergence scope: `gate:C`') &&
              (issue.labels || []).some(label => label.name === 'automation:blocked')
            );
            const { execFileSync } = require('child_process');
            let admission;
            try {
              admission = JSON.parse(execFileSync(
                'python',
                ['scripts/plan_qualification_repair.py'],
                {
                  input: JSON.stringify({
                    failures: productFailures,
                    gate_c_breaker: gateCBreaker,
                    in_flight_repair: activeRepair,
                  }),
                  encoding: 'utf8',
                  timeout: 10000,
                }
              ));
            } catch (error) {
              // Invalid classifier/evidence blocks mutation, not qualification.
              core.warning('Qualification repair classifier failed; no code mutation: ' + error.message);
              return;
            }
            core.notice('repair-policy decision: actionable=' +
              admission.actionable.length + ' held=' + admission.held.length);
            for (const held of admission.held) {
              core.notice('repair-policy held gate ' + held.gate + ': ' + held.reason);
            }
            try {
              await ensureDiagnosticIssues(admission);
            } catch (error) {
              // Diagnostic bookkeeping never blocks mutation routing or the
              // verdict itself.
              core.warning('P0 diagnostic issue maintenance failed: ' + error.message);
            }
            if (!Array.isArray(admission.actionable) || admission.actionable.length === 0) {
              core.notice('FAIL/UNQUALIFIED evidence is preserved. No proven new code mutation admitted.');
              return;
            }
            productFailures = admission.actionable.map(index => productFailures[index]);
            typedFailedGates = productFailures.map(item => String(item.gate));
            typedRoots = productFailures.map(item =>
              String(item.gate) + ':' +
              String(item.failure_category || 'FAIL') + ':' +
              String(item.component || 'unknown')
            );
            const firstAdmitted = productFailures[0];
            blocking = String(firstAdmitted.gate || 'unknown');
            category = blocking + ':' + String(firstAdmitted.failure_category || 'FAIL');
            component = String(firstAdmitted.component || 'unknown');
            failGates = new Set(typedFailedGates);
            const marker = '<!-- aa-self-proving-repair:v1 -->';
            // Stable defect identity deliberately excludes main SHA. When
            // several product gates fail in one trusted run, keep one combined
            // repair series so C/E can converge in the same implementation
            // cycle rather than serializing known defects across runs.
            const stripGatePrefix = (gate, value) => {
              let text = String(value || 'FAIL').trim();
              const prefix = String(gate || '') + ':';
              if (prefix !== ':' && text.startsWith(prefix)) text = text.slice(prefix.length);
              return text || 'FAIL';
            };
            const stableFailures = productFailures.length
              ? productFailures
                  .map(g =>
                    `${g.gate}:${stripGatePrefix(g.gate, g.failure_category || g.status)}:${g.component || 'unknown'}`
                  )
                  .sort()
              : [`${blocking}:${stripGatePrefix(blocking, category)}:${component}`];
            const fingerprint = stableFailures.join('|');
            const gateLabel = productFailures.length > 1
              ? productFailures.map(g => g.gate).join('+')
              : blocking;
            const title = `P0: Repair self-proving qualification failure (Gate ${gateLabel})`;
            const existing = issues
              .filter(issue => !issue.pull_request && String(issue.body || '').includes(marker))
              .find(issue =>
                String(issue.body || '').includes(`Repair fingerprint: \`${fingerprint}\``)
              );
            const legacyLocalRecurrence = Number(
              String(existing?.body || '').match(/Repair recurrence: \`(\d+)\`/)?.[1] || 1
            );
            const recurrence = await nextObservationRecurrence(existing, 'repair', legacyLocalRecurrence);
            const MAX_LOCAL_REPAIR_RECURRENCE = 2;
            const recurrenceFocus = recurrence > 1
              ? '- RECURRENCE: the previous repair for this same stable failure set did not converge. Do not repeat the same local symptom patch. Compare the new per-stage evidence with the prior failure, identify the dominant persistent cause, and change strategy at the responsible boundary.'
              : '- First occurrence for this stable product-failure fingerprint.';

            // Fingerprint-only recurrence misses alternating Gate C failures:
            // a different scenario fails after each narrow patch even though
            // the product never converges. Count trusted distinct-main verdicts
            // rather than literal prompts or defect fingerprints.
            const qualificationComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: 7, per_page: 100,
            });
            const recentVerdicts = qualificationComments
              .map(comment => String(comment.body || ''))
              .filter(body => body.includes('<!-- continuum-qualification-result issue=7 sha='))
              .slice(-8);
            const recentGateCShas = recentVerdicts
              .filter(body => /Gates:\s*[^\n]*\bC:FAIL\b/.test(body))
              .map(body => body.match(/sha=([0-9a-f]{40}) result=fail/)?.[1])
              .filter(Boolean);
            const crossFingerprintStall =
              (blocking === 'C' || failGates.has('C')) &&
              new Set(recentGateCShas).size >= 4;
            const systemicScope = crossFingerprintStall ? 'gate:C' : `fingerprint:${fingerprint}`;
            const activeLocalRepair = issues.some(issue =>
              !issue.pull_request &&
              issue.state === 'open' &&
              String(issue.body || '').includes(marker) &&
              (issue.labels || []).some(label => label.name === 'automation:in-progress')
            );
            if (crossFingerprintStall && activeLocalRepair) {
              core.warning('Gate C persists across distinct main SHAs. ' +
                'An existing narrow repair is already running; defer systemic dispatch ' +
                'until its merge/requalification to prevent competing code writers.');
              return;
            }

            // Hard convergence breaker: the old controller only *said*
            // "bounded" while reopening/dispatching the same repair issue
            // forever. That allowed recurrence to reach 10 and repeatedly
            // moved main under qualification. Two local attempts are enough
            // to prove a stable fingerprint is not a local one-off. From the
            // third occurrence onward, retire the narrow repair series and
            // automatically escalate to one systemic/root-cause task instead.
            if (recurrence > MAX_LOCAL_REPAIR_RECURRENCE || crossFingerprintStall) {
              if (existing) {
                await apiRetry('retire recurrent narrow repair issue', () =>
                  github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    state: 'closed',
                    state_reason: 'not_planned',
                    labels: ['priority:p0', 'automation:blocked'],
                  })
                );
              }

              const systemicMarker = '<!-- aa-self-proving-systemic-escalation:v1 -->';
              const systemicTitle = crossFingerprintStall ? 'P0 SYSTEMIC: resolve persistent Gate C across distinct main SHAs' : `P0 SYSTEMIC: break recurrent Product Contract failure (Gate ${gateLabel})`;
              const systemicExisting = issues
                .filter(issue => !issue.pull_request && String(issue.body || '').includes(systemicMarker))
                .find(issue =>
                  (crossFingerprintStall
                    ? String(issue.body || '').includes('Systemic scope: `gate:C`')
                    : String(issue.body || '').includes(`Failure fingerprint: \`${fingerprint}\``))
                );
              const legacySystemicRecurrence = Number(
                String(systemicExisting?.body || '').match(/Systemic recurrence: \`(\d+)\`/)?.[1] || 1
              );
              const systemicRecurrence = await nextObservationRecurrence(
                systemicExisting, 'systemic', legacySystemicRecurrence
              );
              const MAX_SYSTEMIC_REPAIR_RECURRENCE = 2;
              if (systemicRecurrence > MAX_SYSTEMIC_REPAIR_RECURRENCE) {
                if (systemicExisting) {
                  await apiRetry('retire exhausted systemic repair issue', () =>
                    github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: systemicExisting.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                      labels: ['priority:p0', 'automation:blocked'],
                    })
                  );
                }

                const breakerMarker = '<!-- aa-self-proving-convergence-breaker:v1 -->';
                const breakerExisting = issues
                  .filter(issue => !issue.pull_request && String(issue.body || '').includes(breakerMarker))
                  .find(issue => String(issue.body || '').includes(`Convergence scope: \`${systemicScope}\``));
                const breakerBody = [
                  breakerMarker,
                  observationMarker('breaker'),
                  `Convergence scope: \`${systemicScope}\``,
                  '',
                  '## Automatic convergence breaker',
                  '',
                  `Failure fingerprint: \`${fingerprint}\``,
                  `Blocking gate: \`${blocking}\``,
                  `Component: \`${component}\``,
                  `Main SHA: \`${sha}\``,
                  `Qualification run: \`${runId}\``,
                  `Local repair recurrence: \`${recurrence}\``,
                  `Systemic recurrence: \`${systemicRecurrence}\``,
                  timingLine,
                  stageTimingLine,
                  verifierLine,
                  transportTimingLine,
                  tokenUsageLine,
                  modelPathLine,
                  '',
                  '### Required convergence-breaker behavior',
                  '',
                  '- This is the final automatic mutation strategy for this convergence scope. Do not resume narrow or systemic retry loops.',
                  '- Reconstruct the failure across recent exact-main qualification history and identify the smallest architecture invariant that explains all repeated failures.',
                  '- Do not add literal qualification-prompt branches, domain keyword/stem tables, numbered-step parsing, token-overlap relevance, or handcrafted semantic qualification predicates.',
                  '- Do not weaken Product Contract #110, Gate semantics, grounding, relevance, safety, or the current Gate E SLO.',
                  '- Produce at most one architecture-level repair with generic regression coverage, then require a fresh exact-main qualification.',
                  '- If this same convergence scope fails again after the breaker repair, keep Product Contract UNQUALIFIED and leave this breaker blocked. Do not dispatch further automatic code mutations for the same scope.',
                  '',
                  'This is a circuit breaker for code mutation, not a Product Contract override. Other unrelated automation may continue.',
                ].join('\n');

                if (breakerExisting) {
                  await postObservation(breakerExisting, 'breaker', [
                    'Qualification run: \`' + runId + '\`',
                    'Convergence scope: \`' + systemicScope + '\`',
                    stageTimingLine,
                    'Breaker remains blocked; no specification rewrite or redispatch.',
                  ]);
                  await apiRetry('keep exhausted convergence scope blocked', () =>
                    github.rest.issues.update({
                      owner, repo, issue_number: breakerExisting.number,
                      state: 'open',
                      labels: ['priority:p0', 'automation:blocked'],
                    })
                  );
                  core.setFailed(
                    'Convergence scope ' + systemicScope + ' exhausted; further automatic mutations are blocked.'
                  );
                  return;
                }

                const created = await apiRetry('create convergence breaker issue', () =>
                  github.rest.issues.create({
                    owner,
                    repo,
                    title: `P0 BREAKER: one final architecture repair for ${systemicScope}`,
                    body: breakerBody,
                    labels: ['priority:p0', 'automation:ready'],
                  })
                );
                core.warning(
                  `Created one-shot convergence breaker #${created.data.number} for ${systemicScope}.`
                );
                await apiRetry('wake issue scheduler for convergence breaker', () =>
                  github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
                  })
                );
                return;
              }

              const systemicBody = [
                systemicMarker,
                observationMarker('systemic'),
                `Systemic scope: \`${systemicScope}\``,
                '',
                '## Automatic convergence escalation',
                '',
                `Failure fingerprint: \`${fingerprint}\``,
                `Latest failure category: \`${category}\``,
                `Blocking gate: \`${blocking}\``,
                `Component: \`${component}\``,
                `Main SHA: \`${sha}\``,
                `Qualification run: \`${runId}\``,
                `Local repair recurrence: \`${recurrence}\``,
                `Systemic recurrence: \`${systemicRecurrence}\``,
                timingLine,
                stageTimingLine,
                verifierLine,
                transportTimingLine,
                tokenUsageLine,
                modelPathLine,
                '',
                '### Required systemic behavior',
                '',
                '- STOP local symptom patching. Audit the complete planner -> retrieval -> evidence -> answer -> verifier -> qualification path; correlate failures across distinct main SHAs and semantic scenarios.',
                '- Do not add exact-question branches, domain keyword/stem tables, numbered-step parsing, token-overlap relevance, or handcrafted semantic qualification predicates.',
                '- Do not weaken Product Contract #110, Gate C semantics, grounding, relevance, safety, or the current Gate E SLO.',
                '- Any implementation must include a generic regression test for the failure class, not the literal qualification prompt.',
                '- Produce one architecture-level repair from current main, then rerun exact-main qualification. Do not create or merge another narrow repair for the retired fingerprint.',
                '- If the same fingerprint survives this systemic repair, update this same systemic task with the new evidence; do not resurrect the retired narrow repair series.',
                '',
                'This escalation exists specifically to prevent an unbounded qualification -> symptom patch -> merge -> qualification loop.',
              ].join('\n');

              const systemicInProgress = Boolean(systemicExisting && systemicExisting.state === 'open' &&
                (systemicExisting.labels || []).some(label => label.name === 'automation:in-progress'));
              if (systemicExisting) {
                const systemicLabels = issueLabelNames(systemicExisting);
                // A recorded run is only truly done when the issue is actually
                // open and scheduled. If a previous attempt recorded the
                // observation but failed before reopening/dispatching, recover
                // by redispatching instead of leaving the repair stalled.
                const systemicRecorded = await runAlreadyRecorded(systemicExisting, 'systemic');
                const systemicScheduled = systemicExisting.state === 'open' &&
                  systemicLabels.includes('automation:ready') &&
                  !systemicLabels.includes('automation:in-progress') &&
                  !systemicLabels.includes('automation:blocked');
                if (systemicRecorded && systemicScheduled) {
                  core.notice('Systemic recurrence already recorded for run ' + runId +
                    '; no redispatch.');
                  return;
                }
                // Record the observation only after the reopen/dispatch side
                // effect succeeds so a failed run is safely retried on rerun.
                await redispatchExistingIssue(systemicExisting, 'systemic');
                await postObservation(systemicExisting, 'systemic', [
                  'Systemic recurrence: \`' + systemicRecurrence + '\`',
                  'Qualification run: \`' + runId + '\`',
                  'Main SHA: \`' + sha + '\`',
                  'Failure fingerprint: \`' + fingerprint + '\`',
                  stageTimingLine,
                  verifierLine,
                  transportTimingLine,
                  tokenUsageLine,
                  modelPathLine,
                  'Existing OpenCode generation specification remains immutable.',
                ]);
                return;
              } else {
                const created = await apiRetry('create systemic convergence issue', () =>
                  github.rest.issues.create({
                    owner,
                    repo,
                    title: systemicTitle,
                    body: systemicBody,
                    labels: ['priority:p0', 'automation:ready'],
                  })
                );
                core.warning(
                  `Created systemic convergence issue #${created.data.number}; local recurrence=${recurrence}.`
                );
              }

              if (!systemicInProgress) {
                await apiRetry('wake issue scheduler for systemic convergence', () =>
                  github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
                  })
                );
              }
              core.info('Systemic convergence task refreshed; concurrent dispatch suppressed when already in progress.');
              return;
            }

            const body = [
              marker,
              observationMarker('repair'),
              '',
              '## Automatic self-proving repair',
              '',
              `Failure category: \`${category}\``,
              `Blocking gate: \`${blocking}\``,
              `Component: \`${component}\``,
              `All proven product failures: \`${stableFailures.join(', ')}\``,
              `Failed gates (typed): \`${(typedFailedGates.length ? typedFailedGates : [blocking]).join(', ')}\``,
              `Root components (typed): \`${(typedRoots.length ? typedRoots : [component]).join(', ')}\``,
              `Main SHA: \`${sha}\``,
              `Run id: \`${runId}\``,
              `Repair fingerprint: \`${fingerprint}\``,
              `Repair recurrence: \`${recurrence}\``,
              timingLine,
              stageTimingLine,
              verifierLine,
              transportTimingLine,
              tokenUsageLine,
              modelPathLine,
              '',
              '### Required repair behavior',
              '',
              repairFocus,
              recurrenceFocus,
              '- Fix without exact-question special cases; Product Contract #110 stays immutable.',
              '- Rerun the failed gate first, then downstream gates, then the exact-main final gate.',
              '- Repeat boundedly until PASS; no owner comments, manual labels, or manual merge required.',
              '- Provider 429: retire/restart the runner and resume from the last completed gate checkpoint.',
              '',
              'This issue is generated and refreshed automatically; the same stable failure series reopens this issue instead of creating another one.',
            ].join('\n');
            if (existing) {
              const existingLabels = issueLabelNames(existing);
              // A recorded run is only truly done when the pinned issue is
              // actually open and scheduled. If a previous attempt recorded the
              // observation but failed before reopening/dispatching, recover by
              // redispatching instead of leaving the repair stalled forever.
              const existingRecorded = await runAlreadyRecorded(existing, 'repair');
              const existingScheduled = existing.state === 'open' &&
                existingLabels.includes('automation:ready') &&
                !existingLabels.includes('automation:in-progress') &&
                !existingLabels.includes('automation:blocked');
              if (existingRecorded && existingScheduled) {
                core.notice('Repair recurrence already recorded for run ' + runId +
                  '; no redispatch.');
                return;
              }
              // Record the observation only after the reopen/dispatch side
              // effect succeeds so a failed run is safely retried on rerun.
              await redispatchExistingIssue(existing, 'repair');
              await postObservation(existing, 'repair', [
                'Repair recurrence: \`' + recurrence + '\`',
                'Qualification run: \`' + runId + '\`',
                'Main SHA: \`' + sha + '\`',
                'Repair fingerprint: \`' + fingerprint + '\`',
                timingLine,
                stageTimingLine,
                'Existing OpenCode generation specification remains immutable.',
              ]);
              return;
            } else {
              const created = await apiRetry('create self-proving repair issue', () =>
                github.rest.issues.create({
                  owner, repo, title, body, labels: ['priority:p0', 'automation:ready'],
                })
              );
              core.info(
                `Created self-proving repair issue #${created.data.number}; fingerprint=${fingerprint}.`
              );
            }
            // Convergence repair (kodmial/aa#192): explicitly wake the issue
            // scheduler once via workflow_dispatch. Events emitted by
            // GITHUB_TOKEN (issue create/update above) do not reliably trigger
            // downstream workflows, and scheduled cron alone left a P0 repair
            // issue undispatched for roughly an hour. This is the supported
            // recursion-safe wake-up; never use a PAT merely to manufacture
            // event fan-out.
            await apiRetry('wake issue scheduler', () =>
              github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'continuum-issue-scheduler.yml', ref: 'main',
              })
            );
            core.info('Dispatched continuum-issue-scheduler.yml once for the P0 repair issue.');

      - name: Publish authoritative Product Contract result
        # Publish only when Gate A actually executed. A setup cancellation
        # must never record a trusted product FAIL on missing artifacts.
        if: ${{ always() && (needs.qualify.outputs.gate_a_outcome == 'success' || needs.qualify.outputs.gate_a_outcome == 'failure') && hashFiles('self-proving-out/restart-required.json') == '' && hashFiles('self-proving-out/stale-main.json') == '' }}
        uses: actions/github-script@v7
        env:
          QUAL_SHA: ${{ steps.sha.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            // AA owns qualification in this repository because only this
            // workflow has the real Telegram/book/model assets required by
            // Product Contract #110. Generic OpenCode qualification must not
            // manufacture failures from a no-secret/minimal runner.
            const fs = require('fs');
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(
                    `${label} failed on attempt ${attempt}: ${error.message}; retrying in ${delayMs}ms.`
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            const path = 'self-proving-out/self-proving-summary.json';
            if (!fs.existsSync(path)) {
              core.warning('No self-proving summary; no authoritative #7 result is published.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const sha = String(summary.sha || process.env.QUAL_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Authoritative qualification summary has no valid exact SHA.');
              return;
            }

            const { data: main } = await apiRetry('resolve current main', () =>
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              })
            );
            const currentMain = String(main.commit.sha || '').toLowerCase();
            if (sha !== currentMain) {
              core.notice(
                `Qualification result is stale at publish time (tested=${sha}, current=${currentMain}); lifecycle unchanged.`
              );
              return;
            }

            const status = String(summary.status || '').toUpperCase();
            const result = status === 'PASS' ? 'pass' : 'fail';
            const marker =
              `<!-- continuum-qualification-result issue=7 sha=${sha} result=${result} -->`;
            const gates = Array.isArray(summary.gates)
              ? summary.gates.map(g => `${g.gate}:${g.status}`).join(' ')
              : '';
            const blocking = String(summary.blocking_gate || 'none');
            const latencyMode = String(summary.latency_gate_mode || 'observe');
            const qualificationScope = String(
              summary.qualification_scope ||
                (latencyMode === 'observe'
                  ? 'quality-first; latency SLO not evaluated'
                  : 'quality-and-latency')
            );
            const verdictLabel = result === 'pass'
              ? latencyMode === 'observe'
                ? 'PASS (QUALIFIED (quality-first; latency SLO not evaluated))'
                : 'PASS (QUALIFIED)'
              : 'FAIL (UNQUALIFIED)';
            const body = [
              marker,
              '',
              '## AA self-proving Product Contract qualification',
              '',
              `Exact current main: \`${sha}\``,
              `Workflow run: \`${context.runId}\``,
              `Verdict: **${verdictLabel}**`,
              `Gates: ${gates || 'unavailable'}`,
              `Blocking gate: ${blocking}`,
              `Latency gate: ${latencyMode}`,
              `Qualification scope: ${qualificationScope}`,
              '',
              'Evidence was produced by the repository-owned qualification workflow with canonical book identity, real OpenCode/provider path, production retrieval index and voice assets. External Telegram Bot API checks and a separate test bot are not qualification prerequisites. Generic no-secret qualification workers are not authoritative for AA.',
            ].join('\n');

            const comments = await apiRetry('list qualification comments', () =>
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 7,
                per_page: 100,
              })
            );
            if (!comments.some(c => String(c.body || '').includes(marker))) {
              await apiRetry('publish qualification result comment', () =>
                github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  body,
                })
              );
            }

            if (result === 'pass') {
              await apiRetry('close qualification tracker', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  state: 'closed',
                  state_reason: 'completed',
                  labels: [],
                })
              );
              await apiRetry('publish capability completion comment', () =>
                github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  body: [
                    '⚡ **AA self-proving qualification**',
                    '<!-- continuum-origin role=project component=aa-self-proving-qualification -->',
                    `Product Contract qualified on exact current main \`${sha}\`; capability #6 is complete.`,
                  ].join('\n'),
                })
              );
              await apiRetry('close capability issue', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  state: 'closed',
                  state_reason: 'completed',
                  labels: ['priority:p1'],
                })
              );

              const openIssues = await apiRetry('list open repair issues', () =>
                github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                })
              );
              for (const issue of openIssues) {
                if (
                  !issue.pull_request &&
                  String(issue.body || '').includes('<!-- aa-self-proving-repair:v1 -->')
                ) {
                  await apiRetry('close completed repair issue', () =>
                    github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      state: 'closed',
                      state_reason: 'completed',
                    })
                  );
                }
              }
              core.notice(`Product Contract PASS accepted for exact main ${sha}; #7 and #6 completed.`);
            } else {
              await apiRetry('mark qualification tracker unqualified', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 7,
                  state: 'open',
                  labels: ['automation:in-progress'],
                })
              );
              await apiRetry('mark capability blocked', () =>
                github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: 6,
                  state: 'open',
                  labels: ['priority:p1', 'automation:qualifying', 'automation:blocked'],
                })
              );
              core.warning(
                `Product Contract remains unqualified at exact main ${sha}; self-proving repair loop continues from Gate ${blocking}.`
              );
            }

      - name: Reconcile stale repair reservations
        # kodmial/aa#417: a repair issue marked automation:in-progress that
        # produced neither an open opencode/issue<N>-* pull request nor an
        # in-flight continuum run is a stale reservation. Without
        # reconciliation such a reservation permanently deadlocks the issue
        # scheduler: no other repair can start. Return the issue to
        # automation:ready so work resumes without owner action. Evidence is
        # deterministic (open PR head branch prefix, in-flight/queued
        # continuum runs, bounded freshness window) and carries no message
        # content.
        # Never reconcile after cancellation: a cancelled run can leave
        # queued/not-yet-visible continuum work that still owns the
        # reservation. Successful and failed runs still reconcile.
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const REPAIR_MARKERS = [
              '<!-- aa-self-proving-repair:v1 -->',
              '<!-- aa-self-proving-systemic-escalation:v1 -->',
              '<!-- aa-self-proving-diagnostic-infrastructure:v1 -->',
            ];
            const FRESHNESS_MS = 15 * 60 * 1000;
            const recoveryMarker = number =>
              '<!-- aa-self-proving-reservation-recovery:v1 issue=' + number + ' -->';
            async function apiRetry(label, fn) {
              let delayMs = 5000;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === 5) throw error;
                  core.warning(
                    `${label} failed on attempt ${attempt}: ${error.message}; retrying in ${delayMs}ms.`
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                  delayMs = Math.min(delayMs * 2, 60000);
                }
              }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const reservations = issues.filter(issue =>
              !issue.pull_request &&
              (issue.labels || []).some(label => label.name === 'automation:in-progress') &&
              REPAIR_MARKERS.some(marker => String(issue.body || '').includes(marker))
            );
            if (!reservations.length) {
              core.info('No automation:in-progress repair reservations to reconcile.');
              return;
            }
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            // In-flight or queued continuum work is reservation evidence; the
            // run name (e.g. "OpenCode issue #417") associates it with the
            // issue deterministically instead of parsing prompt text.
            const activeRuns = [];
            for (const workflowId of ['continuum-opencode.yml', 'continuum-opencode-repair.yml']) {
              for (const status of ['in_progress', 'queued']) {
                try {
                  const response = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner, repo: context.repo.repo,
                    workflow_id: workflowId, status, per_page: 100,
                  });
                  for (const run of response.data.workflow_runs || []) {
                    activeRuns.push(String(run.name || '') + ' ' + String(run.head_branch || ''));
                  }
                } catch (error) {
                  core.warning('Could not list ' + workflowId + ' runs (' + status + '): ' + error.message);
                }
              }
            }
            const activeRunsText = activeRuns.join(' | ');
            for (const issue of reservations) {
              const issueNumber = Number(issue.number);
              const hasRelatedPull = openPulls.some(pull => {
                const ref = String(pull?.head?.ref || '');
                return ref.startsWith('opencode/issue' + issueNumber + '-');
              });
              const hasActiveRun = new RegExp(
                'OpenCode issue #' + issueNumber + '(?![0-9])'
              ).test(activeRunsText);
              const reservationAgeMs = Date.now() - Date.parse(issue.updated_at);
              if (hasRelatedPull || hasActiveRun || reservationAgeMs < FRESHNESS_MS) {
                core.info(
                  'Reservation on #' + issueNumber + ' still has live evidence: ' +
                  (hasRelatedPull ? 'open opencode pull request' : '') +
                  (hasActiveRun ? (hasRelatedPull ? ' + ' : '') + 'in-flight continuum run' : '') +
                  (reservationAgeMs < FRESHNESS_MS ? ' + fresh reservation age' : '')
                );
                continue;
              }
              const commentSearch = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, per_page: 100,
              });
              const alreadyRecovered = commentSearch.some(comment =>
                String(comment.body || '').includes(recoveryMarker(issueNumber)) &&
                comment.user?.login === 'github-actions[bot]'
              );
              const labels = (issue.labels || [])
                .map(label => label.name)
                .filter(name => name !== 'automation:in-progress');
              if (!labels.includes('automation:ready')) labels.push('automation:ready');
              await apiRetry('release stale reservation on #' + issueNumber, () =>
                github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, state: 'open', labels,
                })
              );
              if (!alreadyRecovered) {
                await apiRetry('record stale reservation recovery on #' + issueNumber, () =>
                  github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: [
                      recoveryMarker(issueNumber),
                      'Stale reservation reconciled automatically: the repair issue was marked' +
                      ' `automation:in-progress` but produced no open `opencode/issue' + issueNumber +
                      '-*` pull request and no in-flight continuum run for at least 15 minutes.',
                      'Returned to `automation:ready` so the issue scheduler can re-dispatch it.',
                    ].join('\n'),
                  })
                );
              } else {
                core.info('Recovery already recorded for #' + issueNumber + '; labels refreshed only.');
              }
              core.warning('Released stale reservation on repair issue #' + issueNumber + '.');
            }

      - name: Handle provider 429 runner retire
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f self-proving-out/restart-required.json ]]; then
            echo "::error::OpenCode 429: retire this runner and resume from the last completed gate checkpoint."
            exit 75
          fi
