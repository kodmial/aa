name: AA Gate C held-out bootstrap

# Trusted post-code-freeze evaluator for Gate C (kodmial/aa#341).
#
# Two-phase bootstrap:
#   (i)  the implementation PR carries the evaluator plus deterministic
#        offline calibration (public fixtures only, never an unseen PASS);
#   (ii) AFTER merge, this repository-owned workflow pins the merged
#        evaluator source SHA plus the frozen v2 rubric digest as the
#        protected evaluation baseline, then mints a run-unique
#        unpredictable seed and synthesizes never-preannounced Russian
#        multi-turn prompts/semantic variants with the configured real
#        provider.
#
# Anti-substitution: subsequent product feature PRs may not substitute
# their own evaluator implementation or mutate the trusted baseline during
# qualification. The live Gate C lane validates the running tree against
# the pinned baseline on every run: a mismatch (or a missing baseline for
# a generated fixture) makes the unseen held-out proof BLOCKED, never
# passed. A visible checked-in fixture alone never makes held-out PASS.
#
# Privacy: only digests, counts and fixed-vocabulary tokens are ever
# logged. Prompt text and seeds never enter logs, artifacts metadata, or
# issue/agent-visible evidence. The generated fixture is uploaded as a
# workflow artifact consumed via AA_GATE_C_HELDOUT_FIXTURE; it is never
# committed to the repository. No new owner-provisioned secrets: this
# workflow uses only the secrets already declared for Gate C.
#
# If the baseline cannot be pinned, the provider is unavailable, or no
# sealed fixture exists, the held-out tier stays typed BLOCKED (an
# explicit external prerequisite), never a product FAIL and never a
# silent reuse of exposed regression strings.

on:
  push:
    branches:
      - main
    paths:
      - "src/aa/qualification/gate_c_heldout.py"
      - "src/aa/qualification/product_contract_live.py"
      - "qualification/ru_answer_quality_rubric.v2.json"
      - "scripts/pin_gate_c_evaluator_baseline.py"
      - "scripts/generate_gate_c_heldout.py"
      - ".github/workflows/aa-gate-c-heldout-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: aa-gate-c-heldout-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e ".[dev]"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Qualify AA production model via Continuum
        id: aa_model_route
        uses: kodmial/continuum/.github/actions/model-route@main
        with:
          models: ${{ vars.OPENCODE_MODELS }}
          task-class: coder
          profile: aa-product
          state-token: ${{ github.token }}
          strategy: ${{ vars.OPENCODE_MODEL_STRATEGY || 'sticky-failover' }}
          probe-ttl: ${{ vars.OPENCODE_PROBE_TTL || '3600' }}
          cooldown: ${{ vars.OPENCODE_MODEL_COOLDOWN || '900' }}
          timeout: ${{ vars.OPENCODE_PROBE_TIMEOUT || '90' }}

      - name: Freeze verified model for Gate C fixture generation
        env:
          APPROVED_POOL: ${{ vars.OPENCODE_MODELS }}
          VERIFIED_MODEL: ${{ steps.aa_model_route.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPROVED_POOL" || { echo "::error::AA requires approved OPENCODE_MODELS repository variable"; exit 2; }
          test -n "$VERIFIED_MODEL"
          {
            echo "OPENCODE_MODELS=$APPROVED_POOL"
            echo "OPENCODE_MODEL=$VERIFIED_MODEL"
            echo "OPENCODE_FALLBACK_MODEL=$VERIFIED_MODEL"
            echo "CONTINUUM_SELECTED_MODEL=$VERIFIED_MODEL"
          } >> "$GITHUB_ENV"
          echo "AA model route frozen before Gate C fixture generation; no in-turn model switching."

      - name: Calibrate evaluator against public fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys
          sys.path.insert(0, 'src')
          from aa.qualification.gate_c_heldout import run_calibration_controls
          result = run_calibration_controls()
          print('calibration controls_executed=' + str(result.to_dict()['controls_executed']))
          print('calibration failed_count=' + str(len(result.failed)))
          if not result.all_passed:
              raise SystemExit('evaluator calibration failed: ' + ','.join(result.failed))
          "

      - name: Pin evaluator baseline on merged main
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-c-heldout-out
          python3 scripts/pin_gate_c_evaluator_baseline.py \
            --out gate-c-heldout-out/gate_c_evaluator_baseline.json \
            --run-id "${{ github.run_id }}"
          # Baseline carries digests/versions only; safe to display.
          cat gate-c-heldout-out/gate_c_evaluator_baseline.json

      - name: Generate sealed held-out fixture with run-unique seed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${AA_BOOK_AGE_IDENTITY:-}" ]]; then
            echo "held-out generation BLOCKED: live prerequisites unavailable (typed external blocker, not a product FAIL)"
            printf '{"result":"BLOCKED","reason":"EXTERNAL_LIVE_PREREQUISITES_UNAVAILABLE"}\n' > gate-c-heldout-out/generation-status.json
            exit 0
          fi
          if python3 scripts/generate_gate_c_heldout.py \
            --out gate-c-heldout-out/gate_c_heldout.generated.json \
            --run-id "${{ github.run_id }}"; then
            printf '{"result":"OK","run_id":"%s"}\n' "${{ github.run_id }}" > gate-c-heldout-out/generation-status.json
          else
            status=$?
            echo "held-out generation BLOCKED (exit $status): no unseen fixture minted, regression strings never substituted"
            printf '{"result":"BLOCKED","run_id":"%s"}\n' "${{ github.run_id }}" > gate-c-heldout-out/generation-status.json
            # Keep the pinned baseline artifact; a missing fixture is a
            # typed external BLOCKED for downstream qualification, never
            # a workflow failure that masks the baseline.
            exit 0
          fi
          # Never print or archive prompt text: verify the artifact holds
          # opaque ids plus digests/counts only in its metadata surface.
          python3 -c "
          import json
          payload = json.load(open('gate-c-heldout-out/gate_c_heldout.generated.json'))
          assert payload['version'] == 'aa-gate-c-heldout-fixture/1', payload.get('version')
          print('heldout scenarios=' + str(len(payload['scenarios'])))
          "

      - name: Upload trusted baseline and sealed fixture
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-heldout-${{ github.run_id }}
          path: gate-c-heldout-out/
          retention-days: 90
