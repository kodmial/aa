name: AA bot fast fallback provisioning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aa-bot-fallback-one-time.yml'

permissions:
  contents: read

jobs:
  configure:
    if: github.repository == 'kodmial/aa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and set fast AA conversation models
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?TAP_PAT must allow Actions Variables write}"
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          upsert() {
            local name="$1" value="$2"
            local endpoint="repos/$REPOSITORY/actions/variables/$name"
            if gh api "$endpoint" --silent >/dev/null 2>&1; then
              gh api -X PATCH "$endpoint" -f name="$name" -f value="$value" --silent
            else
              gh api -X POST "repos/$REPOSITORY/actions/variables" -f name="$name" -f value="$value" --silent
            fi
            test "$(gh api "$endpoint" --jq .value)" = "$value" || {
              echo "::error::$name readback mismatch"; exit 2;
            }
          }
          upsert AA_BOT_PRIMARY_MODEL 'opencode/deepseek-v4.1-flash-free'
          upsert AA_BOT_FALLBACK_MODEL 'opencode/beam-free'
          echo 'AA chatbot model variables verified: primary DeepSeek V4.1 Flash; fallback Beam 1.0.'
