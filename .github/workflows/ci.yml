name: CI

on:
  push:
  pull_request:

# A feature branch emits both push and pull_request checks. Historically
# every small repair commit spawned two *full* Python/Torch/OpenCode installs
# plus full pytest/lint/mypy, while all older SHA runs continued consuming
# runners. Only current-head CI can qualify a PR; cancel obsolete runs.
concurrency:
  group: aa-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install OpenCode (local runtime for issue #2 checks)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install |
              bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Run canonical project verification
        run: bash scripts/verify.sh
