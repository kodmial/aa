name: CI

on:
  push:
  pull_request:

# A feature branch emits both push and pull_request checks. Historically
# every small repair commit spawned two *full* Python/Torch/OpenCode installs
# plus full pytest/lint/mypy, while all older SHA runs continued consuming
# runners. Only current-head CI can qualify a PR; cancel obsolete runs.
concurrency:
  group: aa-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install AA pinned OpenCode via verified Continuum toolchain
        uses: ./.github/actions/aa-opencode-toolchain

      - name: Run canonical project verification
        run: bash scripts/verify.sh
