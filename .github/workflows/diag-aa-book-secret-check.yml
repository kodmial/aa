name: Diagnostic AA book secret check

on:
  push:
    branches:
      - diag-aa-book-secret-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal crypto dependency
        run: python -m pip install cryptography
      - name: Verify AA book identity is configured and matches recipient
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          from aa.corpus.age_v1 import recipient_from_identity
          identity = os.environ.get("AA_BOOK_AGE_IDENTITY", "").strip()
          if not identity:
              print("AA_BOOK_AGE_IDENTITY: MISSING")
              raise SystemExit(2)
          committed = open("corpus/source/encrypted/recipient.txt", encoding="utf-8").read().strip()
          derived = recipient_from_identity(identity).strip()
          if derived != committed:
              print("AA_BOOK_AGE_IDENTITY: PRESENT_BUT_MISMATCHED")
              raise SystemExit(3)
          print("AA_BOOK_AGE_IDENTITY: PRESENT_AND_MATCHED")
          PY
