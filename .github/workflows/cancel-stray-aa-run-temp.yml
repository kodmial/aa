name: Temporary cancel stray AA runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stray-aa-run-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stray runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 37153827213 37153827220; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
            if [[ "$status" == "in_progress" || "$status" == "queued" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
            fi
          done
          echo "Cancellation requested."
