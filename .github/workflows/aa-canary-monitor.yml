name: AA canary monitor

on:
  workflow_run:
    workflows: ["AA canary"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aa-canary-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enter authoritative self-proving convergence
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const actionable = new Set([
              'failure',
              'timed_out',
              'action_required',
              'startup_failure',
              'stale',
            ]);
            if (!actionable.has(String(run.conclusion || ''))) {
              core.info(`AA canary conclusion is ${run.conclusion}; no convergence action required.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            const currentMain = String((main.commit && main.commit.sha) || '');

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'aa-self-proving-qualification.yml',
              branch: 'main',
              per_page: 30,
            });
            const active = (runs.workflow_runs || []).some(item =>
              String(item.head_sha || '') === currentMain &&
              ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(String(item.status || ''))
            );
            if (active) {
              core.notice('Canary failed; authoritative exact-main self-proving is already active.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'aa-self-proving-qualification.yml',
              ref: 'main',
              inputs: { required_sha: currentMain },
            });
            core.notice(
              `Canary failed; dispatched authoritative exact-main self-proving for ${currentMain.slice(0, 12)}. No generic canary P0 is created; gate-specific repair ownership stays with self-proving.`
            );
