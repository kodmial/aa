name: Encrypted corpus refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encrypted-corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Trusted repository context only: manual dispatch on the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check public recipient exists
        run: |
          test -f corpus/source/encrypted/recipient.txt
          grep -q '^age1' corpus/source/encrypted/recipient.txt
      - name: Verify identity matches committed recipient (#28)
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from aa.corpus.age_v1 import recipient_from_identity
          identity = os.environ.get("AA_BOOK_AGE_IDENTITY", "").strip()
          if not identity:
              print("AA_BOOK_AGE_IDENTITY is not configured", file=sys.stderr)
              raise SystemExit(1)
          committed = open("corpus/source/encrypted/recipient.txt", encoding="utf-8").read().strip()
          derived = recipient_from_identity(identity)
          if derived.strip() != committed:
              print(
                  f"configured identity does not match committed recipient "
                  f"(committed_hint={committed[-16:]})",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"identity matches committed recipient (hint={committed[-16:]})")
          PY
      - name: Fetch canonical sources (#3 bootstrap)
        run: python3 scripts/fetch_aa_source.py
      - name: Build canonical artifact (#3 bootstrap)
        run: python3 scripts/build_canonical.py
      - name: Refresh encrypted snapshot
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
        run: |
          python3 scripts/refresh_encrypted_snapshot.py \
            --recipient-file corpus/source/encrypted/recipient.txt
      - name: Verify restore from snapshot
        env:
          AA_BOOK_AGE_IDENTITY: ${{ secrets.AA_BOOK_AGE_IDENTITY }}
          AA_ALLOW_NETWORK_FETCH: "0"
        run: |
          rm -rf corpus/generated
          python3 scripts/restore_canonical.py
          python3 -c "from pathlib import Path; print('restored bytes:', Path('corpus/generated/canonical.json').stat().st_size)"
      - name: Ensure no plaintext corpus is staged
        run: |
          git status --porcelain
          if git ls-files --others --exclude-standard | grep -E 'canonical\.json$|AA\.txt$|doctors-opinion\.html$|\.tar\.zst$|AGE-SECRET-KEY' ; then
            echo "refusing to commit plaintext corpus or private key material" >&2
            exit 1
          fi
          git diff --name-only
      - name: Commit encrypted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/source/encrypted/canonical.tar.zst.age corpus/source/encrypted/metadata.json corpus/source/encrypted/recipient.txt
          if git diff --cached --quiet; then
            echo "encrypted snapshot is already up to date"
          else
            git commit -m "chore: refresh encrypted canonical snapshot"
            git push
          fi
